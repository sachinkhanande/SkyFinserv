    function fdImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const newEntities = [];
          const newLoans = [];

          // 1. Parse Business Details sheet
          const bizSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('business') || s.toLowerCase().includes('cam') || s.toLowerCase().includes('financial')) || workbook.SheetNames[0];
          const bizSheet = workbook.Sheets[bizSheetName];
          if (bizSheet) {
            const rows = XLSX.utils.sheet_to_json(bizSheet, { header: 1 });
            if (rows && rows.length > 2) {
              let roleRowIdx = -1, nameRowIdx = -1, dojRowIdx = -1, empRowIdx = -1, dobRowIdx = -1, addrRowIdx = -1, dateRowIdx = -1;
              const keyRowIndices = {};

              rows.forEach((r, idx) => {
                if (!r || !r[0]) return;
                const label = String(r[0]).trim().toLowerCase();
                if (label.includes('financial parameter') || label.includes('role') || label.includes('business details')) roleRowIdx = idx;
                if (label === 'name') nameRowIdx = idx;
                if (label.includes('doj') || label.includes('vintage')) dojRowIdx = idx;
                if (label.includes('business') && label.includes('employer')) empRowIdx = idx;
                if (label.includes('dob') || label.includes('age')) dobRowIdx = idx;
                if (label.includes('address')) addrRowIdx = idx;
                if (label.includes('itr') || label.includes('salary date')) dateRowIdx = idx;

                if (label.includes('turnover')) keyRowIndices['turnover'] = idx;
                if (label.includes('net business') || label.includes('net income') || label.includes('salary income')) keyRowIndices['netIncome'] = idx;
                if (label.includes('depreciation')) keyRowIndices['depreciation'] = idx;
                if (label.includes('interest')) keyRowIndices['interest'] = idx;
                if (label.includes('rent')) keyRowIndices['rent'] = idx;
                if (label.includes('additional income') || label.includes('remuneration')) keyRowIndices['addIncome'] = idx;
                if (label.includes('tax paid')) keyRowIndices['taxPaid'] = idx;
              });

              if (nameRowIdx !== -1) {
                const nameRow = rows[nameRowIdx];
                const roleRow = roleRowIdx !== -1 ? rows[roleRowIdx] : [];
                const dojRow = dojRowIdx !== -1 ? rows[dojRowIdx] : [];
                const empRow = empRowIdx !== -1 ? rows[empRowIdx] : [];
                const dobRow = dobRowIdx !== -1 ? rows[dobRowIdx] : [];
                const addrRow = addrRowIdx !== -1 ? rows[addrRowIdx] : [];
                const dateRow = dateRowIdx !== -1 ? rows[dateRowIdx] : [];

                for (let col = 1; col < nameRow.length; col += 3) {
                  const nameVal = nameRow[col];
                  if (!nameVal || String(nameVal).toLowerCase().includes('consider') || String(nameVal).toLowerCase().includes('average')) continue;

                  const roleVal = (roleRow && roleRow[col]) ? String(roleRow[col]) : 'Applicant';
                  const dojVal = (dojRow && dojRow[col]) ? String(dojRow[col]) : '';
                  const vintageVal = (dojRow && dojRow[col + 1]) ? String(dojRow[col + 1]) : '';
                  const empVal = (empRow && empRow[col]) ? String(empRow[col]) : '';
                  const dobVal = (dobRow && dobRow[col]) ? String(dobRow[col]) : '';
                  const ageVal = (dobRow && dobRow[col + 1]) ? String(dobRow[col + 1]) : '';
                  const addrVal = (addrRow && addrRow[col]) ? String(addrRow[col]) : '';

                  const y1Date = (dateRow && dateRow[col]) ? String(dateRow[col]) : '31-Oct-25';
                  const y2Date = (dateRow && dateRow[col + 1]) ? String(dateRow[col + 1]) : '23-Oct-24';
                  const y3Date = (dateRow && dateRow[col + 2]) ? String(dateRow[col + 2]) : '14-Oct-23';

                  const getVal = (key, cOffset) => {
                    const rIdx = keyRowIndices[key];
                    if (rIdx !== undefined && rows[rIdx]) {
                      const raw = rows[rIdx][col + cOffset];
                      return Number(raw) || 0;
                    }
                    return 0;
                  };

                  newEntities.push({
                    id: `ent-${newEntities.length + 1}`,
                    role: roleVal,
                    name: String(nameVal),
                    doj: dojVal,
                    vintage: vintageVal,
                    employer: empVal,
                    dob: dobVal,
                    age: ageVal,
                    businessAddress: addrVal,
                    years: [
                      { date: y1Date, turnover: getVal('turnover', 0), netIncome: getVal('netIncome', 0), depreciation: getVal('depreciation', 0), interest: getVal('interest', 0), rent: getVal('rent', 0), addIncome: getVal('addIncome', 0), taxPaid: getVal('taxPaid', 0) },
                      { date: y2Date, turnover: getVal('turnover', 1), netIncome: getVal('netIncome', 1), depreciation: getVal('depreciation', 1), interest: getVal('interest', 1), rent: getVal('rent', 1), addIncome: getVal('addIncome', 1), taxPaid: getVal('taxPaid', 1) },
                      { date: y3Date, turnover: getVal('turnover', 2), netIncome: getVal('netIncome', 2), depreciation: getVal('depreciation', 2), interest: getVal('interest', 2), rent: getVal('rent', 2), addIncome: getVal('addIncome', 2), taxPaid: getVal('taxPaid', 2) }
                    ]
                  });
                }
              }
            }
          }

          // 2. Parse Loan Details sheet
          const loanSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('loan') || s.toLowerCase().includes('obligation') || s.toLowerCase().includes('bt'));
          const loanSheet = loanSheetName ? workbook.Sheets[loanSheetName] : null;
          if (loanSheet) {
            const lRows = XLSX.utils.sheet_to_json(loanSheet, { header: 1 });
            if (lRows && lRows.length > 1) {
              let headerFound = false;
              for (const r of lRows) {
                if (!r || r.length === 0) continue;
                const col0 = String(r[0] || '').trim();
                if (col0.toLowerCase().includes('loan belows') || col0.toLowerCase().includes('loan belongs') || col0.toLowerCase().includes('borrower')) {
                  headerFound = true;
                  continue;
                }
                if (headerFound) {
                  if (!col0 || col0.toLowerCase().includes('total') || col0.toLowerCase().includes('principle') || col0.toLowerCase().includes('plan') || col0.toLowerCase().includes('eligibility')) break;
                  newLoans.push({
                    loanBelongsTo: col0,
                    loanProvider: r[1] || '',
                    type: r[2] || '',
                    amount: Number(r[3]) || '',
                    tenure: r[4] !== undefined && typeof r[4] !== 'string' ? r[4] : (r[4] || ''),
                    startDate: r[5] || '',
                    emi: Number(r[4]) || Number(r[6]) || '',
                    emiPaid: r[7] !== undefined ? r[7] : '',
                    outstanding: Number(r[5]) || Number(r[8]) || '',
                    overdueCharges: r[9] !== undefined ? r[9] : '',
                    bounceCount: r[10] !== undefined ? r[10] : '',
                    obligation: String(r[6] || r[11] || 'yes').toLowerCase() === 'yes' ? 'yes' : 'No',
                    bt: String(r[8] || r[13] || 'no').toLowerCase() === 'yes' ? 'yes' : 'No',
                    emiReflectedIn: r[16] || r[12] || ''
                  });
                }
              }
            }
          }

          if (newEntities.length > 0) state.fdData.entities = newEntities;
          if (newLoans.length > 0) state.fdData.loans = newLoans;

          render();
          fdSaveDatasheet();
          showToast(`Parsed Excel sheet into Financial Matrix! (${newEntities.length} entities, ${newLoans.length} loans)`, 'success');
        } catch (err) {
          showToast('Could not import Excel file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function appsExportExcel() {
      const apps = state.applications || [];
      if (apps.length === 0) {
        showToast('No applications to export.', 'warning');
        return;
      }
      const rows = [
        ['App No', 'Applicant Name', 'Mobile', 'Email', 'Applicant Type', 'Loan Type', 'Loan Amount', 'Status', 'Stage', 'City', 'Created Date']
      ];
      apps.forEach(a => {
        rows.push([
          a.appNo || '',
          [a.firstName, a.middleName, a.lastName].filter(Boolean).join(' '),
          a.mobile || '',
          a.email || '',
          a.applicantType || '',
          a.loanType || '',
          Number(a.requestedAmount) || 0,
          a.status || '',
          a.stage || '',
          a.city || '',
          a.createdDate || ''
        ]);
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, 'Loan Applications');
      XLSX.writeFile(wb, `SkyFinserv_Loan_Applications_${new Date().toISOString().slice(0, 10)}.xlsx`);
      showToast('Exported Loan Applications to Excel sheet!', 'success');
    }

    function appsImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          if (json && json.length > 1) {
            let count = 0;
            for (let i = 1; i < json.length; i++) {
              const row = json[i];
              if (!row || row.length === 0) continue;
              const appNo = row[0] || `APP-${Date.now()}-${i}`;
              const nameStr = String(row[1] || '').trim();
              const nameParts = nameStr.split(' ');
              const firstName = nameParts[0] || 'Applicant';
              const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';

              const newApp = {
                id: `app-${Date.now()}-${i}`,
                appNo: String(appNo),
                firstName: firstName,
                lastName: lastName,
                mobile: String(row[2] || ''),
                email: String(row[3] || ''),
                applicantType: row[4] || 'Individual',
                loanType: row[5] || 'Personal Loan',
                requestedAmount: Number(row[6]) || 500000,
                status: row[7] || 'Submitted',
                stage: row[8] || 'Underwriting',
                city: row[9] || '',
                createdDate: row[10] || new Date().toISOString().slice(0, 10)
              };
              state.applications.unshift(newApp);
              count++;
            }
            showToast(`Successfully imported ${count} loan applications from Excel!`, 'success');
            render();
          } else {
            showToast('Excel sheet empty or unreadable format.', 'error');
          }
        } catch (err) {
          showToast('Could not parse Excel file.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

          <table class="fd-table">
            <thead>
              <tr style="background:#1e293b;color:#fff;">
                <th style="background:#1e293b;color:#fff;">Loan belongs to</th>
                <th style="background:#1e293b;color:#fff;">Loan Provider</th>
                <th style="background:#1e293b;color:#fff;">Type</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">Amount</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">Tenur</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">Loan/ EMI Start Date</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">EMI / Interest</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">No. of EMI Paid</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">Outstanding Amount</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">Over due charges</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">No. Bounce</th>
                <th style="background:#f59e0b;color:#78350f;text-align:center;">Obligation</th>
                <th style="background:#f59e0b;color:#78350f;text-align:right;">EMI obligation</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">BT</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">BT EMI</th>
                <th style="background:#1e293b;color:#fff;text-align:right;">BT Amount</th>
                <th style="background:#334155;color:#fff;">EMI Reflected in</th>
                <th style="background:#1e293b;color:#fff;text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody>
              ${loans.map((l, lIdx) => {
        const isObl = String(l.obligation || '').toLowerCase() === 'yes';
        const isBt = String(l.bt || '').toLowerCase() === 'yes';
        const emiOblVal = isObl ? Number(l.emi || 0) : 0;
        const btEmiVal = isBt ? Number(l.emi || 0) : 0;
        const btAmtVal = isBt ? Number(l.outstanding || 0) : 0;
        const isYellow = l.outstanding == 9627863 || String(l.loanProvider || '').toLowerCase().includes('bajaj');

        return `
                <tr style="${isYellow ? 'background:#fef9c3;' : ''}">
                  <td><input class="fd-input" value="${l.loanBelongsTo || ''}" placeholder="Borrower name" oninput="fdUpdateLoanField(${lIdx},'loanBelongsTo',this.value)"/></td>
                  <td><input class="fd-input fd-bold" value="${l.loanProvider || ''}" placeholder="Bank / NBFC" oninput="fdUpdateLoanField(${lIdx},'loanProvider',this.value)"/></td>
                  <td><input class="fd-input" value="${l.type || ''}" placeholder="Type" oninput="fdUpdateLoanField(${lIdx},'type',this.value)"/></td>
                  <td><input class="fd-input fd-num-input" value="${l.amount !== undefined ? l.amount : ''}" placeholder="0" oninput="fdUpdateLoanField(${lIdx},'amount',this.value)"/></td>
                  <td style="width:70px;text-align:center;"><input class="fd-input" style="text-align:center;" value="${l.tenure !== undefined ? l.tenure : ''}" placeholder="Months" oninput="fdUpdateLoanField(${lIdx},'tenure',this.value)"/></td>
                  <td style="width:110px;text-align:center;"><input class="fd-input" style="text-align:center;" value="${l.startDate || ''}" placeholder="DD-MM-YYYY" oninput="fdUpdateLoanField(${lIdx},'startDate',this.value)"/></td>
                  <td><input class="fd-input fd-num-input" value="${l.emi !== undefined ? l.emi : ''}" placeholder="0" oninput="fdUpdateLoanField(${lIdx},'emi',this.value)"/></td>
                  <td style="width:80px;text-align:center;"><input class="fd-input" style="text-align:center;" value="${l.emiPaid !== undefined ? l.emiPaid : ''}" placeholder="-" oninput="fdUpdateLoanField(${lIdx},'emiPaid',this.value)"/></td>
                  <td style="${isYellow ? 'background:#fde047;font-weight:700;' : ''}"><input class="fd-input fd-num-input fd-bold" value="${l.outstanding !== undefined ? l.outstanding : ''}" placeholder="0" oninput="fdUpdateLoanField(${lIdx},'outstanding',this.value)"/></td>
                  <td><input class="fd-input fd-num-input" value="${l.overdueCharges !== undefined ? l.overdueCharges : ''}" placeholder="-" oninput="fdUpdateLoanField(${lIdx},'overdueCharges',this.value)"/></td>
                  <td style="width:80px;text-align:center;"><input class="fd-input" style="text-align:center;font-weight:700;color:#dc2626;" value="${l.bounceCount !== undefined ? l.bounceCount : ''}" placeholder="-" oninput="fdUpdateLoanField(${lIdx},'bounceCount',this.value)"/></td>
                  
                  <!-- Obligation toggle -->
                  <td style="text-align:center;background:#fffbe0;">
                    <select class="fd-input fd-bold" style="text-align:center;color:${isObl ? '#dc2626' : '#64748b'};" onchange="fdUpdateLoanField(${lIdx},'obligation',this.value)">
                      <option value="yes" ${isObl ? 'selected' : ''}>yes</option>
                      <option value="No" ${!isObl ? 'selected' : ''}>No</option>
                    </select>
                  </td>
                  
                  <!-- EMI Obligation (Auto-calculated) -->
                  <td class="fd-yellow-col fd-bold" style="text-align:right;color:${isObl ? '#dc2626' : '#475569'}; font-family:var(--font-mono);">
                    ${isObl ? fdFormatNum(emiOblVal) : '-'}
                  </td>

                  <!-- BT toggle -->
                  <td style="text-align:center;">
                    <select class="fd-input" style="text-align:center;" onchange="fdUpdateLoanField(${lIdx},'bt',this.value)">
                      <option value="No" ${!isBt ? 'selected' : ''}>No</option>
                      <option value="yes" ${isBt ? 'selected' : ''}>yes</option>
                    </select>
                  </td>

                  <!-- BT EMI & BT Amount (Auto-calculated) -->
                  <td style="text-align:right;font-family:var(--font-mono);">${isBt ? fdFormatNum(btEmiVal) : '-'}</td>
                  <td style="text-align:right;font-family:var(--font-mono);">${isBt ? fdFormatNum(btAmtVal) : '-'}</td>
                  
                  <td><input class="fd-input" value="${l.emiReflectedIn || ''}" placeholder="Account ref" oninput="fdUpdateLoanField(${lIdx},'emiReflectedIn',this.value)"/></td>
                  <td style="text-align:center;">
                    <button class="fd-remove-btn" title="Delete Loan Row" onclick="fdRemoveLoanRow(${lIdx})">✕</button>
                  </td>
                </tr>`;
      }).join('')}

              <!-- Total Row for Loan Details -->
              <tr style="background:#fef3c7;font-weight:700;border-top:2px solid #f59e0b;font-family:var(--font-mono);">
                <td style="font-weight:800;color:#78350f;">Total</td>
                <td></td>
                <td></td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totAmount)}</td>
                <td style="text-align:center;">${loanTotals.totTenure || '-'}</td>
                <td></td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totEmi)}</td>
                <td style="text-align:center;">${loanTotals.totEmiPaid || '-'}</td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totOutstanding)}</td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totOverdue)}</td>
                <td style="text-align:center;color:#dc2626;">${loanTotals.totBounce || '-'}</td>
                <td style="text-align:center;color:#dc2626;">No</td>
                <td style="text-align:right;color:#dc2626;font-size:13.5px;">${fdFormatNum(loanTotals.totEmiObligation)}</td>
                <td style="text-align:center;">-</td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totBtEmi)}</td>
                <td style="text-align:right;">${fdFormatNum(loanTotals.totBtAmount)}</td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>`;
    }


    /* =========================== INIT =========================== */
    (async function init() {
      try {
        const saved = JSON.parse(sessionStorage.getItem('skyfinserv_session') || localStorage.getItem('skyfinserv_user') || 'null');
        if (saved && saved.role) {
          state.admin = saved;
          state.view = 'portal-dashboard';
        } else {
          state.admin = null;
          state.view = 'admin-login';
        }
      } catch (e) {
        state.admin = null;
        state.view = 'admin-login';
      }

      await loadApplications();
      await loadDmRecords();
      await loadFdDatasheet();
      render();
    })();
  </script>
</body>

</html>
