    function appsImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          if (json && json.length > 1) {
            let count = 0;
            for (let i = 1; i < json.length; i++) {
              const row = json[i];
              if (!row || row.length === 0) continue;
              const appNo = row[0] || `APP-${Date.now()}-${i}`;
              const nameStr = String(row[1] || '').trim();
              const nameParts = nameStr.split(' ');
              const firstName = nameParts[0] || 'Applicant';
              const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';

              const newApp = {
                id: `app-${Date.now()}-${i}`,
                appNo: String(appNo),
                firstName: firstName,
                lastName: lastName,
                mobile: String(row[2] || ''),
                email: String(row[3] || ''),
                applicantType: row[4] || 'Individual',
                loanType: row[5] || 'Personal Loan',
                requestedAmount: Number(row[6]) || 500000,
                status: row[7] || 'Submitted',
                stage: row[8] || 'Underwriting',
                city: row[9] || '',
                createdDate: row[10] || new Date().toISOString().slice(0, 10)
              };
              state.applications.unshift(newApp);
              count++;
            }
            showToast(`Successfully imported ${count} loan applications from Excel!`, 'success');
            render();
          } else {
            showToast('Excel sheet empty or unreadable format.', 'error');
          }
        } catch (err) {
          showToast('Could not parse Excel file.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderFinancialDatasheetPage() {
      const data = state.fdData || defaultBlankDatasheet();
      const entities = data.entities || [];
      const loans = data.loans || [];
      const ec = data.emiCalculator || {};
      const banks = (data.bankingDetails && Array.isArray(data.bankingDetails))
        ? data.bankingDetails
        : (state.fdData && Array.isArray(state.fdData.bankingDetails) ? state.fdData.bankingDetails : []);
      if (!state.fdData.bankingDetails) {
        state.fdData.bankingDetails = banks;
      }
      const abbCols = getFdAbbColumns();
      const bankTotals = computeFdBankTotals();

      // GST Details
      const gstList = (data.gstDetailsList && Array.isArray(data.gstDetailsList) && data.gstDetailsList.length > 0)
        ? data.gstDetailsList
        : (data.gstDetails ? [data.gstDetails] : [defaultGstFirm()]);
      if (!state.fdData.gstDetailsList) {
        state.fdData.gstDetailsList = gstList;
      }
      const activeGstIdx = Math.min(Math.max(0, state.fdData.activeGstIdx || 0), gstList.length - 1);
      const curGst = gstList[activeGstIdx] || defaultGstFirm();
      const gstTotals = computeGstTotals(curGst);
      const monthNames = ['April', 'May', 'Jun', 'July', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];

      // Calculate totals
      const turnoverTot = computeFdTotals('turnover');
      const netTot = computeFdTotals('netIncome');
      const deprTot = computeFdTotals('depreciation');
      const intTot = computeFdTotals('interest');
      const rentTot = computeFdTotals('rent');
      const addIncTot = computeFdTotals('addIncome');
      const taxTot = computeFdTotals('taxPaid');

      const loanTotals = computeFdLoanTotals();

      const consideredCashflow = netTot.considerSum + deprTot.considerSum + intTot.considerSum + rentTot.considerSum + addIncTot.considerSum - taxTot.considerSum;
      const avg2yrCashflow = netTot.avg2yr + deprTot.avg2yr + intTot.avg2yr + rentTot.avg2yr + addIncTot.avg2yr - taxTot.avg2yr;

      const monthlyIncomeCapacity = Math.round((avg2yrCashflow > 0 ? avg2yrCashflow : consideredCashflow) / 12);
      const totalMonthlyObligations = loanTotals.totEmiObligation;
      const maxMonthlyEmi = Math.max(0, Math.round((monthlyIncomeCapacity * 0.5) - totalMonthlyObligations)); // FOIR after existing obligations
      // Approximate 15 year loan at 10.5% interest rate per lakh EMI factor ~ 1105
      const estimatedMaxLoan = Math.round((maxMonthlyEmi / 1105) * 100000);

      const dealFinanceAmount = (data.dealSummary && data.dealSummary.financeAmount !== undefined && data.dealSummary.financeAmount !== '') ? Number(data.dealSummary.financeAmount) : 0;
      const dealRoi = (data.dealSummary && data.dealSummary.roi !== undefined && data.dealSummary.roi !== '') ? Number(data.dealSummary.roi) : 0;
      const dealTenure = (data.dealSummary && data.dealSummary.tenureMonths !== undefined && data.dealSummary.tenureMonths !== '') ? Number(data.dealSummary.tenureMonths) : 0;
      let dealEmi = 0;
      if (dealFinanceAmount > 0 && dealRoi > 0 && dealTenure > 0) {
        const r = dealRoi / 12 / 100;
        dealEmi = Math.round(dealFinanceAmount * r * Math.pow(1 + r, dealTenure) / (Math.pow(1 + r, dealTenure) - 1));
      }
      const dealMaxCap = (data.dealSummary && data.dealSummary.maxCapacity) ? Number(data.dealSummary.maxCapacity) : 0;

      const allApps = state.applications || [];

            </select>

              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:11px;font-weight:500;color:#94a3b8;font-family:var(--font-mono);">Institutional Credit Appraisal Guidelines</span>
                <button class="btn btn-ghost btn-sm" onclick="state.showUnderwritingMatrix = false; render();" style="color:#cbd5e1;padding:2px 8px;font-size:11.5px;border:1px solid rgba(255,255,255,0.2);">🔒 Hide</button>
              </div>
            </div>

            <div style="background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding: 8px 14px; margin-bottom: 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
              <div style="font-size:13px;font-weight:700;color:#1e3a5f;display:flex;align-items:center;gap:8px;">
                <span>⚙ Benchmark Sizing Parameters:</span>
              </div>
              <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-family:var(--font-mono);font-weight:600;color:#1e293b;">
                <span style="background:#fff;padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;">FOIR: <b style="color:#2563eb;">60%</b> (50%-65%)</span>
                <span style="background:#fff;padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;">Max LAP LTV: <b style="color:#059669;">60%</b> (Max 70%)</span>
                <span style="background:#fff;padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;">ROI: <b style="color:#d97706;">10.50%</b></span>
                <span style="background:#fff;padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;">Tenure: <b style="color:#4f46e5;">180 Months</b></span>
                <span style="background:#dbeafe;padding:4px 10px;border-radius:6px;border:1px solid #93c5fd;color:#1e40af;">Per Lakh EMI Factor: <b>₹ 1,105</b></span>
              </div>
            </div>

            <div class="fd-matrix-container" style="overflow-x:auto;">
              <table class="fd-table">
                <thead>
                  <tr style="background:#0f172a;color:#ffffff;">
                    <th style="background:#0f172a;color:#ffffff;min-width:320px;">Eligibility Assessment Program / Model</th>
                    <th style="background:#0f172a;color:#ffffff;text-align:center;width:90px;">FOIR (%)</th>
                    <th style="background:#0f172a;color:#ffffff;text-align:center;width:90px;">LTV (%)</th>
                    <th style="background:#0f172a;color:#ffffff;text-align:right;width:180px;">Max Allowable EMI (₹)</th>
                    <th style="background:#0f172a;color:#ffffff;text-align:right;width:200px;">Loan Eligibility (₹)</th>
                    <th style="background:#0f172a;color:#ffffff;min-width:380px;">Underwriting Mathematical Logic & Credit Basis</th>
                  </tr>
                </thead>
                <tbody>
                  ${uModels.map((m, idx) => `
                    <tr>
                      <td style="font-weight:700;color:#1e3a5f;">${m.name}</td>
                      <td style="text-align:center;">${m.foir !== '-' && m.foir !== null ? (typeof m.foir === 'number' ? (m.foir * 100).toFixed(0) + '%' : m.foir) : '-'}</td>
                      <td style="text-align:center;">${m.ltv !== '-' && m.ltv !== null ? (typeof m.ltv === 'number' ? (m.ltv * 100).toFixed(0) + '%' : m.ltv) : '-'}</td>
                      <td style="text-align:right;font-family:var(--font-mono);font-weight:600;">${m.maxMonthlyEmi !== '-' && m.maxMonthlyEmi !== null && m.maxMonthlyEmi !== 0 ? fdFormatNum(m.maxMonthlyEmi) : '-'}</td>
                      <td style="text-align:right;font-family:var(--font-mono);font-weight:800;color:#2563eb;font-size:13.5px;">${m.eligibleLoan ? fdFormatNum(m.eligibleLoan) : '-'}</td>
                      <td style="font-size:11.5px;color:#475569;">${m.logic}</td>
                    </tr>
                    `).join('')}
                    <tr style="background:#fef3c7;border-top:3px solid #f59e0b;font-weight:800;">
                      <td style="color:#92400e;font-size:13px;">🏆 RECOMMENDED FINAL UNDERWRITER SANCTION CAPACITY</td>
                      <td style="text-align:center;">-</td>
                      <td style="text-align:center;">-</td>
                      <td style="text-align:right;">-</td>
                      <td style="text-align:right;font-family:var(--font-mono);font-size:16px;color:#b45309;font-weight:900;">${bindingLimit ? fdFormatNum(bindingLimit) : '-'}</td>
                      <td style="font-size:11.5px;color:#92400e;font-weight:700;">Binding Limit: Min( Primary Cashflow Capacity, Net LTV Collateral Limit )</td>
                    </tr>
                </tbody>
              </table>
            </div>
          </div>`;
        })()}

      </div>`;
    }

    window.addEventListener('click', (e) => {
      if (state && state.dmColumnDropdownOpen) {
        const wrap = document.getElementById('dm-col-dropdown-container');
        if (wrap && !wrap.contains(e.target)) {
          state.dmColumnDropdownOpen = false;
          render();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state && state.dmColumnDropdownOpen) {
        state.dmColumnDropdownOpen = false;
        render();
      }
    });

    /* =========================== INIT =========================== */
    (async function init() {
      try {
        const saved = JSON.parse(sessionStorage.getItem('skyfinserv_session') || localStorage.getItem('skyfinserv_user') || 'null');
        if (saved && saved.role) {
          state.admin = saved;
          state.view = 'portal-dashboard';
        } else {
          state.admin = null;
          state.view = 'admin-login';
        }
      } catch (e) {
        state.admin = null;
        state.view = 'admin-login';
      }
      try {
        const appLocal = localStorage.getItem('sf_applications_local');
        if (appLocal && (appLocal.includes('Padiya') || appLocal.includes('Skyfinserv001') || appLocal.includes('sachin01') || appLocal.includes('Sachinkhanande01'))) {
          localStorage.removeItem('sf_applications_local');
        }
        const dmLocal = localStorage.getItem('sf_dm_records_local');
        if (dmLocal && (dmLocal.includes('Padiya') || dmLocal.includes('Skyfinserv001') || dmLocal.includes('Maruti01') || dmLocal.includes('sachin01'))) {
          localStorage.removeItem('sf_dm_records_local');
        }
        const fdLocal = localStorage.getItem('sf_fd_datasheet_local');
        if (fdLocal && (fdLocal.includes('Padiya') || fdLocal.includes('Padia') || fdLocal.includes('Govind'))) {
          localStorage.removeItem('sf_fd_datasheet_local');
        }
        const fdStandalone = localStorage.getItem('sf_fd_standalone');
        if (fdStandalone && (fdStandalone.includes('Padiya') || fdStandalone.includes('Padia') || fdStandalone.includes('Govind'))) {
          localStorage.removeItem('sf_fd_standalone');
        }
      } catch (e) { }

      try {
        const sRes = await fetch('/api/settings');
        if (sRes.ok) {
          const sData = await sRes.json();
          if (sData && sData.exportFolder) state.exportFolder = sData.exportFolder;
        }
      } catch (e) { }

      await loadApplications();
      await loadDmRecords();
      await loadFdDatasheet();
      await loadUsersList();
      render();
    })();
  </script>
</body>

</html>
