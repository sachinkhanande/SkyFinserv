<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SkyFinserv — Loan Application Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* ── Core palette ── */
      --ink: #0D1B2A;
      --ink-soft: #1B2B3D;
      --paper: #F4F6FA;
      --paper-dim: #E8ECF4;
      --white: #FFFFFF;

      /* ── Brand colors ── */
      --navy: #0D1B2A;
      --navy2: #1A2E45;
      --navy3: #243B55;
      --gold: #F5A623;
      --gold-deep: #D4881A;
      --gold-light: #FEF3DC;
      --teal: #00B894;
      --teal-deep: #00897B;
      --teal-light: #E0F7F4;
      --blue: #2563EB;
      --blue-light: #EFF6FF;
      --purple: #7C3AED;
      --purple-light: #F5F3FF;
      --rose: #E11D48;
      --rose-light: #FFF1F2;
      --orange: #EA580C;
      --orange-light: #FFF7ED;

      /* ── UI ── */
      --slate: #4A5568;
      --slate-dim: #718096;
      --line: rgba(13, 27, 42, 0.10);
      --line-strong: rgba(13, 27, 42, 0.20);
      --shadow-sm: 0 1px 3px rgba(13, 27, 42, .08), 0 1px 2px rgba(13, 27, 42, .06);
      --shadow-md: 0 4px 16px rgba(13, 27, 42, .12), 0 2px 6px rgba(13, 27, 42, .08);
      --shadow-lg: 0 20px 40px rgba(13, 27, 42, .16), 0 8px 16px rgba(13, 27, 42, .10);
      --radius: 10px;
      --radius-lg: 14px;

      /* ── Legacy compat ── */
      --amber: #F5A623;
      --amber-deep: #D4881A;
      --clay: #E11D48;

      /* ── Fonts ── */
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(160deg, #f0f4ff 0%, #f4f6fa 40%, #f0faf8 100%);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 64px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, var(--navy3) 100%);
      color: var(--white);
      border-bottom: 3px solid var(--gold);
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--navy);
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(245, 166, 35, .4);
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 21px;
      letter-spacing: .2px;
      color: var(--white);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(255, 255, 255, .45);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
    }

    .nav-tab {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255, 255, 255, .7);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .12);
      transition: all .2s ease;
      letter-spacing: .01em;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, .1);
      color: var(--white);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: var(--navy);
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(245, 166, 35, .4);
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      width: 100%;
      overflow-x: hidden;
    }

    /* ── Shared buttons ── */
    .btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13.5px;
      padding: 10px 20px;
      border-radius: var(--radius);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(13, 27, 42, .25);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-md);
      filter: brightness(1.1);
    }

    .btn-primary:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
      filter: none;
    }

    .btn-ghost {
      background: var(--white);
      color: var(--ink);
      border-color: var(--line-strong);
    }

    .btn-ghost:hover {
      background: var(--paper-dim);
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: var(--navy);
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(245, 166, 35, .35);
      font-weight: 700;
    }

    .btn-amber:hover {
      box-shadow: 0 4px 18px rgba(245, 166, 35, .5);
      filter: brightness(1.05);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(0, 184, 148, .3);
    }

    .btn-success:hover {
      box-shadow: 0 4px 16px rgba(0, 184, 148, .45);
    }

    .btn-danger {
      background: var(--white);
      color: var(--rose);
      border-color: var(--rose);
    }

    .btn-danger:hover {
      background: var(--rose-light);
    }

    .btn-blue {
      background: linear-gradient(135deg, var(--blue) 0%, #1d4ed8 100%);
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .3);
    }

    .btn-blue:hover {
      box-shadow: 0 4px 16px rgba(37, 99, 235, .45);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 7px;
    }

    label.field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--slate);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input[type=text],
    input[type=email],
    input[type=tel],
    input[type=date],
    input[type=number],
    input[type=password],
    select,
    textarea {
      width: 100%;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink);
      padding: 10px 13px;
      border-radius: var(--radius);
      border: 1.5px solid var(--line-strong);
      background: var(--white);
      transition: border-color .15s ease, box-shadow .15s ease;
      box-shadow: var(--shadow-sm);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 166, 35, .18), var(--shadow-sm);
    }

    input.error,
    select.error,
    textarea.error {
      border-color: var(--rose);
      animation: shake .32s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-5px);
      }

      40% {
        transform: translateX(5px);
      }

      60% {
        transform: translateX(-3px);
      }

      80% {
        transform: translateX(3px);
      }
    }

    .error-msg {
      color: var(--rose);
      font-size: 12px;
      margin-top: 5px;
      font-weight: 600;
    }

    textarea {
      resize: vertical;
      min-height: 76px;
      font-family: var(--font-body);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    /* segmented control */
    .segmented {
      display: flex;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .segmented button {
      flex: 1;
      padding: 10px 8px;
      background: #fff;
      border: none;
      border-right: 1.5px solid var(--line);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--slate);
      cursor: pointer;
    }

    .segmented button:last-child {
      border-right: none;
    }

    .segmented button.active {
      background: var(--ink);
      color: var(--paper);
    }

    .card-radio-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-radio {
      padding: 10px 16px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--slate);
      background: #fff;
    }

    .card-radio.active {
      border-color: var(--amber);
      background: rgba(226, 166, 58, .12);
      color: var(--ink);
    }

    /* loan product picker */
    .loan-product-picker {
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 14px 16px;
      background: #fff;
    }

    .loan-product-picker.error {
      border-color: var(--clay);
    }

    .loan-product-group {
      margin-bottom: 14px;
    }

    .loan-product-group:last-child {
      margin-bottom: 0;
    }

    .loan-product-group-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--amber-deep);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .loan-product-group-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .loan-product-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--ink-soft);
      cursor: pointer;
      padding: 4px 0;
    }

    .loan-product-item input {
      width: auto;
      margin: 0;
      accent-color: var(--ink);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 200px;
    }

    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--paper-dim);
      border: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-soft);
      font-weight: 500;
      white-space: nowrap;
    }

    .chip.role {
      background: rgba(31, 138, 112, .10);
      color: var(--teal);
      border-color: rgba(31, 138, 112, .25);
    }

    .chip.type-salaried {
      background: rgba(31, 90, 180, .10);
      color: #1a5ab4;
      border-color: rgba(31, 90, 180, .25);
    }

    .chip.type-business {
      background: rgba(184, 110, 0, .10);
      color: var(--amber-deep);
      border-color: rgba(184, 110, 0, .25);
    }

    .chip.product {
      background: var(--paper-dim);
      border-color: var(--line);
      color: var(--ink-soft);
      font-size: 11px;
    }

    .products-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 160px;
    }

    .products-count {
      font-size: 11px;
      color: var(--slate-dim);
      margin-top: 2px;
    }

    /* ---------- PUBLIC WIZARD ---------- */
    .wizard-shell {
      display: flex;
      width: 100%;
      margin: 0;
      gap: 0;
      box-shadow: var(--shadow-lg);
      border-radius: 0;
      overflow: hidden;
      min-height: calc(100vh - 64px);
    }

    .ledger-rail {
      width: 280px;
      background: var(--ink);
      color: var(--paper);
      padding: 34px 26px;
      background-image:
        repeating-linear-gradient(180deg, rgba(247, 245, 240, 0.035) 0 1px, transparent 1px 34px);
    }

    .ledger-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .ledger-appno {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--amber);
      letter-spacing: .06em;
      margin-bottom: 32px;
      min-height: 16px;
    }

    .ledger-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px dashed rgba(247, 245, 240, .16);
      position: relative;
    }

    .ledger-step:first-of-type {
      border-top: none;
    }

    .stamp {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(247, 245, 240, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all .25s ease;
    }

    .ledger-step.done .stamp {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .ledger-step.active .stamp {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--ink);
      box-shadow: 0 0 0 5px rgba(226, 166, 58, .2);
    }

    .ledger-step .step-info b {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
    }

    .ledger-step .step-info span {
      font-size: 11.5px;
      color: var(--slate-dim);
    }

    .ledger-step.done .step-info b {
      color: var(--paper);
    }

    .ledger-step:not(.done):not(.active) .step-info b {
      color: rgba(247, 245, 240, .45);
    }

    .wizard-form-pane {
      flex: 1;
      background: #fff;
      padding: 38px 46px;
      position: relative;
      overflow: visible;
    }

    .pane-header {
      margin-bottom: 26px;
    }

    .pane-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--amber-deep);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }

    .pane-title {
      font-family: var(--font-display);
      font-size: 27px;
      font-weight: 600;
      margin: 4px 0 0;
    }

    .slide-track {
      position: relative;
      min-height: 380px;
    }

    .slide-pane {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;
      transition: transform .38s cubic-bezier(.2, .7, .3, 1), opacity .3s ease;
    }

    .slide-pane.enter-right {
      transform: translateX(60px);
      opacity: 0;
    }

    .slide-pane.enter-left {
      transform: translateX(-60px);
      opacity: 0;
    }

    .slide-pane.center {
      transform: translateX(0);
      opacity: 1;
    }

    .slide-pane.exit-left {
      transform: translateX(-60px);
      opacity: 0;
    }

    .slide-pane.exit-right {
      transform: translateX(60px);
      opacity: 0;
    }

    .smart-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--paper-dim);
      border-radius: 9px;
      margin-bottom: 22px;
      border: 1.5px solid var(--line);
    }

    .smart-copy span {
      font-size: 13.5px;
      font-weight: 600;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 99px;
      background: var(--line);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s ease;
    }

    .switch.on {
      background: var(--teal);
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s ease;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    .wizard-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    .step-dots {
      display: flex;
      gap: 6px;
    }

    .step-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
    }

    .step-dots span.active {
      background: var(--amber);
      width: 18px;
      border-radius: 3px;
    }

    /* ── Success screen ── */
    .success-screen {
      padding: 70px 46px;
      text-align: center;
      background: linear-gradient(135deg, var(--paper) 0%, #e8f4ff 100%);
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .success-screen .stamp-big {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      font-size: 40px;
      box-shadow: 0 8px 30px rgba(0, 184, 148, .4);
      animation: popIn .5s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popIn {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .success-screen h2 {
      font-family: var(--font-display);
      font-size: 30px;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .success-appno {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--teal-deep);
      background: var(--teal-light);
      border: 2px solid rgba(0, 184, 148, .3);
      display: inline-block;
      padding: 12px 28px;
      border-radius: var(--radius-lg);
      margin: 16px 0 24px;
      letter-spacing: .06em;
      box-shadow: var(--shadow-sm);
    }

    /* ── Advanced Dual Login Shell & Institutional Showcase ── */
    .login-container-wrapper {
      min-height: calc(100vh - 64px);
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 24px;
      position: relative;
      background: linear-gradient(145deg, #09131f 0%, #0f2136 50%, #08111c 100%);
      overflow: hidden;
      box-sizing: border-box;
    }

    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.32;
      pointer-events: none;
    }

    .login-orb-1 {
      width: 460px;
      height: 460px;
      background: var(--gold);
      top: -120px;
      left: -100px;
    }

    .login-orb-2 {
      width: 440px;
      height: 440px;
      background: #3b82f6;
      bottom: -120px;
      right: -80px;
    }

    .landing-content-grid {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 36px;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 1080px) {
      .landing-content-grid {
        grid-template-columns: 1fr;
        max-width: 580px;
        gap: 30px;
      }
    }

    .login-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      padding: 36px 32px 28px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(13, 27, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 10;
      animation: loginCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes loginCardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-shell h2 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--navy);
      text-align: center;
    }

    .login-shell p.sub {
      color: var(--slate);
      font-size: 13px;
      margin: 0 0 20px;
      text-align: center;
      line-height: 1.4;
    }

    /* Dual Login Tabs */
    .login-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
      position: relative;
    }

    .login-tab-btn {
      flex: 1;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--slate);
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .login-tab-btn.active {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(13, 27, 42, 0.2);
      font-weight: 700;
    }

    .login-tab-btn.active.admin-mode {
      background: linear-gradient(135deg, #f5a623 0%, #d4881a 100%);
      color: #0d1b2a;
      box-shadow: 0 4px 12px rgba(245, 166, 35, 0.35);
    }

    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-input-wrap input {
      width: 100%;
      padding-right: 44px !important;
    }

    .btn-pwd-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      padding: 4px;
      line-height: 1;
      opacity: 0.8;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-pwd-toggle:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.15);
    }

    .login-hint {
      margin-top: 16px;
      font-size: 11.5px;
      color: #78350f;
      background: #fef3c7;
      border: 1px solid rgba(245, 166, 35, 0.4);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    .login-desk-help {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(13, 27, 42, 0.08);
      font-size: 12.5px;
      color: #64748b;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .login-desk-help a {
      color: #0d1b2a;
      text-decoration: none;
      font-weight: 700;
    }

    .login-desk-help a:hover {
      text-decoration: underline;
      color: #f5a623;
    }

    .login-desk-help .desk-tag {
      color: #475569;
      font-weight: 600;
    }

    .login-error {
      color: var(--rose);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--rose-light);
      border-radius: 10px;
      border: 1px solid rgba(225, 29, 72, 0.25);
    }

    /* ── Right Institutional Showcase Panel ── */
    .landing-showcase-panel {
      color: #ffffff;
      padding: 6px 0;
      animation: loginCardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .landing-showcase-title {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #ffffff 30%, #f5a623 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .landing-showcase-sub {
      font-size: 14.5px;
      line-height: 1.55;
      color: #cbd5e1;
      margin: 0 0 20px;
      max-width: 660px;
    }

    .landing-features-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .landing-feature-card {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .landing-feature-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(245, 166, 35, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .feature-icon-box {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .feature-icon-box.icon-bank {
      background: rgba(59, 130, 246, 0.16);
      border-color: rgba(59, 130, 246, 0.32);
    }

    .feature-icon-box.icon-speed {
      background: rgba(245, 166, 35, 0.16);
      border-color: rgba(245, 166, 35, 0.32);
    }

    .feature-icon-box.icon-gem {
      background: rgba(6, 182, 212, 0.16);
      border-color: rgba(6, 182, 212, 0.32);
    }

    .feature-icon-box.icon-target {
      background: rgba(168, 85, 247, 0.16);
      border-color: rgba(168, 85, 247, 0.32);
    }

    .feature-card-content h4 {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 3px;
      letter-spacing: -0.01em;
    }

    .feature-card-content p {
      font-size: 12.8px;
      line-height: 1.48;
      color: #94a3b8;
      margin: 0;
    }

    /* Metrics Strip */
    .landing-metrics-strip {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 18px;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .metric-block {
      text-align: center;
      flex: 1;
    }

    .metric-num {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: #f5a623;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .metric-label {
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .metric-divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Support Details Section */
    .landing-support-box {
      margin-top: 18px;
    }

    .support-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .support-box-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #f5a623;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .support-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .support-live-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 7px #10b981;
      display: inline-block;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .support-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .support-cards-row {
        grid-template-columns: 1fr;
      }

      .landing-metrics-strip {
        flex-direction: column;
        gap: 14px;
      }

      .metric-divider {
        display: none;
      }
    }

    .support-channel-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .support-channel-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .support-channel-icon {
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .support-channel-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .support-channel-label {
      font-size: 9.5px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .support-channel-val {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .support-channel-val a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .support-channel-val a:hover {
      color: #f5a623;
      text-decoration: underline;
    }

    /* Floating Support Trigger */
    .floating-support-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f5a623 0%, #ea580c 100%);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
      z-index: 99;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .floating-support-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.55);
    }

    /* ---------- ADMIN DASHBOARD ---------- */
    /* ── Admin Shell ── */
    .admin-shell {
      display: flex;
      width: 100%;
    }

    .admin-sidebar {
      width: 230px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%);
      color: var(--white);
      padding: 28px 16px;
      min-height: calc(100vh - 64px);
      border-right: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 4px 0 20px rgba(13, 27, 42, .15);
    }

    .admin-sidebar .who {
      font-size: 11px;
      color: rgba(255, 255, 255, .45);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .admin-sidebar .role-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .06em;
      padding: 3px 10px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(245, 166, 35, .3);
    }

    .side-link {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
      cursor: pointer;
      background: rgba(245, 166, 35, .15);
      color: var(--gold);
      border-left: 3px solid var(--gold);
      transition: all .15s;
    }

    .side-link:hover {
      background: rgba(245, 166, 35, .25);
    }

    .admin-sidebar .btn-ghost {
      color: rgba(255, 255, 255, .7);
      border-color: rgba(255, 255, 255, .2);
      background: transparent;
    }

    .admin-sidebar .btn-ghost:hover {
      background: rgba(255, 255, 255, .08);
      color: var(--white);
      border-color: rgba(255, 255, 255, .35);
    }

    .admin-main {
      flex: 1;
      padding: 24px 28px;
      background: var(--paper);
      min-width: 0;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .admin-header h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      margin: 0;
      color: var(--ink);
    }

    /* ── Stats row & Portfolio AUM Card ── */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .portfolio-aum-card {
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      position: relative;
      overflow: hidden;
    }

    .portfolio-aum-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--navy) 0%, var(--blue) 40%, var(--gold) 75%, var(--teal) 100%);
    }

    .paum-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .paum-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-light);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .paum-title {
      margin: 0 0 4px 0;
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--ink);
      font-weight: 700;
    }

    .paum-sub {
      font-size: 13px;
      color: var(--slate);
    }

    .paum-live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--teal-deep);
      background: var(--teal-light);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 184, 148, 0.25);
    }

    .paum-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0% {
        opacity: 0.4;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }

      100% {
        opacity: 0.4;
        transform: scale(0.9);
      }
    }

    .paum-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .paum-metric-box {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .paum-metric-box:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .paum-metric-box.primary {
      border-top: 3.5px solid var(--blue);
    }

    .paum-metric-box.success {
      border-top: 3.5px solid var(--teal);
    }

    .paum-metric-box.teal {
      border-top: 3.5px solid #00897B;
    }

    .paum-metric-box.warning {
      border-top: 3.5px solid var(--gold);
    }

    .paum-metric-box .paum-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .paum-metric-box .paum-val {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }

    .paum-metric-box .paum-lbl {
      font-size: 12px;
      color: var(--slate);
      font-weight: 600;
      margin-top: 2px;
    }

    .paum-metric-box .paum-sub-stat {
      font-size: 11.5px;
      color: var(--slate-dim);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      font-weight: 500;
    }

    .paum-risk-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .paum-risk-row {
        grid-template-columns: 1fr;
      }
    }

    .paum-risk-card,
    .paum-product-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    .paum-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .paum-card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .paum-card-subtitle {
      font-size: 11px;
      color: var(--slate-dim);
    }

    .paum-progress-multi {
      height: 10px;
      border-radius: 5px;
      background: var(--paper-dim);
      display: flex;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .paum-bar.low {
      background: var(--teal);
    }

    .paum-bar.med {
      background: var(--gold);
    }

    .paum-bar.high {
      background: var(--rose);
    }

    .paum-risk-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .risk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .risk-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .risk-dot.low {
      background: var(--teal);
    }

    .risk-dot.med {
      background: var(--gold);
    }

    .risk-dot.high {
      background: var(--rose);
    }

    .risk-name {
      color: var(--slate);
      font-weight: 500;
    }

    .risk-val {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--ink);
    }

    .paum-product-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prod-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prod-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .prod-name {
      font-weight: 600;
      color: var(--slate);
    }

    .prod-amount {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink);
    }

    .prod-track {
      height: 6px;
      border-radius: 3px;
      background: var(--paper-dim);
      overflow: hidden;
    }

    .prod-fill {
      height: 100%;
      border-radius: 3px;
    }

    .stat-chip {
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      min-width: 120px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }

    .stat-chip:hover {
      box-shadow: var(--shadow-md);
    }

    .stat-chip:nth-child(1) {
      border-top: 3px solid var(--blue);
    }

    .stat-chip:nth-child(2) {
      border-top: 3px solid var(--gold);
    }

    .stat-chip:nth-child(3) {
      border-top: 3px solid var(--teal);
    }

    .stat-chip:nth-child(4) {
      border-top: 3px solid var(--rose);
    }

    .stat-chip b {
      display: block;
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-chip span {
      font-size: 11px;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar input[type=text] {
      max-width: 260px;
    }

    .toolbar select {
      max-width: 180px;
    }

    /* ── Data table ── */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--line);
      table-layout: fixed;
      box-shadow: var(--shadow-sm);
    }

    table.data-table th {
      text-align: left;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--white);
      padding: 11px 14px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      border-bottom: 1.5px solid var(--line);
      font-weight: 700;
    }

    table.data-table td {
      padding: 11px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      overflow: hidden;
    }

    table.data-table tr:last-child td {
      border-bottom: none;
    }

    table.data-table tr:hover td {
      background: rgba(245, 166, 35, .05);
    }

    .appno-cell {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: .02em;
    }

    .mask-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .mask-cell span:first-child {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--slate);
    }

    /* ── Admin card list ── */
    .admin-card-list {
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .ac-header {
      display: grid;
      grid-template-columns: 120px 1fr 1fr 140px 100px 170px 150px;
      padding: 9px 16px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      border-bottom: 1.5px solid var(--line);
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255, 255, 255, .8);
    }

    .ac-row {
      display: grid;
      grid-template-columns: 120px 1fr 1fr 140px 100px 170px 150px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
      transition: all .15s;
    }

    .ac-row:last-child {
      border-bottom: none;
    }

    .ac-row:hover {
      background: linear-gradient(90deg, rgba(245, 166, 35, .04) 0%, rgba(37, 99, 235, .03) 100%);
    }

    .ac-col {
      padding-right: 12px;
      min-width: 0;
      overflow: hidden;
    }

    .ac-appno .appno-cell {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--teal);
    }

    .ac-date {
      font-size: 11px;
      color: var(--slate-dim);
      margin-top: 3px;
    }

    .ac-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ac-sub {
      font-size: 11px;
      color: var(--slate);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ac-primary-product {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ac-extra-count {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: var(--amber-deep);
      padding: 1px 7px;
      border-radius: 20px;
    }

    .ac-aadhaar {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ac-aadhaar-val {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
    }

    .ac-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      overflow: visible;
      flex-shrink: 0;
    }

    /* ── Detail Page ── */
    .dp-section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--white);
      background: linear-gradient(135deg, var(--teal) 0%, var(--blue) 100%);
      padding: 7px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 184, 148, .25);
    }

    .dp-ro-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .dp-ro-field {
      display: flex;
      align-items: baseline;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }

    .dp-ro-field:last-child {
      border-bottom: none;
    }

    .dp-ro-label {
      font-size: 11.5px;
      color: var(--slate);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      width: 130px;
      flex-shrink: 0;
    }

    .dp-ro-val {
      font-size: 13.5px;
      color: var(--ink);
      flex: 1;
    }

    .dp-track-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dp-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dp-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .dp-input {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 8px 11px;
      outline: none;
      transition: all .15s;
      width: 100%;
      box-shadow: var(--shadow-sm);
    }

    .dp-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 166, 35, .15), var(--shadow-sm);
    }

    .reveal-link {
      font-size: 11px;
      color: var(--blue);
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      padding: 2px 7px;
      background: var(--blue-light);
      border-radius: 4px;
      transition: all .15s;
    }

    .reveal-link:hover {
      background: var(--blue);
      color: var(--white);
    }

    /* ── Status pills ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .status-pill.Submitted {
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid rgba(37, 99, 235, .2);
    }

    .status-pill.PendingApproval {
      background: var(--gold-light);
      color: var(--gold-deep);
      border: 1px solid rgba(245, 166, 35, .3);
    }

    .status-pill.Approved {
      background: var(--teal-light);
      color: var(--teal-deep);
      border: 1px solid rgba(0, 184, 148, .25);
    }

    .status-pill.Rejected {
      background: var(--rose-light);
      color: var(--rose);
      border: 1px solid rgba(225, 29, 72, .2);
    }

    .status-pill.Closed {
      background: var(--paper-dim);
      color: var(--slate);
      border: 1px solid var(--line-strong);
    }

    select.status-select {
      font-size: 12px;
      padding: 6px 8px;
      width: auto;
    }

    .row-actions {
      display: flex;
      gap: 8px;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--slate);
    }

    .empty-state .stamp {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border: 2px dashed var(--line-strong);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--slate-dim);
      background: var(--paper-dim);
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 27, 42, .6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 30px;
    }

    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      max-width: 820px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border-top: 4px solid var(--gold);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      border-bottom: 1.5px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 2;
    }

    .modal-head h3 {
      font-family: var(--font-display);
      font-size: 21px;
      margin: 0;
      color: var(--navy);
    }

    .modal-close {
      cursor: pointer;
      font-size: 20px;
      color: var(--slate);
      background: var(--paper-dim);
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .modal-close:hover {
      background: var(--rose-light);
      color: var(--rose);
    }

    .modal-body {
      padding: 24px 28px;
    }

    .modal-section-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--white);
      background: linear-gradient(135deg, var(--teal) 0%, var(--blue) 100%);
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-block;
      margin: 20px 0 12px;
    }

    .modal-section-title:first-child {
      margin-top: 0;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      padding: 18px 28px;
      border-top: 1.5px solid var(--line);
      background: var(--paper);
    }

    .toast {
      position: fixed;
      bottom: 26px;
      right: 26px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      color: var(--white);
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 200;
      animation: toastIn .25s ease;
    }

    @keyframes toastIn {
      from {
        transform: translateY(12px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .toast.success {
      border-left: 4px solid var(--teal);
      background: linear-gradient(135deg, var(--navy) 0%, #0d3320 100%);
    }

    .toast.error {
      border-left: 4px solid var(--rose);
      background: linear-gradient(135deg, var(--navy) 0%, #3d0d1a 100%);
    }

    .disclaimer-bar {
      background: linear-gradient(90deg, var(--navy) 0%, var(--navy2) 100%);
      border-top: none;
      color: rgba(255, 255, 255, .5);
      font-size: 11px;
      text-align: center;
      padding: 7px 20px;
      font-family: var(--font-mono);
      letter-spacing: .04em;
    }

    /* ── Single Page Form ── */
    .spf-shell {
      width: 100%;
      padding: 24px 32px 60px;
    }

    .spf-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      width: 100%;
    }

    .spf-title {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, var(--teal) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .spf-sub {
      font-size: 13.5px;
      color: var(--slate);
      margin-top: 6px;
    }

    .spf-search-wrap {
      flex-shrink: 0;
    }

    .spf-search {
      font-family: var(--font-body);
      font-size: 13.5px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 9px 14px;
      width: 280px;
      background: #fff;
      outline: none;
      color: var(--ink);
      transition: border-color .15s;
    }

    .spf-search:focus {
      border-color: var(--amber);
    }

    .spf-section {
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
      width: 100%;
    }

    .spf-section:hover {
      box-shadow: var(--shadow-md);
    }

    .spf-section.hidden {
      display: none;
    }

    .spf-section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--white);
      margin-bottom: 16px;
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      border-radius: var(--radius);
      display: inline-block;
    }

    .spf-section-badge {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--white);
      margin-bottom: 14px;
      padding: 7px 14px;
      background: linear-gradient(135deg, #008767 0%, #00b894 100%);
      border-radius: 6px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0, 184, 148, 0.25);
    }

    .spf-biz-banner {
      padding: 10px 16px;
      background: #e6f7f3;
      border: 1px solid #b2ebd9;
      color: #008767;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spf-grid3 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .spf-grid2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media(max-width:900px) {

      .spf-grid3,
      .spf-grid2 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .spf-span2 {
      grid-column: span 2;
    }

    .spf-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .spf-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .spf-input {
      font-family: var(--font-body);
      font-size: 13.5px;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 9px 13px;
      outline: none;
      transition: all .15s;
      width: 100%;
      box-shadow: var(--shadow-sm);
    }

    .spf-input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(245, 166, 35, .15), var(--shadow-sm);
    }

    .spf-textarea {
      min-height: 76px;
      resize: vertical;
      line-height: 1.5;
    }

    .addr-group {
      display: flex;
      flex-direction: column;
    }

    .addr-group input {
      border-radius: 0 !important;
    }

    .addr-group input:first-child {
      border-radius: var(--radius) var(--radius) 0 0 !important;
    }

    .addr-group input:last-child {
      border-radius: 0 0 var(--radius) var(--radius) !important;
    }

    .addr-group input+input {
      margin-top: -1.5px;
    }

    .addr-group input:focus {
      position: relative;
      z-index: 1;
    }

    .addr-group.error input {
      border-color: var(--rose);
    }

    .spf-radio-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .spf-radio {
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1.5px solid var(--line-strong);
      font-size: 13px;
      cursor: pointer;
      background: var(--white);
      color: var(--slate);
      transition: all .15s;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .spf-radio.active {
      border-color: var(--gold);
      background: var(--gold-light);
      color: var(--gold-deep);
      box-shadow: 0 2px 8px rgba(245, 166, 35, .25);
    }

    .spf-radio:hover:not(.active) {
      border-color: var(--gold);
      background: var(--gold-light);
    }

    .spf-selected-loan {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--teal-deep);
      background: var(--teal-light);
      border: 1.5px solid rgba(0, 184, 148, .3);
      border-radius: var(--radius);
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .spf-clear-btn {
      background: var(--white);
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 7px 12px;
      font-size: 13px;
      color: var(--slate);
      cursor: pointer;
      flex-shrink: 0;
      transition: all .15s;
    }

    .spf-clear-btn:hover {
      background: var(--rose-light);
      border-color: var(--rose);
      color: var(--rose);
    }

    .spf-info-bar {
      background: var(--blue-light);
      border: 1.5px solid rgba(37, 99, 235, .2);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--blue);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .spf-submit-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      border-radius: var(--radius-lg);
      padding: 20px 28px;
      margin-top: 8px;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: var(--shadow-md);
    }

    .spf-submit-bar>div {
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
    }

    .search-highlight {
      background: #FFF3CD;
      border-radius: 3px;
    }

    /* ── Loan type card grid ── */
    .lt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 4px;
    }

    .lt-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 10px;
      background: var(--white);
      cursor: pointer;
      transition: all .2s;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .lt-card:hover {
      border-color: var(--gold);
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .lt-card.lt-selected {
      border-color: var(--teal);
      background: var(--teal-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 184, 148, .25);
    }

    .lt-short {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 5px;
      letter-spacing: .02em;
    }

    .lt-card.lt-selected .lt-short {
      color: var(--teal-deep);
    }

    .lt-card:hover:not(.lt-selected) .lt-short {
      color: var(--gold-deep);
    }

    .lt-full {
      font-size: 10.5px;
      color: var(--slate);
      line-height: 1.3;
    }

    .lt-sub {
      font-size: 10px;
      color: var(--gold-deep);
      margin-top: 4px;
      font-style: italic;
    }

    /* ── Loan Manager Modal ── */
    .lm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 33, 61, .45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lm-modal {
      background: #fff;
      border-radius: 14px;
      width: 90%;
      max-width: 640px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    .lm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 14px;
      border-bottom: 1.5px solid var(--line);
      flex-shrink: 0;
    }

    .lm-add-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .lm-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 20px 16px;
    }

    .lm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .lm-row:last-child {
      border-bottom: none;
    }

    .lm-row-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .lm-row-edit {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      flex-wrap: wrap;
    }

    .lm-short-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      background: var(--paper-dim);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 8px;
      color: var(--ink);
      white-space: nowrap;
    }

    .lm-full-text {
      font-size: 13.5px;
      color: var(--ink);
      flex: 1;
    }

    .lm-sub-text {
      font-size: 11px;
      color: var(--amber-deep);
      font-style: italic;
    }

    .spf-pan-warn {
      margin-top: 8px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1.5px solid #f59e0b;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 12.5px;
      color: #92400e;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, .15);
    }

    .lm-row-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }

    /* ── Data Manager (Excel Spreadsheet Style) ── */
    .dm-kpi-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .dm-kpi-card {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dm-kpi-card .kpi-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .dm-kpi-card .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      font-family: var(--font-mono);
    }

    .dm-kpi-card.kpi-sanction .kpi-val {
      color: var(--teal-deep);
    }

    .dm-kpi-card.kpi-disb .kpi-val {
      color: var(--blue);
    }

    .dm-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .dm-filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .dm-search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 320px;
    }

    .dm-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
      opacity: 0.6;
    }

    .dm-search {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      outline: none;
      width: 100%;
      transition: border-color .15s;
    }

    .dm-search:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
    }

    .dm-select-filter {
      font-family: var(--font-body);
      font-size: 12.5px;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      outline: none;
      cursor: pointer;
      width: auto;
      min-width: 130px;
    }

    .dm-export-btn {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
      border: none;
      color: var(--white);
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(0, 184, 148, .3);
      transition: all .2s;
    }

    .dm-export-btn:hover {
      box-shadow: 0 4px 16px rgba(0, 184, 148, .45);
      filter: brightness(1.05);
    }

    .dm-count {
      font-size: 12px;
      color: var(--slate);
      font-weight: 600;
      margin-bottom: 8px;
    }

    /* Column visibility dropdown with checkboxes */
    .dm-col-dropdown-wrap {
      position: relative;
      display: inline-block;
    }

    .dm-col-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      background: #ffffff;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .dm-col-btn:hover {
      border-color: #3b82f6;
      background: #f8fafc;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .08);
    }

    .dm-col-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 295px;
      max-width: 330px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 14px 35px rgba(13, 27, 42, 0.20), 0 3px 10px rgba(13, 27, 42, 0.08);
      z-index: 100;
      padding: 12px 10px 10px;
      font-size: 12px;
      animation: dmFadeDown 0.15s ease-out;
    }

    @keyframes dmFadeDown {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dm-col-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 8px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }

    .dm-col-badge {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .dm-col-quick-actions {
      display: flex;
      gap: 6px;
      padding: 0 2px 8px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 8px;
    }

    .dm-col-act-btn {
      flex: 1;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }

    .dm-col-act-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .dm-col-search {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      font-size: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 7px;
      outline: none;
      background: #ffffff;
      font-family: var(--font-body);
      transition: border-color 0.15s;
    }

    .dm-col-search:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .dm-col-items-list {
      max-height: 290px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 2px;
    }

    .dm-col-items-list::-webkit-scrollbar {
      width: 5px;
    }

    .dm-col-items-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dm-col-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
      color: #334155;
    }

    .dm-col-item:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .dm-col-item.selected {
      color: #0f172a;
      font-weight: 500;
    }

    .dm-col-checkbox {
      margin: 0;
      cursor: pointer;
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .dm-col-idx {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: #94a3b8;
      width: 20px;
      flex-shrink: 0;
      text-align: right;
    }

    .dm-col-label {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Excel Table Grid */
    .dm-table-wrap {
      overflow: auto;
      max-height: 65vh;
      border: 1.5px solid #a6b9d8;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    .dm-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      white-space: nowrap;
      font-size: 12px;
      font-family: var(--font-body);
    }

    .dm-table th {
      background: #d9e1f2;
      color: #1f3864;
      font-size: 11.5px;
      font-weight: 700;
      border-right: 1px solid #b4c6e7;
      border-bottom: 2px solid #8ea9db;
      padding: 8px 10px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      position: sticky;
      top: 0;
      z-index: 10;
      user-select: none;
    }

    .dm-table td {
      padding: 7px 10px;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      color: #1e293b;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sticky columns for Excel view */
    .dm-table th.sticky-1,
    .dm-table td.sticky-1 {
      position: sticky;
      left: 0;
      width: 85px;
      min-width: 85px;
      max-width: 85px;
      box-sizing: border-box;
      z-index: 11;
      border-right: 1px solid #b4c6e7;
    }

    .dm-table th.sticky-2,
    .dm-table td.sticky-2 {
      position: sticky;
      left: 85px;
      width: 100px;
      min-width: 100px;
      max-width: 100px;
      box-sizing: border-box;
      z-index: 11;
      border-right: 1px solid #b4c6e7;
    }

    .dm-table th.sticky-3,
    .dm-table td.sticky-3 {
      position: sticky;
      left: 185px;
      width: 140px;
      min-width: 140px;
      max-width: 140px;
      box-sizing: border-box;
      z-index: 11;
      border-right: 1px solid #b4c6e7;
      color: #0f172a;
      font-weight: 600;
    }

    .dm-table th.sticky-4,
    .dm-table td.sticky-4 {
      position: sticky;
      left: 325px;
      width: 150px;
      min-width: 150px;
      max-width: 150px;
      box-sizing: border-box;
      z-index: 11;
      border-right: 2px solid #8ea9db;
    }

    /* Top-left sticky headers (intersection of top sticky & left sticky) */
    .dm-table th.sticky-1,
    .dm-table th.sticky-2,
    .dm-table th.sticky-3,
    .dm-table th.sticky-4 {
      z-index: 25;
      background: #d9e1f2 !important;
      top: 0;
    }

    .dm-table th.sticky-right {
      position: sticky;
      right: 0;
      top: 0;
      z-index: 25;
      background: #d9e1f2 !important;
      border-left: 2px solid #8ea9db;
      box-shadow: -2px 0 6px rgba(0, 0, 0, 0.06);
    }

    .dm-table td.sticky-right {
      position: sticky;
      right: 0;
      z-index: 11;
      border-left: 2px solid #8ea9db;
      box-shadow: -2px 0 6px rgba(0, 0, 0, 0.06);
    }

    /* Opaque backgrounds for sticky body cells to prevent transparent background bleed during horizontal scroll */
    .dm-table td.sticky-1,
    .dm-table td.sticky-2,
    .dm-table td.sticky-3,
    .dm-table td.sticky-4,
    .dm-table td.sticky-right {
      background: #ffffff;
    }

    .dm-table tr:nth-child(even) td.sticky-1,
    .dm-table tr:nth-child(even) td.sticky-2,
    .dm-table tr:nth-child(even) td.sticky-3,
    .dm-table tr:nth-child(even) td.sticky-4,
    .dm-table tr:nth-child(even) td.sticky-right {
      background: #f8fafc;
    }

    .dm-table tr.month-highlight td.sticky-1,
    .dm-table tr.month-highlight td.sticky-2,
    .dm-table tr.month-highlight td.sticky-3,
    .dm-table tr.month-highlight td.sticky-4,
    .dm-table tr.month-highlight td.sticky-right {
      background: #fce4d6 !important;
    }

    .dm-table tr:hover td.sticky-1,
    .dm-table tr:hover td.sticky-2,
    .dm-table tr:hover td.sticky-3,
    .dm-table tr:hover td.sticky-4,
    .dm-table tr:hover td.sticky-right {
      background: #e2efda !important;
    }

    .dm-table tr.month-highlight td {
      background: #fce4d6 !important;
    }

    .dm-table tr:nth-child(even) td {
      background: #f8fafc;
    }

    .dm-table tr:hover td {
      background: #e2efda !important;
    }

    /* Decision Pill Badges */
    .dm-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dm-badge-sanction {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .dm-badge-disbursed {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .dm-badge-login {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .dm-badge-filesend {
      background: #f3e8ff;
      color: #6b21a8;
      border: 1px solid #e9d5ff;
    }

    .dm-badge-default {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .dm-actions {
      display: flex;
      gap: 4px;
    }

    .dm-edit-btn,
    .dm-delete-btn {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper);
      transition: all .15s;
    }

    .dm-edit-btn:hover {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .dm-delete-btn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    .dm-empty {
      text-align: center;
      padding: 45px;
      color: var(--slate);
      font-size: 14px;
    }

    /* Data Manager Modal - Sectioned Layout */
    .dm-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .65);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .dm-modal {
      background: #fff;
      border-radius: 14px;
      width: 94%;
      max-width: 860px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .28);
      overflow: hidden;
    }

    .dm-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1.5px solid var(--line);
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      color: #fff;
      flex-shrink: 0;
    }

    .dm-modal-close-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .dm-modal-close-btn:hover {
      background: #ef4444;
      border-color: #dc2626;
      color: #ffffff;
      transform: scale(1.05);
    }

    .dm-modal-tabs {
      display: flex;
      background: var(--paper-dim);
      border-bottom: 1.5px solid var(--line);
      overflow-x: auto;
      flex-shrink: 0;
      padding: 4px 16px 0;
      gap: 4px;
    }

    .dm-modal-tab {
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      color: var(--slate);
      background: transparent;
      border: 1px solid transparent;
      transition: all .15s;
      white-space: nowrap;
    }

    .dm-modal-tab:hover {
      color: var(--navy);
      background: rgba(255, 255, 255, .6);
    }

    .dm-modal-tab.active {
      background: #fff;
      color: var(--navy);
      border-color: var(--line);
      border-bottom-color: #fff;
      font-weight: 700;
    }

    .dm-modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .dm-form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }

    @media (max-width: 640px) {
      .dm-form-grid {
        grid-template-columns: 1fr;
      }
    }

    .dm-field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dm-field-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dm-input,
    .dm-select {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--ink);
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      outline: none;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;

    .dm-input:focus,
    .dm-select:focus {
      border-color: #3b82f6;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
    }

    .dm-modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-top: 1.5px solid var(--line);
      flex-shrink: 0;
      background: var(--paper);
    }

    /* ── Financial Datasheet (CAM Assessment Matrix) — Modern Professional UI ── */
    .fd-wrapper {
      padding: 24px 32px 60px;
      width: 100%;
      min-width: 0;
    }

    .fd-kpi-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 14px;
    }

    .fd-kpi-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);

      overflow: hidden;
      transition: all 0.2s ease;

    .fd-kpi-card.yellow::before {

    }

    .fd-kpi-card .fd-kpi-lbl {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .fd-kpi-card .fd-kpi-val {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    .fd-kpi-card.highlight .fd-kpi-val {
      color: #047857;
    }

    .fd-kpi-card.yellow .fd-kpi-val {

      border: 1px solid #cbd5e1;
      border-radius: 14px;

    .fd-table {

      white-space: nowrap;

    .fd-remove-btn {

      background: rgba(239, 68, 68, 0.2);

      height: 22px;
      border-radius: 50%;

      display: inline-flex;

      justify-content: center;
      font-size: 11px;
      transition: all 0.15s ease;

    .fd-remove-btn:hover {
