              ${state.editingAppId ? `<span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:3px 10px;border-radius:20px;font-weight:700;border:1px solid #7dd3fc;white-space:nowrap;display:inline-flex;align-items:center;">✏️ Editing Application: ${state.form.appNo || state.editingAppId}</span>` : `<span style="font-size:11px;background:#f0fdf4;color:#15803d;padding:3px 10px;border-radius:20px;font-weight:700;border:1px solid #86efac;white-space:nowrap;display:inline-flex;align-items:center;">✨ New Application Mode</span>`}
            </div>
            <div style="font-size:12px;color:var(--slate);margin-top:4px;">Search existing applications by App ID or Applicant Name to load/update, or start a new form.</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <button type="button" class="btn btn-primary btn-sm" onclick="createNewApplicationForm()" style="font-size:12.5px;padding:8px 16px;box-shadow:var(--shadow-sm);white-space:nowrap;">＋ Create New Application</button>
          </div>
        </div>

        <div style="position:relative;margin-top:10px;">
          <input class="spf-input" style="padding-left:14px;height:42px;font-size:14px;border:1.5px solid var(--navy3);" value="${state.masterSearchQuery || ''}" placeholder="🔍 Search by Application ID (e.g. SKF-2026-...) or Applicant Name (e.g. Rajesh / Padiya)..." oninput="state.masterSearchQuery=this.value; render()"/>
        </div>

        ${(() => {
          const q = (state.masterSearchQuery || '').trim().toLowerCase();
          const allApps = state.applications || [];

          if (!q) {
            return `
              <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--slate);padding:8px 12px;background:#f1f5f9;border-radius:6px;">
                ${state.admin ? `<span>Total Saved Master Applications: <strong>${allApps.length}</strong></span>` : '<span>Search Application</span>'}
                <span>Type in the search box above to find and edit your application.</span>
              </div>
            `;
          }

          const displayApps = allApps.filter(a => {
            const appNoMatch = (a.appNo || '').toLowerCase().includes(q);
            const nameMatch = `${a.firstName || ''} ${a.middleName || ''} ${a.lastName || ''}`.toLowerCase().includes(q);
            const bizMatch = (a.businessName || '').toLowerCase().includes(q);
            const mobileMatch = (a.currContact || a.empContact || '').includes(q);
            return appNoMatch || nameMatch || bizMatch || mobileMatch;
          });

          if (displayApps.length === 0) {
            return `
              <div style="margin-top:12px;padding:12px;background:#fff1f2;border:1px solid #fecdd3;border-radius:8px;color:#be123c;font-size:13px;font-weight:600;">
                No saved applications found matching "${q}".
              </div>
            `;
          }

          return `
            <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--slate);padding:6px 12px;background:#f1f5f9;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:none;">
              <span>Search Matches (${displayApps.length}):</span>
              <span>Click <strong>✏️ Load & Edit</strong> to modify application</span>
            </div>
            <div style="max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 8px 8px;background:#fff;">
              ${displayApps.map(a => {
            const name = `${a.firstName || ''} ${a.middleName || ''} ${a.lastName || ''}`.trim() || a.businessName || 'Applicant';
            const isCurrent = String(state.editingAppId) === String(a.id) || (state.form.appNo && state.form.appNo === a.appNo);
            return `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f1f5f9;background:${isCurrent ? '#eff6ff' : '#fff'};">
                    <div>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <strong style="font-size:13.5px;color:var(--navy);">${a.appNo || 'SKF-APP'}</strong>
                        <span style="font-size:12px;font-weight:600;color:var(--slate);">— ${name}</span>
                        <span class="status-pill status-${statusClass(a.status || 'Submitted')}" style="font-size:10px;padding:2px 8px;">${a.status || 'Submitted'}</span>
                      </div>
                      <div style="font-size:11.5px;color:var(--slate-dim);margin-top:2px;">
                        Product: ${a.assignedProduct || (a.loanProducts ? a.loanProducts.join(', ') : 'Loan')} | Amount: ₹${Number(a.requestedAmount || 0).toLocaleString('en-IN')} | Branch: ${a.branch || 'Main'}
                      </div>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                      <button type="button" class="btn ${isCurrent ? 'btn-amber' : 'btn-primary'} btn-sm" style="font-size:11.5px;padding:5px 12px;font-weight:700;" onclick="loadApplicationIntoForm('${a.id}')">✏️ ${isCurrent ? 'Currently Editing' : 'Load & Edit'}</button>
                      <button type="button" class="btn btn-danger btn-sm" style="font-size:11.5px;padding:5px 9px;" onclick="deleteApplicationById('${a.id}')">🗑️ Delete</button>
                    </div>
                  </div>
                `;
          }).join('')}
            </div>
          `;
        })()}
      </div>

      <!-- ── SECTION 1: Application Information ── -->
      <div class="spf-section" data-section="app-info">
        <div class="spf-section-title">1. Application Information</div>
        <div class="spf-grid3">
          <div class="spf-field" style="grid-column: span 2;">
            <label class="spf-label">Application Unique ID / App No. <span style="font-weight:400;color:var(--slate);">(Type manual ID or click Generate)</span></label>
            <div style="display:flex;gap:8px;">
              <input class="spf-input" data-f="appNo" value="${F.appNo || ''}" placeholder="e.g. SKF-2026-89412 or custom ID"/>
              <button type="button" class="btn btn-ghost btn-sm" onclick="generateManualAppNo()" style="white-space:nowrap;font-size:12px;padding:8px 14px;border:1.5px solid var(--line);">⚡ Generate ID</button>
            </div>
          </div>
          <div class="spf-field"><label class="spf-label">Connector Name</label><input class="spf-input" data-f="connector" value="${F.connector || ''}" placeholder="Sourcing / Channel Partner"/></div>
          <div class="spf-field"><label class="spf-label">Application Date</label><input class="spf-input" type="date" data-f="appDate" value="${F.appDate || ''}"/></div>
          <div class="spf-field"><label class="spf-label">Branch</label><input class="spf-input" data-f="branch" value="${F.branch || ''}" placeholder="e.g. Mumbai Main"/></div>
          <div class="spf-field"><label class="spf-label">RM / SM Name</label><input class="spf-input" data-f="rmName" value="${F.rmName || ''}" placeholder="Relationship Manager"/></div>
          
          <div class="spf-field"><label class="spf-label">Applying As</label>
            <select class="spf-input" data-f="applicantRole">
              <option value="">Select role…</option>
              ${APPLICANT_ROLES.map(r => `<option ${F.applicantRole === r ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Employment Category</label>
            <select class="spf-input" data-f="applicantType" onchange="render()">
              <option ${F.applicantType === 'Salaried' ? 'selected' : ''}>Salaried</option>
              <option ${F.applicantType === 'Business / Self-Employed' ? 'selected' : ''}>Business / Self-Employed</option>
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Primary Loan Product Requested *</label>
            <select class="spf-input" onchange="state.form.loanProducts = [this.value]; render()">
              <option value="">Select loan product…</option>
              ${ALL_LOAN_PRODUCTS.map(p => `<option ${(F.loanProducts || [])[0] === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Requested Amount (₹)</label><input class="spf-input" type="number" data-f="requestedAmount" value="${F.requestedAmount || ''}" placeholder="e.g. 2500000"/></div>
          <div class="spf-field"><label class="spf-label">Tenure (Months)</label><input class="spf-input" type="number" data-f="tenureMonths" value="${F.tenureMonths || ''}" placeholder="e.g. 240"/></div>
          <div class="spf-field"><label class="spf-label">Loan Purpose</label><input class="spf-input" data-f="loanPurpose" value="${F.loanPurpose || ''}" placeholder="e.g. Home purchase / Business expansion"/></div>
        </div>
      </div>

      <!-- ── SECTION 2: Borrower Personal & Identity Details ── -->
      <div class="spf-section" data-section="personal">
        <div class="spf-section-title">2. Borrower Information & Identity</div>
        <div class="spf-grid3">
          <div class="spf-field"><label class="spf-label">First Name</label><input class="spf-input" data-f="firstName" value="${F.firstName}" placeholder="First name"/></div>
          <div class="spf-field"><label class="spf-label">Middle Name</label><input class="spf-input" data-f="middleName" value="${F.middleName}" placeholder="Middle name"/></div>
          <div class="spf-field"><label class="spf-label">Last Name</label><input class="spf-input" data-f="lastName" value="${F.lastName}" placeholder="Last name"/></div>
          <div class="spf-field"><label class="spf-label">Residency Status</label>
            <select class="spf-input" data-f="residencyStatus">
              ${['Indian', 'NRI'].map(r => `<option ${(F.residencyStatus || 'Indian') === r ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Gender</label>
            <select class="spf-input" data-f="gender">
              <option value="">Select…</option>
              ${['Male', 'Female', 'Other'].map(g => `<option ${F.gender === g ? 'selected' : ''}>${g}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field">
            <label class="spf-label">Date of Birth <span style="font-weight:400;color:var(--teal);margin-left:6px;">(Age: ${ageDisplay})</span></label>
            <input class="spf-input" type="date" data-f="dob" value="${F.dob}" oninput="render()"/>
          </div>
          <div class="spf-field"><label class="spf-label">Marital Status</label>
            <select class="spf-input" data-f="maritalStatus">
              <option value="">Select…</option>
              ${['Single', 'Married', 'Divorced', 'Widowed'].map(o => `<option ${F.maritalStatus === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Education</label>
            <select class="spf-input" data-f="education">
              <option value="">Select…</option>
              ${['High School', 'Graduate', 'Post Graduate', 'Doctorate', 'Other'].map(o => `<option ${F.education === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Father's Name</label><input class="spf-input" data-f="fatherName" value="${F.fatherName}" placeholder="Father's full name"/></div>
          <div class="spf-field"><label class="spf-label">Mother's Maiden Name</label><input class="spf-input" data-f="mothersMaidenName" value="${F.mothersMaidenName}" placeholder="Mother's maiden name"/></div>

          <div class="spf-field">
            <label class="spf-label">PAN Card Available?</label>
            <select class="spf-input" data-f="panAvailable" onchange="render()">
              <option value="Yes" ${(F.panAvailable || 'Yes') === 'Yes' ? 'selected' : ''}>Yes — Available</option>
              <option value="No" ${F.panAvailable === 'No' ? 'selected' : ''}>No — Not Available</option>
            </select>
          </div>

          <div class="spf-field">
            <label class="spf-label">Aadhaar Card Available?</label>
            <select class="spf-input" data-f="aadhaarAvailable" onchange="render()">
              <option value="Yes" ${(F.aadhaarAvailable || 'Yes') === 'Yes' ? 'selected' : ''}>Yes — Available</option>
              <option value="No" ${F.aadhaarAvailable === 'No' ? 'selected' : ''}>No — Not Available</option>
            </select>
          </div>

          <div class="spf-field"><label class="spf-label">Passport Number</label><input class="spf-input" data-f="passportNo" value="${F.passportNo || ''}" placeholder="Passport No." style="text-transform:uppercase"/></div>
          <div class="spf-field"><label class="spf-label">Voter ID</label><input class="spf-input" data-f="voterId" value="${F.voterId || ''}" placeholder="Voter ID No." style="text-transform:uppercase"/></div>
          <div class="spf-field"><label class="spf-label">Driving Licence</label><input class="spf-input" data-f="drivingLicence" value="${F.drivingLicence || ''}" placeholder="DL No." style="text-transform:uppercase"/></div>
        </div>

        <!-- Addresses -->
        <div class="spf-section-title" style="margin-top:18px;">Borrower Address Details</div>
        <div class="spf-grid3">
          <div class="spf-field spf-span2"><label class="spf-label">Current Address</label><textarea class="spf-input spf-textarea" data-f="currAddress" placeholder="House no., Street, Area">${F.currAddress}</textarea></div>
          <div class="spf-field"><label class="spf-label">City</label><input class="spf-input" data-f="currCity" value="${F.currCity}" placeholder="City"/></div>
          <div class="spf-field"><label class="spf-label">State</label>
            <select class="spf-input" data-f="currState">
              <option value="">Select state…</option>
              ${['Andhra Pradesh', 'Arunachal Pradesh', 'Assam', 'Bihar', 'Chhattisgarh', 'Goa', 'Gujarat', 'Haryana', 'Himachal Pradesh', 'Jharkhand', 'Karnataka', 'Kerala', 'Madhya Pradesh', 'Maharashtra', 'Manipur', 'Meghalaya', 'Mizoram', 'Nagaland', 'Odisha', 'Punjab', 'Rajasthan', 'Sikkim', 'Tamil Nadu', 'Telangana', 'Tripura', 'Uttar Pradesh', 'Uttarakhand', 'West Bengal', 'Delhi', 'Jammu & Kashmir', 'Ladakh', 'Puducherry'].map(s => `<option ${F.currState === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Pin Code</label><input class="spf-input" data-f="currPincode" value="${F.currPincode}" placeholder="6-digit pin" maxlength="6"/></div>
          <div class="spf-field"><label class="spf-label">Occupancy Type</label>
            <select class="spf-input" data-f="currOccupancy">
              <option value="">Select…</option>
              ${['Owned', 'Rented', 'Company Provided', 'Family Owned', 'Others'].map(o => `<option ${F.currOccupancy === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Years at Current Address</label>
            <select class="spf-input" data-f="currVintage">
              <option value="">Select…</option>
              ${['< 1 year', '1–2 years', '2–5 years', '5–10 years', '10+ years'].map(o => `<option ${F.currVintage === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Mobile Contact No.</label><input class="spf-input" type="tel" data-f="currContact" value="${F.currContact}" placeholder="10-digit mobile" maxlength="10"/></div>
        </div>

        <div style="margin:14px 0 10px;display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="same-addr" ${F.sameAsCurrent ? 'checked' : ''} onchange="setSameAddr(this.checked)"/>
          <label for="same-addr" style="font-size:13px;cursor:pointer;color:var(--slate);font-weight:600;">✓ Permanent address is same as current address</label>
        </div>

        <div class="spf-section-title" style="margin-top:8px;">Permanent Address ${F.sameAsCurrent ? '<span style="font-size:11.5px;color:var(--teal);font-weight:600;">(Auto-filled from Current Address)</span>' : ''}</div>
        <div class="spf-grid3">
          <div class="spf-field spf-span2"><label class="spf-label">Address</label><textarea class="spf-input spf-textarea" data-f="permAddress" placeholder="House no., Street, Area" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}>${F.sameAsCurrent ? (F.currAddress || '') : (F.permAddress || '')}</textarea></div>
          <div class="spf-field"><label class="spf-label">City</label><input class="spf-input" data-f="permCity" value="${F.sameAsCurrent ? (F.currCity || '') : (F.permCity || '')}" placeholder="City" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}/></div>
          <div class="spf-field"><label class="spf-label">State</label>
            <select class="spf-input" data-f="permState" ${F.sameAsCurrent ? 'disabled style="background:#f1f5f9;color:var(--navy);"' : ''}>
              <option value="">Select state…</option>
              ${['Andhra Pradesh', 'Arunachal Pradesh', 'Assam', 'Bihar', 'Chhattisgarh', 'Goa', 'Gujarat', 'Haryana', 'Himachal Pradesh', 'Jharkhand', 'Karnataka', 'Kerala', 'Madhya Pradesh', 'Maharashtra', 'Manipur', 'Meghalaya', 'Mizoram', 'Nagaland', 'Odisha', 'Punjab', 'Rajasthan', 'Sikkim', 'Tamil Nadu', 'Telangana', 'Tripura', 'Uttar Pradesh', 'Uttarakhand', 'West Bengal', 'Delhi', 'Jammu & Kashmir', 'Ladakh', 'Puducherry'].map(s => `<option ${(F.sameAsCurrent ? F.currState : F.permState) === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Pin Code</label><input class="spf-input" data-f="permPincode" value="${F.sameAsCurrent ? (F.currPincode || '') : (F.permPincode || '')}" placeholder="6-digit pin" maxlength="6" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}/></div>
          <div class="spf-field"><label class="spf-label">Email Address</label><input class="spf-input" type="email" data-f="permEmail" value="${F.permEmail || ''}" placeholder="your@email.com"/></div>
          <div class="spf-field"><label class="spf-label">Alternate Contact No.</label><input class="spf-input" type="tel" data-f="permContact" value="${F.permContact || ''}" placeholder="Contact number"/></div>
        </div>
      </div>

      <!-- ── SECTION 3: Employment & Income Details ── -->
      <div class="spf-section" data-section="employment">
        <div class="spf-section-title">3. Employment & Income Details</div>
        ${isBiz ? `
        <div class="spf-info-bar" style="background:rgba(31,138,112,.08);border-color:rgba(31,138,112,.3);color:var(--teal);">Business / Self-Employed Mode — Enter business profile and financials below.</div>
        <div class="spf-grid3">
          <div class="spf-field"><label class="spf-label">Business / Firm Name</label><input class="spf-input" data-f="businessName" value="${F.businessName}" placeholder="Firm name"/></div>
          <div class="spf-field"><label class="spf-label">Business Constitution</label>
            <select class="spf-input" data-f="businessType">
              <option value="">Select…</option>
              ${['Proprietorship', 'Partnership', 'Private Limited', 'LLP', 'HUF', 'Trust', 'Other'].map(o => `<option ${F.businessType === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Industry Type</label><input class="spf-input" data-f="industry" value="${F.industry || ''}" placeholder="e.g. Retail / Manufacturing"/></div>
          <div class="spf-field"><label class="spf-label">Business Vintage</label>
            <select class="spf-input" data-f="businessVintage">
              <option value="">Select…</option>
              ${['< 1 year', '1–3 years', '3–5 years', '5–10 years', '10+ years'].map(o => `<option ${F.businessVintage === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field spf-span2"><label class="spf-label">Registered Office Address</label><textarea class="spf-input spf-textarea" data-f="businessAddress" placeholder="Registered office address">${F.businessAddress}</textarea></div>
          <div class="spf-field"><label class="spf-label">Registered Office City</label><input class="spf-input" data-f="businessCity" value="${F.businessCity || ''}" placeholder="City"/></div>
          <div class="spf-field"><label class="spf-label">Registered Office State</label><input class="spf-input" data-f="businessState" value="${F.businessState || ''}" placeholder="State"/></div>
          <div class="spf-field"><label class="spf-label">GST Number</label><input class="spf-input" data-f="gstNumber" value="${F.gstNumber}" placeholder="15-char GSTIN" style="text-transform:uppercase"/></div>
          <div class="spf-field"><label class="spf-label">Business Contact</label><input class="spf-input" type="tel" data-f="businessContact" value="${F.businessContact}" placeholder="Business phone"/></div>
          <div class="spf-field"><label class="spf-label">Annual Turnover (₹)</label><input class="spf-input" type="number" data-f="annualIncome" value="${F.annualIncome || ''}" placeholder="Annual Sales / Turnover"/></div>
        </div>` : `
        <div class="spf-info-bar">Salaried Mode — Enter employer details and monthly salary breakdown below.</div>
        <div class="spf-grid3">
          <div class="spf-field"><label class="spf-label">Employer Name</label><input class="spf-input" data-f="employerName" value="${F.employerName}" placeholder="Company name"/></div>
          <div class="spf-field"><label class="spf-label">Designation</label><input class="spf-input" data-f="designation" value="${F.designation}" placeholder="Your designation"/></div>
          <div class="spf-field"><label class="spf-label">Industry / Sector</label><input class="spf-input" data-f="industry" value="${F.industry || ''}" placeholder="e.g. IT / Banking / Healthcare"/></div>
          <div class="spf-field"><label class="spf-label">Work Experience (Years)</label><input class="spf-input" data-f="experienceYears" value="${F.experienceYears || ''}" placeholder="Total work experience"/></div>
          <div class="spf-field spf-span2"><label class="spf-label">Office Address</label><textarea class="spf-input spf-textarea" data-f="officeAddress" placeholder="Office / employer address">${F.officeAddress}</textarea></div>
          <div class="spf-field"><label class="spf-label">Office City</label><input class="spf-input" data-f="officeCity" value="${F.officeCity || ''}" placeholder="City"/></div>
          <div class="spf-field"><label class="spf-label">Office State</label><input class="spf-input" data-f="officeState" value="${F.officeState || ''}" placeholder="State"/></div>
          <div class="spf-field"><label class="spf-label">Work Email</label><input class="spf-input" type="email" data-f="empEmail" value="${F.empEmail}" placeholder="work@company.com"/></div>
          <div class="spf-field"><label class="spf-label">Work Contact No.</label><input class="spf-input" type="tel" data-f="empContact" value="${F.empContact}" placeholder="Office phone"/></div>
        </div>`}

        <!-- Income Details -->
        <div class="spf-section-title" style="margin-top:18px;">Income Details</div>
        <div class="spf-grid3">
          <div class="spf-field"><label class="spf-label">Gross Monthly Income (₹)</label><input class="spf-input" type="number" data-f="grossIncome" value="${F.grossIncome || ''}" placeholder="Gross salary" oninput="render()"/></div>

    /* Smart Copy and Repeater Helpers */
    function emptyCoborrower() {
      return {
        firstName: '', middleName: '', lastName: '', gender: '', dob: '', contact: '', email: '',
        panAvailable: 'Yes', panNumber: '', aadhaarAvailable: 'Yes', aadhaar: '',
        currAddress: '', currCity: '', currState: '', currPincode: '',
        permAddress: '', permCity: '', permState: '', permPincode: '',
        employerName: '', designation: '', annualIncome: ''
      };
    }

    function ensureCoborrower() {
      const F = state.form;
      if (!F.coborrowers) F.coborrowers = [];
      if (!F.coborrowers.length) F.coborrowers.push(emptyCoborrower());
      return F.coborrowers[0];
    }

    function addCoborrower() {
      const F = state.form;
      if (!F.coborrowers) F.coborrowers = [];
      F.coborrowers.push(emptyCoborrower());
      F.hasCoborrower = true;
      render();
    }

    function removeCoborrower(index) {
      const F = state.form;
      if (!F.coborrowers) return;
      F.coborrowers.splice(index, 1);
      if (!F.coborrowers.length) {
        F.hasCoborrower = false;
      }
      render();
    }

    /* Master Application CRUD Operations */
    function onMasterAppSearch(val) {
      state.masterSearchQuery = val;

    function loadApplicationIntoForm(id) {
      const app = state.applications.find(a => String(a.id) === String(id));
      if (!app) return;
      state.editingAppId = app.id;
      const cloned = JSON.parse(JSON.stringify(app));
      if (!cloned.coborrowers && cloned.coborrower) cloned.coborrowers = Array.isArray(cloned.coborrower) ? cloned.coborrower : [cloned.coborrower];
      if (!cloned.bankAccounts || !cloned.bankAccounts.length) cloned.bankAccounts = [{ bankName: '', accountType: 'Savings', accountNumber: '', ifsc: '', branch: '', openingYear: '' }];
      if (!cloned.existingLoans || !cloned.existingLoans.length) cloned.existingLoans = [{ institution: '', loanType: 'Personal Loan', outstandingAmount: '', emi: '', tenureMonths: '', monthsPaid: '', status: 'Open' }];
      if (!cloned.propertyDetails) cloned.propertyDetails = { ownerName: '', propertyType: 'Residential House', propertyAge: '', builtUpArea: '', carpetArea: '', marketValue: '', purchaseValue: '', propertyAddress: '' };
      if (!cloned.businessDetails) cloned.businessDetails = { businessName: '', constitution: 'Proprietorship', industry: '', gst: '', turnover: '', netProfit: '', numEmployees: '', officeAddress: '' };
      if (!cloned.references || !cloned.references.length) cloned.references = [{ name: '', relationship: 'Friend', contact: '', address: '' }, { name: '', relationship: 'Relative', contact: '', address: '' }];
      if (!cloned.documentsChecklist) cloned.documentsChecklist = { pan: false, aadhaar: false, passport: false, drivingLicence: false, voterId: false, bankStatement: false, salarySlip: false, itr: false, gstCertificate: false, propertyPapers: false, others: false };

      state.form = cloned;
      showToast(`Loaded application ${app.appNo || app.id} into form for editing`, 'success');
      render();
      const el = document.querySelector('[data-section="app-info"]');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteApplicationById(id) {
      const app = state.applications.find(a => String(a.id) === String(id));
      const name = app ? (app.appNo || app.firstName || 'Application') : 'Application';
      if (!confirm(`Are you sure you want to delete ${name}?`)) return;
      await deleteApplicationApi(id);
      state.applications = state.applications.filter(a => String(a.id) !== String(id));
      if (String(state.editingAppId) === String(id)) {
        state.editingAppId = null;
        state.form = emptyForm();
      }
      showToast(`Deleted ${name}`, 'success');
      render();
    }

      const F = state.form;
      if (!F.appNo) {
        generateManualAppNo();
      }
      const isBusiness = F.applicantType === 'Business / Self-Employed';
      const record = {
        status: F.status || 'Submitted',
        createdAt: F.createdAt || Date.now(),
        appNo: F.appNo,
        connector: F.connector || '',
        appDate: F.appDate || new Date().toISOString().split('T')[0],
        branch: F.branch || '',

        applicantType: F.applicantType || 'Salaried',
        loanProducts: F.loanProducts || [],
        loanPurpose: F.loanPurpose || '',
        requestedAmount: F.requestedAmount || '',
        tenureMonths: F.tenureMonths || '',
        firstName: F.firstName || '',
        middleName: F.middleName || '',
        lastName: F.lastName || '',
        residencyStatus: F.residencyStatus || 'Indian',
        gender: F.gender || '',
        maritalStatus: F.maritalStatus || '',
        education: F.education || '',

        fatherName: F.fatherName || '',
        mothersMaidenName: F.mothersMaidenName || '',
        panNumber: (F.panNumber || '').toUpperCase(),

        voterId: F.voterId || '',
        drivingLicence: F.drivingLicence || '',
        currAddress: F.currAddress || '',
        currCity: F.currCity || '',
        currState: F.currState || '',
        currPincode: F.currPincode || '',
        currOccupancy: F.currOccupancy || '',
        currVintage: F.currVintage || '',
        currContact: F.currContact || '',
        permAddress: F.sameAsCurrent ? F.currAddress : (F.permAddress || ''),
        permCity: F.sameAsCurrent ? F.currCity : (F.permCity || ''),
        permState: F.sameAsCurrent ? F.currState : (F.permState || ''),
        permPincode: F.sameAsCurrent ? F.currPincode : (F.permPincode || ''),
        permEmail: F.permEmail || '',
        permContact: F.permContact || '',
        hasCoborrower: F.hasCoborrower || false,
        coborrower: F.hasCoborrower ? F.coborrowers : null,
        industry: F.industry || '',
        experienceYears: F.experienceYears || '',
        annualIncome: F.annualIncome || '',
        employerName: isBusiness ? '' : (F.employerName || ''),
        officeAddress: isBusiness ? '' : (F.officeAddress || ''),
        officeCity: isBusiness ? '' : (F.officeCity || ''),
        officeState: isBusiness ? '' : (F.officeState || ''),
        designation: isBusiness ? '' : (F.designation || ''),
        empEmail: isBusiness ? '' : (F.empEmail || ''),
        empContact: isBusiness ? '' : (F.empContact || ''),
        businessName: isBusiness ? (F.businessName || '') : '',
        businessType: isBusiness ? (F.businessType || '') : '',
        businessAddress: isBusiness ? (F.businessAddress || '') : '',
        businessCity: isBusiness ? (F.businessCity || '') : '',
        businessState: isBusiness ? (F.businessState || '') : '',
        businessVintage: isBusiness ? (F.businessVintage || '') : '',
        gstNumber: isBusiness ? (F.gstNumber || '') : '',
        businessContact: isBusiness ? (F.businessContact || '') : '',
        grossIncome: F.grossIncome || '',
        netIncome: F.netIncome || '',
        incentive: F.incentive || '',
        otherIncome: F.otherIncome || '',
        rentalIncome: F.rentalIncome || '',
        agriIncome: F.agriIncome || '',
        bankAccounts: F.bankAccounts || [],
        existingLoans: F.existingLoans || [],
        propertyDetails: F.propertyDetails || {},
        businessDetails: F.businessDetails || {},
        references: F.references || [],
        documentsChecklist: F.documentsChecklist || {}
      };

      try {
        let saved;
        if (state.editingAppId) {
          saved = await updateApplication(state.editingAppId, record);
          const idx = state.applications.findIndex(a => String(a.id) === String(state.editingAppId));
          if (idx !== -1) state.applications[idx] = { ...state.applications[idx], ...record, id: state.editingAppId };
          showToast(`Application ${F.appNo} updated successfully!`, 'success');
        } else {
          saved = await createApplication(record);
          if (saved && !state.applications.some(a => String(a.id) === String(saved.id))) {
            state.applications.unshift(saved);
          }
          state.editingAppId = saved ? saved.id : Date.now();
          showToast(`Application ${F.appNo} saved successfully!`, 'success');
        }

        const mappedDm = appToDmPayload(saved || record);
        const dmIdx = state.dmData.findIndex(r => r.appId === record.appNo);
        if (dmIdx !== -1) {
          state.dmData[dmIdx] = { ...state.dmData[dmIdx], ...mappedDm };
        } else {
          state.dmData.unshift(mappedDm);
        }
        setLocalDmData(state.dmData);
        setLocalApplications(state.applications);

      } catch (e) {
        showToast('Save failed: ' + (e.message || 'Error'), 'error');
      }
      render();
    }

    function copyCoborrowerField(type) {
      const F = state.form;
      const target = ensureCoborrower();
      if (type === 'currAddr') {
        target.currAddress = F.currAddress;
        target.currCity = F.currCity;
        target.currState = F.currState;
        target.currPincode = F.currPincode;
        showToast('Copied Borrower Current Address to Co-Borrower', 'success');
      } else if (type === 'permAddr') {
        target.permAddress = F.sameAsCurrent ? F.currAddress : F.permAddress;
        target.permCity = F.sameAsCurrent ? F.currCity : F.permCity;
        target.permState = F.sameAsCurrent ? F.currState : F.permState;
        target.permPincode = F.sameAsCurrent ? F.currPincode : F.permPincode;
        showToast('Copied Borrower Permanent Address to Co-Borrower', 'success');
      } else if (type === 'contact') {
        target.contact = F.currContact;
        target.email = F.permEmail;
        showToast('Copied Borrower Contact Details to Co-Borrower', 'success');
      } else if (type === 'employer') {
        target.employerName = F.employerName || F.businessName;
        target.designation = F.designation || F.businessType;
        target.annualIncome = F.annualIncome || F.grossIncome;
        showToast('Copied Borrower Work Details to Co-Borrower', 'success');
      } else if (type === 'identity') {
        target.lastName = F.lastName;
        showToast('Copied Borrower Identity Details to Co-Borrower', 'success');
      }
      render();
    }

    function maskAadhaar(a) { if (!a) return '—'; const last4 = a.replace(/\D/g, '').slice(-4); return `XXXX-XXXX-${last4}`; }

    function exportApplicationsToExcel(apps) {
      if (!apps || apps.length === 0) { showToast('No applications to export.', 'error'); return; }

      const rows = apps.map(a => ({
        'Application #': a.appNo,
        'Status': a.status,
        'Applying As': a.applicantRole || '',
        'Loan Product(s) Requested': (a.loanProducts || []).join('; '),
        'Assigned Product (Admin)': a.assignedProduct || '',
        'Submitted': a.createdAt ? new Date(a.createdAt).toLocaleString() : '',
        'First Name': a.firstName, 'Middle Name': a.middleName, 'Last Name': a.lastName,
        'Residency Status': a.residencyStatus || 'Indian', 'Gender': a.gender, 'Marital Status': a.maritalStatus, 'Education': a.education, 'DOB': a.dob,
        "Father's Name": a.fatherName, "Mother's Maiden Name": a.mothersMaidenName,
        'PAN Number': a.panNumber, 'Aadhaar': a.aadhaar,
        'Current Address': a.currAddress, 'Current City': a.currCity, 'Current State': a.currState,
        'Current Pincode': a.currPincode, 'Current Occupancy': a.currOccupancy, 'Current Vintage': a.currVintage,
        'Current Contact': a.currContact,
        'Permanent Address': a.permAddress, 'Permanent City': a.permCity, 'Permanent State': a.permState,
        'Permanent Pincode': a.permPincode, 'Permanent Occupancy': a.permOccupancy, 'Permanent Vintage': a.permVintage,
        'Distance from Permanent': a.permDistance, 'Permanent Email': a.permEmail, 'Permanent Contact': a.permContact,
        'Employer Name': a.employerName, 'Office Address': a.officeAddress, 'Designation': a.designation,
        'Employment Vintage': a.empVintage, 'Distance from Office': a.empDistance,
        'Employer Email': a.empEmail, 'Employer Contact': a.empContact,
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(12, Math.min(30, k.length + 4)) }));

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Applications');

      const stamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `SkyFinserv_Applications_${stamp}.xlsx`);
      showToast(`Exported ${apps.length} application(s) to Excel.`, 'success');
    }

    function filteredApps() {
      return state.applications.filter(a => {
        const matchesStatus = state.statusFilter === 'All' || a.status === state.statusFilter;
        const matchesProduct = state.productFilter === 'All' || (a.loanProducts || []).includes(state.productFilter);
        const q = state.search.trim().toLowerCase();
        const matchesSearch = !q || `${a.firstName} ${a.lastName} ${a.appNo}`.toLowerCase().includes(q);
        return matchesStatus && matchesProduct && matchesSearch;
      }).sort((x, y) => y.createdAt - x.createdAt);
    }

    /* =========================== STORAGE LAYER (MySQL via REST API + LocalStorage Fallback) =========================== */
    const API_BASE = window.location.protocol === 'file:'
      ? (window.location.origin && window.location.origin !== 'null' && window.location.origin.startsWith('http') ? window.location.origin + '/api' : 'http://localhost:3000/api')
      : '/api';

    async function apiRequest(path, options) {
      const res = await fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: 'Request failed' }));
        throw new Error(body.error || 'Request failed');
      }
      return res.status === 204 ? null : res.json();
    }

    /* IndexedDB Fallback Helper */
    const sfIdb = {
      dbName: 'SkyFinservIDB',
      dbVersion: 1,
      async getDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('store')) db.createObjectStore('store');
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async get(key) {
        try {
          const db = await this.getDb();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch { return null; }
      },
      async set(key, val) {
        try {
          const db = await this.getDb();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put(val, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch { return false; }
      }
    };

    // Create a new application on the server with local storage fallback; returns the saved record
    async function createApplication(record) {
      try {
        return await apiRequest('/applications', { method: 'POST', body: JSON.stringify(record) });
      } catch (e) {
        console.warn('API createApplication failed, saving to local storage fallback:', e.message);
        const appNo = record.appNo || ('SKF-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000));

          ...record,
          id: Date.now(),
          appNo,
          createdAt: record.createdAt || Date.now()
        };
        const local = getLocalApplications();
        local.unshift(saved);
        setLocalApplications(local);
        return saved;
      }
    }

    function appToDmPayload(app) {
      const createdDate = app.createdAt ? new Date(Number(app.createdAt)) : new Date();
      const monthStr = createdDate.toLocaleString('en-US', { month: 'short' }) + '-' + String(createdDate.getFullYear()).slice(-2);
      const formattedDate = createdDate.toISOString().split('T')[0];

      const fullName = [app.firstName, app.middleName, app.lastName].filter(Boolean).join(' ').trim();
      const employer = app.employerName || app.businessName || '';
      const bank = (app.bankAccounts && app.bankAccounts[0] && app.bankAccounts[0].bankName) ? app.bankAccounts[0].bankName : 'TBD';

      let decision = 'LOGIN';
      if (app.status === 'Approved') decision = 'SANCTION';
      else if (app.status === 'Closed') decision = 'DISBURSED';
      else if (app.status === 'Rejected') decision = 'REJECTED';

      const tr = app.tracking || {};

      return {
        id: Date.now() + Math.floor(Math.random() * 1000),
        month: tr.month || monthStr,
        entity: tr.entity || app.branch || 'SkyFinserv',
        connector: tr.connector || app.connector || '',
        applicant: fullName || 'Applicant',
        employer: tr.businessEmployer || employer,
        category: tr.category || app.applicantType || 'Salaried',
        bank: tr.bankNbfc || bank,
        rmName: tr.smName || app.rmName || '',
        product: tr.product || app.assignedProduct || (app.loanProducts && app.loanProducts[0]) || '',
        program: tr.freshBtTopup || 'FRESH',
        creditProgram: tr.creditProgram || app.loanPurpose || 'INCOME',
        loginDate: tr.loginDate || formattedDate,
        appliedAmount: tr.appliedAmount || app.requestedAmount || '',
        decisionDate: tr.decisionDate || formattedDate,
        decision: tr.decision || decision,
        sanctionAmount: tr.sanctionedAmount || app.requestedAmount || '',
        disbDate: tr.disbDate || '',
        disbAmount: tr.disbAmount || '',
        li: tr.ll || '',
        gi: tr.gx || '',
        pf: tr.pf || '',
        roi: tr.roi || '',
        emi: tr.emi || '',
        tenure: tr.tenure || app.tenureMonths || '',
        pdcAmount: tr.ddRtgsAmount || '',
        pdcDate: tr.ddRtgsDate || '',
        queries: tr.deviation || '',
        appId: app.appNo || '',
        noiDate: tr.noi || '',
        remark: tr.remark || '',
      };
    }

    async function syncDmRecordsApi() {
      try {
        const res = await apiRequest('/dm-records/sync', { method: 'POST' });
        if (res && Array.isArray(res.records)) {
          state.dmData = res.records;
          setLocalDmData(state.dmData);
        }
        return res;
      } catch (e) {
        console.warn('API syncDmRecordsApi failed, using local sync fallback:', e.message);
        let localApps = state.applications || [];
        let localDm = getLocalDmData();
        const existingAppIds = new Set(localDm.map(r => r.appId).filter(Boolean));
        let syncedCount = 0;

        for (const a of localApps) {
          if (a.appNo && existingAppIds.has(a.appNo)) continue;
          const mapped = appToDmPayload(a);
          localDm.unshift(mapped);
          syncedCount++;
        }
        setLocalDmData(localDm);
        state.dmData = localDm;
        return { synced: syncedCount, records: localDm };
      }
    }

        const mode = state.loginMode || 'user';

        if (!u || !p) {
          state.loginError = mode === 'admin' ? 'Username and password are required.' : 'User ID and password are required.';
          render();
          return;
        }

        state.loginError = '';
        loginBtn.disabled = true;
        const buttonText = loginBtn.textContent;
        loginBtn.textContent = 'Signing in…';
        try {
          const match = await loginRequest(u, p, mode, pin);
          const roleName = mode === 'admin' ? (match.role || 'SuperAdmin') : 'StandardUser';
          const dispName = match.displayName || ((mode === 'admin' ? 'Admin ' : 'User ') + u.toUpperCase());
          state.admin = { username: match.username || u, displayName: dispName, role: roleName };
          sessionStorage.setItem('skyfinserv_session', JSON.stringify(state.admin));
          state.loginError = '';
          state.view = 'portal-dashboard';
          state.loginPass = '';
          state.loginPin = '';
          await loadApplications();
          await loadAuditLog();
        } catch (e) {
          state.loginError = e.message || 'Invalid credentials. Please try again.';
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = buttonText;
          render();
        }
      };

      document.querySelectorAll('[data-action="logout"]').forEach(el => {
        el.onclick = () => {
          localStorage.removeItem('skyfinserv_user');
          sessionStorage.removeItem('skyfinserv_session');
          state.admin = null;
          state.view = 'admin-login';
          state.loginError = '';
          state.loginUser = '';
          state.loginPass = '';
          state.loginPin = '';
          render();
        };
      });

      const openCpBtn = document.querySelector('[data-action="open-change-password"]');
      if (openCpBtn) openCpBtn.onclick = () => { state.showChangePassword = true; state.changePasswordError = ''; render(); };

      document.querySelectorAll('[data-action="close-change-password"]').forEach(el => {
        el.onclick = () => { state.showChangePassword = false; state.changePasswordError = ''; render(); };
      });

      const submitCpBtn = document.querySelector('[data-action="submit-change-password"]');
      if (submitCpBtn) submitCpBtn.onclick = async () => {
        const newUsername = document.getElementById('cp-username').value.trim();
        const currentPassword = document.getElementById('cp-current').value;
        const newPassword = document.getElementById('cp-new').value;
        const confirmPassword = document.getElementById('cp-confirm').value;

        state.changePasswordError = '';
        if (!currentPassword || !newPassword) { state.changePasswordError = 'Current and new password are required.'; render(); return; }
        if (newPassword !== confirmPassword) { state.changePasswordError = 'New password and confirmation do not match.'; render(); return; }
        if (newPassword.length < 6) { state.changePasswordError = 'New password must be at least 6 characters.'; render(); return; }

        submitCpBtn.disabled = true; submitCpBtn.textContent = 'Updating…';
        try {
          const result = await changePasswordRequest({
            username: state.admin.username,
            currentPassword,
            newPassword,
            newUsername: newUsername || undefined,
          });
          state.admin.username = result.username;
          state.admin.displayName = result.displayName;
          state.showChangePassword = false;
          state.changePasswordError = '';
          document.getElementById('cp-current').value = '';
          document.getElementById('cp-new').value = '';
          document.getElementById('cp-confirm').value = '';
          document.getElementById('cp-username').value = '';
          showToast('Password updated successfully.', 'success');
        } catch (e) {
          state.changePasswordError = e.message || 'Could not update password.';
        } finally {
          submitCpBtn.disabled = false;
          submitCpBtn.textContent = 'Update';
          render();
        }
      };

      document.querySelectorAll('[data-admin-tab]').forEach(el => {
        el.onclick = async () => {
          state.adminTab = el.dataset.adminTab;
          if (state.adminTab === 'users') {
            await loadUsersList();
          } else if (state.adminTab === 'audit') {
            await loadAuditLog();
          }
          render();
        };
      });

      document.querySelectorAll('[data-action="toggle-user-permit"]').forEach(el => {
        el.onclick = async () => {
          const userId = el.dataset.userId;
          const current = el.dataset.current === '1' || el.dataset.current === 'true';
          const nextPermit = !current;
          el.disabled = true;
          try {
            await apiRequest(`/users/${userId}/permit`, {
              method: 'PATCH',
              body: JSON.stringify({ isPermitted: nextPermit })
            });
            showToast(`User permission ${nextPermit ? 'approved 🟢' : 'revoked 🛑'}`, 'success');
            await loadUsersList();
          } catch (e) {
            showToast('Failed to update permission.', 'error');
          } finally {
            render();
          }
        };
      });

      const searchBox = document.getElementById('search-box');
      if (searchBox) {
        searchBox.oninput = () => {
          state.search = searchBox.value;
          const selection = {
            start: searchBox.selectionStart,
            end: searchBox.selectionEnd,
          };
          render();
          const nextSearchBox = document.getElementById('search-box');
          if (nextSearchBox) {
            nextSearchBox.focus();
            if (typeof nextSearchBox.setSelectionRange === 'function' && selection.start != null && selection.end != null) {
              nextSearchBox.setSelectionRange(selection.start, selection.end);
            }
          }
        };
      }
      const statusFilter = document.getElementById('status-filter');
      if (statusFilter) { statusFilter.onchange = () => { state.statusFilter = statusFilter.value; render(); }; }
      const productFilter = document.getElementById('product-filter');
      if (productFilter) { productFilter.onchange = () => { state.productFilter = productFilter.value; render(); }; }

      document.querySelectorAll('[data-action="status-change"]').forEach(el => {
        el.onchange = async () => {
          const id = el.dataset.id;
          const app = state.applications.find(a => String(a.id) === String(id));
          if (!app) return;
          const prev = app.status;
          app.status = el.value;
          render();
          try {
            await updateApplicationStatus(id, el.value);
            addAuditLog('STATUS_CHANGE', `${app.appNo}: ${prev} → ${el.value}`);
            showToast(`Status updated to "${el.value}"`, 'success');
          } catch (e) {
            app.status = prev; showToast('Failed to update — reverted.', 'error'); render();
          }
        };
      });

      document.querySelectorAll('[data-action="reveal"]').forEach(el => {
        el.onclick = () => {
          const id = el.dataset.id;
          const app = state.applications.find(a => String(a.id) === String(id));
          const nowRevealed = !state.revealed[id];
          state.revealed[id] = nowRevealed;
          if (nowRevealed) addAuditLog('AADHAAR_REVEAL', `Revealed Aadhaar for ${app ? app.appNo : id}`);
          render();
        };
      });

      document.querySelectorAll('[data-action="view"]').forEach(el => {
        el.onclick = () => {
          const app = state.applications.find(a => String(a.id) === String(el.dataset.id));
          if (!app) return;
          state.detailApp = app;
          state.trackingDraft = { ...(app.tracking || {}) };
          addAuditLog('VIEW_APPLICATION', `Opened ${app.appNo} — ${app.firstName} ${app.lastName}`);
          state.view = 'admin-detail';
          render();
        };
      });

      document.querySelectorAll('[data-action="delete"]').forEach(el => {
        el.onclick = async () => {
          if (!confirm('Permanently delete this application? This cannot be undone.')) return;
          const app = state.applications.find(a => String(a.id) === String(el.dataset.id));
          try {
            await deleteApplicationApi(el.dataset.id);
            addAuditLog('DELETE_APPLICATION', `Deleted ${app ? app.appNo : el.dataset.id}`);
            state.applications = state.applications.filter(a => String(a.id) !== String(el.dataset.id));
            showToast('Application deleted.', 'success');
          } catch (e) {
            showToast('Failed to delete.', 'error');
          }
          render();
        };
      });

      document.querySelectorAll('[data-action="close-modal"]').forEach(el => {
        el.onclick = () => { state.modalApp = null; state.modalDraft = null; render(); };
      });

      document.querySelectorAll('[data-mf]').forEach(el => {
        el.oninput = () => { state.modalDraft[el.dataset.mf] = el.value; };
        el.onchange = () => { state.modalDraft[el.dataset.mf] = el.value; };
      });

      const saveModalBtn = document.querySelector('[data-action="save-modal"]');
      if (saveModalBtn) saveModalBtn.onclick = async () => {
        const idx = state.applications.findIndex(a => String(a.id) === String(saveModalBtn.dataset.id));
        const app = state.applications[idx];
        try {
          const updated = await updateApplication(saveModalBtn.dataset.id, state.modalDraft);
          addAuditLog('EDIT_APPLICATION', `Updated ${app ? app.appNo : saveModalBtn.dataset.id}`);
          if (idx !== -1) state.applications[idx] = updated;
          state.modalApp = null; state.modalDraft = null;
          showToast('Application updated.', 'success');
        } catch (e) {
          showToast('Failed to save changes.', 'error');
        }
        render();
      };

      const exportExcelBtn = document.querySelector('[data-action="export-excel"]');
      if (exportExcelBtn) exportExcelBtn.onclick = () => {
        addAuditLog('EXPORT_EXCEL', `Exported ${filteredApps().length} applications`);
        exportApplicationsToExcel(filteredApps());
      };

      const exportCsvBtn = document.querySelector('[data-action="export-csv"]');
      if (exportCsvBtn) exportCsvBtn.onclick = () => {
        const apps = filteredApps();
        if (!apps.length) { showToast('No applications to export.', 'error'); return; }
        addAuditLog('EXPORT_CSV', `Exported ${apps.length} applications`);
        const headers = ['Application #', 'Status', 'Applicant Type', 'Applying As', 'Loan Products', 'First Name', 'Last Name', 'PAN', 'Aadhaar', 'City', 'State', 'Submitted'];
        const rows = apps.map(a => [
          a.appNo, a.status, a.applicantType || '', a.applicantRole || '',
          (a.loanProducts || []).join('; '), a.firstName, a.lastName,
          a.panNumber, a.aadhaar, a.currCity, a.currState,
          a.createdAt ? new Date(a.createdAt).toLocaleString() : ''
        ]);
        const csv = [headers, ...rows].map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `SkyFinserv_Applications_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        showToast(`Exported ${apps.length} applications to CSV.`, 'success');
      };

      document.querySelectorAll('[data-admin-tab]').forEach(el => {
        el.onclick = async () => {
          state.adminTab = el.dataset.adminTab;
          if (el.dataset.adminTab === 'audit') await loadAuditLog();
          render();
        };
      });

      // Single-page form inputs
      document.querySelectorAll('.spf-input[data-f]').forEach(el => {
        el.oninput = el.onchange = () => {
          state.form[el.dataset.f] = el.value;
          if (state.form.sameAsCurrent) {
            if (el.dataset.f === 'currAddress') state.form.permAddress = el.value;
            if (el.dataset.f === 'currCity') state.form.permCity = el.value;
            if (el.dataset.f === 'currState') state.form.permState = el.value;
            if (el.dataset.f === 'currPincode') state.form.permPincode = el.value;
          }
        };
      });

      // Single-page form radio buttons (applicant type)
      document.querySelectorAll('.spf-radio-row[data-seg]').forEach(row => {
        row.querySelectorAll('.spf-radio').forEach(btn => {
          btn.onclick = () => {
            state.form[row.dataset.seg] = btn.dataset.val;
            render();
          };
        });
      });
      // Data Manager modal inputs & selects
      document.querySelectorAll('.dm-input[data-dmf], .dm-select[data-dmf]').forEach(el => {
        el.oninput = () => { state.dmForm[el.dataset.dmf] = el.value; };
        el.onchange = () => { state.dmForm[el.dataset.dmf] = el.value; };
      });

      document.querySelectorAll('[data-action="back-to-list"]').forEach(el => {
        el.onclick = () => { state.view = 'admin-dashboard'; state.detailApp = null; state.trackingDraft = {}; render(); };
      });

      // Live-update trackingDraft as admin types
      document.querySelectorAll('.dp-input').forEach(el => {
        el.oninput = () => { state.trackingDraft[el.dataset.tk] = el.value; };
        el.onchange = () => { state.trackingDraft[el.dataset.tk] = el.value; };
      });

      document.querySelectorAll('[data-action="save-tracking"]').forEach(el => {
        el.onclick = async () => {
          const id = el.dataset.id;
          try {
            await fetch(`/api/applications/${id}/tracking`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(state.trackingDraft),
            });
            // update local copy
            const idx = state.applications.findIndex(a => a.id === id);
            if (idx > -1) state.applications[idx].tracking = { ...state.trackingDraft };
            if (state.detailApp && state.detailApp.id === id) state.detailApp.tracking = { ...state.trackingDraft };
            addAuditLog('TRACKING_SAVED', `Tracking updated for ${state.detailApp?.appNo}`);
            showToast('Tracking data saved successfully!', 'success');
          } catch (e) {
            showToast('Failed to save tracking data.', 'error');
          }
        };
      });
      const clearAllBtn = document.querySelector('[data-action="clear-all-audit"]');
      if (clearAllBtn) clearAllBtn.onclick = async () => {
        if (!confirm('Delete ALL audit log entries permanently? This cannot be undone.')) return;
        try {
          await fetch('/api/audit-log/clear', { method: 'DELETE' });
          state.auditLog = [];
          showToast('All audit log entries deleted.', 'success');
        } catch (e) {
          showToast('Failed to clear audit log.', 'error');
        }
        render();
      };

      // Delete single audit log row
      document.querySelectorAll('[data-action="delete-audit-row"]').forEach(el => {
        el.onclick = async () => {
          const idx = parseInt(el.dataset.index);
          const id = el.dataset.id;
          if (!confirm('Delete this log entry?')) return;
          try {
            if (id) await fetch(`/api/audit-log/${id}`, { method: 'DELETE' });
            state.auditLog.splice(idx, 1);
            showToast('Log entry deleted.', 'success');
          } catch (e) {
            showToast('Failed to delete entry.', 'error');
          }
          render();
        };
      });
    }

    function renderInPlace() { document.getElementById('root').innerHTML = renderRoot(); attachHandlers(); }
    function renderDashboardOnly() { render(); if (document.getElementById('search-box')) document.getElementById('search-box').focus(); }

    function showToast(msg, type) {
      state.toast = { msg, type };
      render();
      setTimeout(() => { state.toast = null; render(); }, 2600);
    }

    function dmFilteredData() {
      let list = state.dmData || [];
      const q = (state.dmSearch || '').toLowerCase();
      const month = state.dmMonthFilter || 'All';
      const decision = state.dmDecisionFilter || 'All';
      const bank = state.dmBankFilter || 'All';

      if (month !== 'All') list = list.filter(r => (r.month || '').toLowerCase() === month.toLowerCase());
      if (decision !== 'All') list = list.filter(r => (r.decision || '').toLowerCase() === decision.toLowerCase());
      if (bank !== 'All') list = list.filter(r => (r.bank || '').toLowerCase().includes(bank.toLowerCase()));

      if (q) {
        list = list.filter(r => Object.values(r).some(v => String(v || '').toLowerCase().includes(q)));
      }
      return list;
    }

    function dmOpenAdd() {
      const empty = {};
      DM_COLUMNS.forEach(c => empty[c.key] = '');
      state.dmForm = empty;
      state.dmEditing = null;
      state.dmModal = true;
      state.dmTab = 'basic';
      render();
    }

    function dmOpenEdit(id) {
      const recordId = Number(id);
      const rec = state.dmData.find(r => r.id === recordId);
      if (!rec) return;
      state.dmForm = { ...rec };
      state.dmEditing = recordId;
      state.dmModal = true;
      state.dmTab = 'basic';
      render();
    }

    async function dmDelete(id) {
      const recordId = Number(id);
      if (!confirm('Delete this record?')) return;
      try {
        await deleteDmRecord(recordId);
        state.dmData = state.dmData.filter(r => r.id !== recordId);
        addAuditLog('DM_DELETE', `Deleted record ID ${recordId}`);
        showToast('Record deleted.', 'success');
      } catch (e) {
        showToast('Could not delete record.', 'error');
      }
      render();
    }

    async function dmSaveRecord() {
      const rec = { ...state.dmForm };
      const isEdit = Boolean(state.dmEditing);
      try {
        const saved = isEdit
          ? await updateDmRecord(state.dmEditing, rec)
          : await createDmRecord(rec);
        if (isEdit) {
          state.dmData = state.dmData.map(r => r.id === saved.id ? saved : r);
          addAuditLog('DM_EDIT', `Edited record ${saved.applicant || saved.id}`);
        } else {
          state.dmData = [saved, ...state.dmData];
          addAuditLog('DM_ADD', `Added record ${saved.applicant || ''}`);
        }
        state.dmModal = false;
        state.dmEditing = null;
        state.dmForm = {};
        showToast(isEdit ? 'Record updated successfully.' : 'Record added successfully.', 'success');
      } catch (e) {
        console.error(e);
        showToast('Could not save record.', 'error');
      }
      render();
    }

    function dmExportExcel() {
      const rows = dmFilteredData().map(({ id, createdAt, updatedAt, ...rest }) => {
        const row = {};
        DM_COLUMNS.forEach(c => row[c.label] = rest[c.key] || '');
        return row;
      });
      if (!rows.length) { showToast('No records to export.', 'error'); return; }
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      ws['!cols'] = DM_COLUMNS.map(c => ({ wch: Math.max(c.label.length + 2, 14) }));
      XLSX.writeFile(wb, `SkyFinserv_DataManager_${new Date().toISOString().slice(0, 10)}.xlsx`);
      addAuditLog('DM_EXPORT_EXCEL', `Exported ${rows.length} records`);
      showToast(`Exported ${rows.length} records to Excel.`, 'success');
    }

    function dmImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          if (json && json.length > 1) {
            const headerRow = json[0].map(h => String(h || '').trim());
            let count = 0;
            for (let i = 1; i < json.length; i++) {
              const row = json[i];
              if (!row || row.length === 0) continue;
              const rec = { id: Date.now() + i };
              headerRow.forEach((label, cIdx) => {
                const colDef = DM_COLUMNS.find(c => c.label.toLowerCase() === label.toLowerCase() || c.key.toLowerCase() === label.toLowerCase());
                const val = row[cIdx] !== undefined ? row[cIdx] : '';
                if (colDef) {
                  rec[colDef.key] = val;
                } else {
                  rec[label] = val;
                }
              });
              state.dmData.unshift(rec);
              count++;
            }
            setLocalDmData(state.dmData);
            showToast(`Successfully imported ${count} records from Excel into Data Manager!`, 'success');
            render();
          } else {
            showToast('Excel file is empty or missing data rows.', 'error');
          }
        } catch (err) {
          showToast('Could not import Excel file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderDecisionBadge(val) {
      if (!val) return '—';
      const v = String(val).toUpperCase();
      let cls = 'dm-badge-default';
      if (v.includes('SANCTION') || v.includes('APPROVED')) cls = 'dm-badge-sanction';
      else if (v.includes('DISBURSED')) cls = 'dm-badge-disbursed';
      else if (v.includes('LOGIN')) cls = 'dm-badge-login';
      else if (v.includes('FILE SEND') || v.includes('SEND')) cls = 'dm-badge-filesend';
      return `<span class="dm-badge ${cls}">${val}</span>`;
    }

    function computeFdLoanTotals() {
      const loans = (state.fdData && state.fdData.loans) || [];
      let totAmount = 0, totTenure = 0, totEmi = 0, totEmiPaid = 0, totOutstanding = 0, totOverdue = 0, totBounce = 0, totEmiObligation = 0, totBtEmi = 0, totBtAmount = 0;
      loans.forEach(l => {
        const amt = Number(l.amount) || 0;
        const ten = Number(l.tenure) || 0;
        const emi = Number(l.emi) || 0;
        const paid = Number(l.emiPaid) || 0;
        const out = Number(l.outstanding) || 0;
        const ovd = Number(l.overdueCharges) || 0;
        const bnc = Number(l.bounceCount) || 0;

        const isObl = String(l.obligation || '').toLowerCase() === 'yes';
        const isBt = String(l.bt || '').toLowerCase() === 'yes';

        const emiObl = isObl ? emi : 0;
        const btEmiVal = isBt ? emi : 0;
        const btAmtVal = isBt ? out : 0;

        totAmount += amt;
        totTenure += ten;
        totEmi += emi;
        totEmiPaid += paid;
        totOutstanding += out;
        totOverdue += ovd;
        totBounce += bnc;
        totEmiObligation += emiObl;
        totBtEmi += btEmiVal;
        totBtAmount += btAmtVal;
      });
      return { totAmount, totTenure, totEmi, totEmiPaid, totOutstanding, totOverdue, totBounce, totEmiObligation, totBtEmi, totBtAmount };
    }

    function calcAgeFromDob(dobStr) {
      if (!dobStr) return '';
      let dob;
      if (dobStr.includes('-')) {
        const parts = dobStr.split('-');
        if (parts[0].length === 4) {
          dob = new Date(dobStr);
        } else {
          const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
          const day = parseInt(parts[0], 10);
          const mon = isNaN(parts[1]) ? months[parts[1].toLowerCase().slice(0, 3)] : parseInt(parts[1], 10) - 1;
          let yr = parseInt(parts[2], 10);
          if (yr < 100) yr += (yr > 30 ? 1900 : 2000);
          dob = new Date(yr, mon, day);
        }
      }
      if (!dob || isNaN(dob.getTime())) return '';
      const now = new Date();
      let age = now.getFullYear() - dob.getFullYear();
      const m = now.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
      return age > 0 ? String(age) : '';
    }

    function calcVintageFromDoj(dojStr) {
      if (!dojStr) return '';
      const parts = dojStr.split('-');
      if (parts.length < 3) return '';
      let yr = parseInt(parts[2], 10);
      if (yr < 100) yr += (yr > 50 ? 1900 : 2000);
      const currentYr = new Date().getFullYear();
      const diff = currentYr - yr;
      return diff > 0 ? String(diff) : '1';
    }

    function computeFdTotals(key) {
      const entities = state.fdData.entities || [];
      let considerSum = 0;
      let yr1yr2Sum = 0;

      entities.forEach(ent => {
        const y1 = ent.years[0] ? Number(ent.years[0][key]) || 0 : 0;
        const y2 = ent.years[1] ? Number(ent.years[1][key]) || 0 : 0;
        considerSum += y1;
        yr1yr2Sum += (y1 + y2);
      });

      const avg2yr = Math.round(yr1yr2Sum / 2);
      return { considerSum, avg2yr };
    }

    async function fdMapToApplication() {
      const appId = state.fdData.selectedAppId;
      if (!appId) {
        showToast('Please select a loan application from the dropdown to map data.', 'error');
        return;
      }

      const netTotals = computeFdTotals('netIncome');
      const deprTotals = computeFdTotals('depreciation');
      const intTotals = computeFdTotals('interest');

      const consideredCashflow = netTotals.considerSum + deprTotals.considerSum + intTotals.considerSum;
      const avg2yrCashflow = netTotals.avg2yr + deprTotals.avg2yr + intTotals.avg2yr;

      const app = state.applications.find(a => a.id === appId || a.appNo === appId);

      try {
        if (app) {
          app.grossIncome = Math.round(avg2yrCashflow / 12);
          app.netIncome = Math.round(consideredCashflow / 12);
          if (!app.tracking) app.tracking = {};
          app.tracking.noi = avg2yrCashflow;
          app.tracking.appliedAmount = app.requestedAmount || 5000000;

          await updateApplication(app.id, { grossIncome: app.grossIncome, netIncome: app.netIncome });
          await fetch(`/api/applications/${app.id}/tracking`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ noi: avg2yrCashflow }),
          });
          showToast(`Mapped Financial CAM to Application #${app.appNo} (Net Cashflow: ₹${consideredCashflow.toLocaleString('en-IN')})`, 'success');
          addAuditLog('FD_MAPPED_APP', `Mapped CAM to ${app.appNo}`);
        } else {
          showToast(`Datasheet metrics mapped for ID: ${appId}`, 'success');
        }
      } catch (e) {
        showToast('Could not save mapped values to backend.', 'error');
      }
      render();
    }
