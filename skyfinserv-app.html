    /* ── Address field helpers ── */
    function addrVal(value, line) {
      const v = (value || '').split('\n')[line] || '';
      return v.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }
    function addrInput(el) {
      const grp = el.closest('.addr-group');
      const inputs = grp.querySelectorAll('input');
      const lines = [inputs[0].value, inputs[1].value, inputs[2].value];
      while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
      const val = lines.join('\n');
      const path = grp.dataset.addr;
      const parts = path.split('.');
      let obj = state.form;
      for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
      obj[parts[parts.length - 1]] = val;
      if (path === 'currAddress' && state.form.sameAsCurrent) state.form.permAddress = val;
    }

    const STEP_META = [
      { key: 'basics', label: 'Application Basics', eyebrow: 'Step 01' },
      { key: 'current', label: 'Current Address', eyebrow: 'Step 02' },
      { key: 'permanent', label: 'Permanent Address', eyebrow: 'Step 03' },
      { key: 'employer', label: 'Professional Details', eyebrow: 'Step 04' },
    ];

    // ── Loan schemes (short-form shown in dropdown) ──────────────────────────
    const DEFAULT_LOAN_TYPES = [
      { short: 'BL', full: 'Business Loan' },
      { short: 'PL', full: 'Personal Loan' },
      { short: 'LAP', full: 'Loan Against Property' },
      { short: 'HL', full: 'Home Loan' },
      { short: 'Comm.V', full: 'Commercial Vehicle Loan' },
      { short: 'Auto.L', full: 'Auto Loan' },
      { short: 'GL', full: 'Gold Loan' },
      { short: 'Pro.L', full: 'Project Loan' },
      { short: 'DLOD', full: 'DropLine Over Draft' },
      { short: 'CC/WC', full: 'Cash Credit / Working Credit' },
      { short: 'EL', full: 'Education Loan' },
      { short: 'CGTMSME', full: 'Govt. Loan MSME' },
      { short: 'MEL', full: 'Medical Equipment Loan' },
    ];

    // Convert any number or string into Indian comma formatted string: e.g. 2500000 -> "25,00,000"
    function toIndianCommas(val) {
      if (val === null || val === undefined || val === '') return '';
      const str = String(val).replace(/[^0-9.]/g, '');
      if (!str) return '';
      const parts = str.split('.');
      const intPart = parts[0];
      const decPart = parts.length > 1 ? '.' + parts[1].slice(0, 2) : '';
      if (!intPart) return decPart ? '0' + decPart : '';
      const lastThree = intPart.slice(-3);
      const otherNumbers = intPart.slice(0, -3);
      const formatted = (otherNumbers !== '' ? otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + lastThree;
      return formatted + decPart;
    }
    window.toIndianCommas = toIndianCommas;

    // Convert number to Indian currency words
    function numberToIndianWords(num) {
      const clean = Number(String(num).replace(/,/g, ''));
      if (isNaN(clean) || clean <= 0) return '';
      if (clean >= 10000000) {
        const cr = clean / 10000000;
        return `₹ ${toIndianCommas(clean)} (${cr % 1 === 0 ? cr : cr.toFixed(2)} Crore)`;
      }
      if (clean >= 100000) {
        const lk = clean / 100000;
        return `₹ ${toIndianCommas(clean)} (${lk % 1 === 0 ? lk : lk.toFixed(2)} Lakh)`;
      }
      if (clean >= 1000) {
        const th = clean / 1000;
        return `₹ ${toIndianCommas(clean)} (${th % 1 === 0 ? th : th.toFixed(1)} Thousand)`;
      }
      return `₹ ${toIndianCommas(clean)}`;
    }
    window.numberToIndianWords = numberToIndianWords;

    // Live currency input formatter with cursor retention
    function formatCurrencyInput(el, fieldName) {
      const origVal = el.value;
      const selStart = el.selectionStart;
      const digitsBeforeCursor = (origVal.slice(0, selStart).match(/\d/g) || []).length;

      const clean = origVal.replace(/[^0-9.]/g, '');
      const formatted = toIndianCommas(clean);
      el.value = formatted;

      if (fieldName && typeof state !== 'undefined' && state.form) {
        state.form[fieldName] = clean;
      }

      let newPos = 0;
      let digitsCounted = 0;
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted[i])) digitsCounted++;
        if (digitsCounted === digitsBeforeCursor) {
          newPos = i + 1;
          break;
        }
      }
      if (digitsBeforeCursor === 0) newPos = 0;
      try { el.setSelectionRange(newPos, newPos); } catch (e) { }

      const wordsEl = document.getElementById(fieldName + '-words') || document.getElementById((el.id || '') + '-words');
      if (wordsEl) {
        wordsEl.innerText = clean ? numberToIndianWords(clean) : '';
      }
    }
    window.formatCurrencyInput = formatCurrencyInput;

    function formatAmount(val) {
      if (val === null || val === undefined || val === '') return '—';
      const cleanVal = String(val).replace(/,/g, '').trim();
      const num = Number(cleanVal);
      if (isNaN(num)) return String(val);
      return '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }
    window.formatAmount = formatAmount;

    // Custom loan types added by user — persisted in localStorage
    function getCustomLoans() {
      try { return JSON.parse(localStorage.getItem('sf_custom_loans') || '[]'); } catch { return []; }
    }
    function saveCustomLoans(arr) {
      localStorage.setItem('sf_custom_loans', JSON.stringify(arr));
    }
    function getAllLoanTypes() {
      return [...DEFAULT_LOAN_TYPES, ...getCustomLoans()];
    }

    const ALL_LOAN_PRODUCTS = getAllLoanTypes().map(l => l.full);
    const EXISTING_LOAN_TYPES = [...new Set([...ALL_LOAN_PRODUCTS, 'Credit Card OD', 'Others'])];
    const APPLICANT_ROLES = ['Borrower', 'Co-Borrower', 'Guarantor'];

    const STATUS_FLOW = ['Submitted', 'Pending Approval', 'Approved', 'Rejected', 'Closed'];
    const statusClass = s => (s || '').replace(/\s+/g, '');

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    window.escapeHtml = escapeHtml;

    let state = {
      view: 'admin-login', // admin-login | public | admin-dashboard
      loginMode: 'user', // user | admin
      step: 0,
      direction: 'forward',
      form: emptyForm(),
      errors: {},

      loginError: '',
      loginUser: '',
      loginPass: '',
      applications: [],
      editingAppId: null,
      masterSearchQuery: '',
      search: '',
      statusFilter: 'All',
      productFilter: 'All',
      revealed: {},
      modalApp: null,
      modalDraft: null,
      toast: null,
      showChangePassword: false,
      changePasswordError: '',
      showForgotPassword: false,
      forgotPasswordError: '',
      forgotPasswordSuccess: '',
      forgotPasswordStep: 'identify',
      fpIdentifier: '',
      fpSecurityQuestion: '',
      fpHasQuestion: false,
      fpResetMethod: 'security',
      fpSecurityAnswer: '',
      fpMasterKey: '',
      fpNewPassword: '',
      fpConfirmPassword: '',
      deleteConfirmApp: null,
      auditLog: [],
      adminTab: 'applications',
      exportFolder: '',
      detailApp: null,
      trackingDraft: {},
      showLoanManager: false,
      dmData: [],
      dmSearch: '',
      dmModal: false,
      dmEditing: null,
      dmForm: {},
      dmPage: 1,
      dmPageSize: 25,

    function calculateAge(dobInput) {
      if (!dobInput) return null;
      let d = null;
      if (dobInput instanceof Date) {
        d = dobInput;
      } else if (typeof dobInput === 'string') {
        const s = dobInput.trim();
        if (!s) return null;
        const delimiter = s.includes('-') ? '-' : (s.includes('/') ? '/' : null);
        if (delimiter) {
          const parts = s.split(delimiter);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            } else if (parts[2].length === 4) {
              const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
              const p0 = parseInt(parts[0], 10);
              const mon = isNaN(parts[1]) ? months[parts[1].toLowerCase().slice(0, 3)] : parseInt(parts[1], 10) - 1;
              const yr = parseInt(parts[2], 10);
              d = new Date(yr, mon, p0);
            }
          }
        }
        if (!d || isNaN(d.getTime())) {
          d = new Date(s);
        }
      }
      if (!d || isNaN(d.getTime())) return null;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return (age >= 0 && age < 130) ? age : null;
    }

    function formatDobForInput(dobVal) {
      if (!dobVal) return '';
      if (typeof dobVal !== 'string') return '';
      const s = dobVal.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const delimiter = s.includes('-') ? '-' : (s.includes('/') ? '/' : null);
      if (delimiter) {
        const parts = s.split(delimiter);
        if (parts.length === 3) {
          if (parts[0].length === 4) {
            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
          } else if (parts[2].length === 4) {
            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          }
        }
      }
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const yr = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${yr}-${mo}-${da}`;
      }
      return s;
    }

              <option value="">Select role…</option>

          </div>

            </select>

            <select class="spf-input" onchange="state.form.loanProducts = [this.value]; render()">

          </div>
          <div class="spf-field">
            <label class="spf-label">Requested Amount (₹) *</label>
            <input class="spf-input spf-amount-input" type="text" inputmode="numeric" data-f="requestedAmount" id="requestedAmount" value="${toIndianCommas(F.requestedAmount)}" placeholder="e.g. 25,00,000" oninput="formatCurrencyInput(this, 'requestedAmount')"/>

          <div class="spf-field">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">

                <span>⏱️ Quick Calc:</span>

          <div class="spf-field"><label class="spf-label">Passport Number</label><input class="spf-input" data-f="passportNo" value="${F.passportNo || ''}" placeholder="Passport No." style="text-transform:uppercase"/></div>

        </div>

        <!-- Addresses -->
        <div class="spf-section-title" style="margin-top:18px;">Borrower Address Details</div>
        <div class="spf-grid3">
          <div class="spf-field spf-span2"><label class="spf-label">Current Address</label>
            <div class="addr-group" data-addr="currAddress">
              <input class="spf-input" placeholder="House No., Building Name" value="${addrVal(F.currAddress, 0)}" oninput="addrInput(this)"/>
              <input class="spf-input" placeholder="Street, Area / Locality" value="${addrVal(F.currAddress, 1)}" oninput="addrInput(this)"/>
              <input class="spf-input" placeholder="Landmark" value="${addrVal(F.currAddress, 2)}" oninput="addrInput(this)"/>

            <select class="spf-input" data-f="currState">
              <option value="">Select state…</option>
              ${['Andhra Pradesh', 'Arunachal Pradesh', 'Assam', 'Bihar', 'Chhattisgarh', 'Goa', 'Gujarat', 'Haryana', 'Himachal Pradesh', 'Jharkhand', 'Karnataka', 'Kerala', 'Madhya Pradesh', 'Maharashtra', 'Manipur', 'Meghalaya', 'Mizoram', 'Nagaland', 'Odisha', 'Punjab', 'Rajasthan', 'Sikkim', 'Tamil Nadu', 'Telangana', 'Tripura', 'Uttar Pradesh', 'Uttarakhand', 'West Bengal', 'Delhi', 'Jammu & Kashmir', 'Ladakh', 'Puducherry'].map(s => `<option ${F.currState === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="spf-field"><label class="spf-label">Pin Code</label><input class="spf-input" data-f="currPincode" value="${F.currPincode}" placeholder="6-digit pin" maxlength="6"/></div>

        <div style="margin:14px 0 10px;display:flex;align-items:center;gap:8px;">

        <div class="spf-section-title" style="margin-top:8px;">Permanent Address ${F.sameAsCurrent ? '<span style="font-size:11.5px;color:var(--teal);font-weight:600;">(Auto-filled from Current Address)</span>' : ''}</div>

              <input class="spf-input" placeholder="Street, Area / Locality" value="${addrVal(F.sameAsCurrent ? (F.currAddress || '') : (F.permAddress || ''), 1)}" oninput="addrInput(this)" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}/>
              <input class="spf-input" placeholder="Landmark" value="${addrVal(F.sameAsCurrent ? (F.currAddress || '') : (F.permAddress || ''), 2)}" oninput="addrInput(this)" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}/>
            </div>

          <div class="spf-field"><label class="spf-label">City</label><input class="spf-input" data-f="permCity" value="${F.sameAsCurrent ? (F.currCity || '') : (F.permCity || '')}" placeholder="City" ${F.sameAsCurrent ? 'readonly style="background:#f1f5f9;color:var(--navy);"' : ''}/></div>
          <div class="spf-field"><label class="spf-label">State</label>

        </div>

    /* Smart Copy and Repeater Helpers */
    function emptyCoborrower() {

    function ensureCoborrower() {
      const F = state.form;
      if (!F.coborrowers) F.coborrowers = [];
      if (!F.coborrowers.length) F.coborrowers.push(emptyCoborrower());
      return F.coborrowers[0];

    function addCoborrower() {
      const F = state.form;
      if (!F.coborrowers) F.coborrowers = [];
      F.coborrowers.push(emptyCoborrower());
      F.hasCoborrower = true;

    /* Master Application Live Search & CRUD Operations */

      const displayApps = allApps.filter(a => {
        const appNoMatch = (a.appNo || '').toLowerCase().includes(q);

        const bizMatch = (a.businessName || '').toLowerCase().includes(q);

      const match = allApps.find(a => {
        const appNoMatch = (a.appNo || '').toLowerCase().includes(q);

    function loadApplicationIntoForm(id) {

        if (typeof showToast === 'function') showToast('Application not found', 'error');
        return;
      }
      state.editingAppId = app.id;
      const cloned = JSON.parse(JSON.stringify(app));
      if (!cloned.coborrowers && cloned.coborrower) cloned.coborrowers = Array.isArray(cloned.coborrower) ? cloned.coborrower : [cloned.coborrower];
      if (!cloned.bankAccounts || !cloned.bankAccounts.length) cloned.bankAccounts = [{ bankName: '', accountType: 'Savings', accountNumber: '', ifsc: '', branch: '', openingYear: '' }];

        cloned.existingLoans = [{ institution: '', loanType: 'Personal Loan', loanAmount: '', outstandingAmount: '', emi: '', tenureMonths: '', monthsPaid: '', startDate: '', status: 'Open' }];

        cloned.existingLoans = cloned.existingLoans.map(l => ({
          institution: l.institution || l.bankName || l.provider || l['Loan Provider / Bank'] || '',
          loanType: l.loanType || l['Loan Type'] || 'Personal Loan',
          loanAmount: l.loanAmount !== undefined && l.loanAmount !== null && l.loanAmount !== '' ? l.loanAmount : (l['Loan Amount (₹)'] || l.amount || ''),
          outstandingAmount: l.outstandingAmount !== undefined && l.outstandingAmount !== null && l.outstandingAmount !== '' ? l.outstandingAmount : (l.outstanding || l.balance || l['Outstanding Balance (₹)'] || ''),
          emi: l.emi !== undefined && l.emi !== null && l.emi !== '' ? l.emi : (l.monthlyEmi || l['Monthly EMI (₹)'] || ''),
          tenureMonths: l.tenureMonths !== undefined && l.tenureMonths !== null && l.tenureMonths !== '' ? l.tenureMonths : (l.tenure || l['Tenure'] || ''),
          monthsPaid: l.monthsPaid !== undefined && l.monthsPaid !== null && l.monthsPaid !== '' ? l.monthsPaid : (l.emiPaid || ''),
          startDate: l.startDate || l['Start Date'] || '',
          status: l.status || 'Open'
        }));
      }
      if (!cloned.propertyDetails) cloned.propertyDetails = { ownerName: '', propertyType: 'Residential House', propertyAge: '', builtUpArea: '', carpetArea: '', marketValue: '', purchaseValue: '', propertyAddress: '', propertyCity: '', propertyState: '' };
      if (!cloned.businessDetails) cloned.businessDetails = { businessName: '', constitution: 'Proprietorship', industry: '', gst: '', turnover: '', netProfit: '', numEmployees: '', officeAddress: '', officeCity: '', officeState: '' };
      if (!cloned.references || !cloned.references.length) cloned.references = [{ name: '', relationship: 'Friend', contact: '', address: '', city: '', state: '' }, { name: '', relationship: 'Relative', contact: '', address: '', city: '', state: '' }];
      if (!cloned.documentsChecklist) cloned.documentsChecklist = { pan: false, aadhaar: false, passport: false, drivingLicence: false, voterId: false, bankStatement: false, salarySlip: false, itr: false, gstCertificate: false, propertyPapers: false, others: false };

      state.form = { ...emptyForm(), ...cloned };
      if (cloned.createdAt && !state.form.appDate) {
        state.form.appDate = new Date(Number(cloned.createdAt)).toISOString().split('T')[0];
      }
      // Clear search query so search results collapse cleanly upon loading application
      state.masterSearchQuery = '';

      showToast(`Loaded application ${app.appNo || app.id} into form for editing`, 'success');
      render();
      const el = document.querySelector('[data-section="app-info"]');
      if (el) el.scrollIntoView({ behavior: 'smooth' });

    function deleteCurrentLoadedApplication() {
      const id = state.editingAppId;

      if (!id && !formAppNo) {
        showToast('No saved application is currently loaded.', 'info');
        return;
      }

    async function executePermanentDelete(id, appNo) {
      try {
        state.deleteConfirmApp = null;
        await deleteApplicationApi(id || appNo, appNo || id);

        state.applications = (state.applications || []).filter(a => String(a.id) !== String(id) && a.appNo !== appNo);
        setLocalApplications(state.applications);

        // Also clean from Data Manager records if present
        if (state.dmData) {
          state.dmData = state.dmData.filter(d => d.appId !== appNo && String(d.id) !== String(id));
          setLocalDmData(state.dmData);
        }

        // Automatically refresh and clear all form data to clean blank state
        state.editingAppId = null;
        state.form = emptyForm();
        state.masterSearchQuery = '';
        render();

        // Extra safety: reset all inputs and selects directly in DOM
        document.querySelectorAll('.spf-input, .spf-select').forEach(el => {
          if (el.tagName === 'SELECT') {
            if (el.options && el.options.length) el.selectedIndex = 0;
          } else if (el.type === 'checkbox') {
            el.checked = false;
          } else if (el.id !== 'master-app-search-input') {
            if (el.dataset.f !== 'appDate') el.value = '';
          }
        });
        const inp = document.getElementById('master-app-search-input');
        if (inp) inp.value = '';

        showToast(`Application "${appNo || id}" permanently deleted, file removed, and form refreshed`, 'success');

        const el = document.querySelector('[data-section="app-info"]');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        showToast('Failed to delete application: ' + (e.message || 'Error'), 'error');
      }
    }
    window.executePermanentDelete = executePermanentDelete;

    async function saveCurrentApplicationManual() {

        const appNoInput = document.querySelector('[data-f="appNo"]');

      const record = {

        createdAt: F.createdAt || Date.now(),

        loanPurpose: F.loanPurpose || '',
        requestedAmount: F.requestedAmount ? String(F.requestedAmount).replace(/,/g, '') : '',
        tenureMonths: F.tenureMonths || '',
        firstName: F.firstName || '',
        middleName: F.middleName || '',
        lastName: F.lastName || '',
        residencyStatus: F.residencyStatus || 'Indian',
        gender: F.gender || '',
        maritalStatus: F.maritalStatus || '',
        education: F.education || '',
        dob: F.dob || '',
        fatherName: F.fatherName || '',
        mothersMaidenName: F.mothersMaidenName || '',
        panNumber: (F.panNumber || '').toUpperCase(),

        passportNo: F.passportNo || '',
        voterId: F.voterId || '',
        drivingLicence: F.drivingLicence || '',
        currAddress: F.currAddress || '',
        currCity: F.currCity || '',
        currState: F.currState || '',
        currPincode: F.currPincode || '',
        currOccupancy: F.currOccupancy || '',
        currVintage: F.currVintage || '',
        currContact: F.currContact || '',
        permAddress: F.sameAsCurrent ? F.currAddress : (F.permAddress || ''),
        permCity: F.sameAsCurrent ? F.currCity : (F.permCity || ''),
        permState: F.sameAsCurrent ? F.currState : (F.permState || ''),
        permPincode: F.sameAsCurrent ? F.currPincode : (F.permPincode || ''),
        permEmail: F.permEmail || '',
        permContact: F.permContact || '',
        hasCoborrower: F.hasCoborrower || false,

        industry: F.industry || '',
        experienceYears: F.experienceYears || '',
        annualIncome: F.annualIncome ? String(F.annualIncome).replace(/,/g, '') : '',
        employerName: isBusiness ? '' : (F.employerName || ''),
        officeAddress: isBusiness ? '' : (F.officeAddress || ''),
        officeCity: isBusiness ? '' : (F.officeCity || ''),
        officeState: isBusiness ? '' : (F.officeState || ''),
        designation: isBusiness ? '' : (F.designation || ''),
        empEmail: isBusiness ? '' : (F.empEmail || ''),
        empContact: isBusiness ? '' : (F.empContact || ''),
        businessName: isBusiness ? (F.businessName || '') : '',
        businessType: isBusiness ? (F.businessType || '') : '',
        businessAddress: isBusiness ? (F.businessAddress || '') : '',
        businessCity: isBusiness ? (F.businessCity || '') : '',
        businessState: isBusiness ? (F.businessState || '') : '',
        businessVintage: isBusiness ? (F.businessVintage || '') : '',
        gstNumber: isBusiness ? (F.gstNumber || '') : '',
        businessContact: isBusiness ? (F.businessContact || '') : '',

        netIncome: F.netIncome ? String(F.netIncome).replace(/,/g, '') : '',
        incentive: F.incentive ? String(F.incentive).replace(/,/g, '') : '',

        businessDetails: F.businessDetails || {},
        references: F.references || [],
        documentsChecklist: F.documentsChecklist || {}
      };

      try {
        let saved;
        if (state.editingAppId) {
          saved = await updateApplication(state.editingAppId, record);
          const idx = state.applications.findIndex(a => String(a.id) === String(state.editingAppId));

      const num = Number(val) || 0;
      if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2) + ' Cr';
      if (num >= 100000) return '₹' + (num / 100000).toFixed(2) + ' L';

    function exportAllSeparateApplicationExcel(apps) {

      apps.forEach((a, idx) => {

          exportSingleApplicationToExcel(a);
        }, idx * 250);
      });
      showToast(`Triggered export for ${apps.length} separate Excel files!`, 'success');
    }

    function exportApplicationsToExcel(apps) {
      if (!apps || apps.length === 0) { showToast('No applications to export.', 'error'); return; }

      const rows = apps.map(a => ({
        'Application #': a.appNo,
        'Status': a.status,
        'Applicant Role': a.applicantRole || '',
        'Category': a.applicantType || '',
        'Loan Product(s) Requested': (a.loanProducts || []).join('; '),
        'Sub Category': a.loanSubCategory || '',
        'Requested Amount (₹)': a.requestedAmount ? Number(String(a.requestedAmount).replace(/,/g, '')) : '',
        'Tenure (Months)': a.tenureMonths ? Number(a.tenureMonths) : '',
        'Purpose': a.loanPurpose || '',
        'Branch': a.branch || '',
        'RM Name': a.rmName || '',
        'Connector': a.connector || '',
        'Submission Date': a.createdAt ? new Date(a.createdAt).toLocaleString('en-IN') : '',
        'Full Name': [a.firstName, a.middleName, a.lastName].filter(Boolean).join(' '),
        'First Name': a.firstName || '', 'Middle Name': a.middleName || '', 'Last Name': a.lastName || '',
        'Gender': a.gender || '', 'DOB': a.dob || '', 'Marital Status': a.maritalStatus || '',
        'PAN Number': a.panNumber || '', 'Aadhaar': a.aadhaar || '',
        'Contact Number': a.currContact || '', 'Email': a.permEmail || '',
        'Current Address': a.currAddress || '', 'Current City': a.currCity || '', 'Current State': a.currState || '',
        'Current Pincode': a.currPincode || '',
        'Permanent Address': a.permAddress || '', 'Permanent City': a.permCity || '', 'Permanent State': a.permState || '',
        'Permanent Pincode': a.permPincode || '',
        'Employer / Business Name': a.employerName || a.businessName || '', 'Designation': a.designation || '',
        'Annual Income (₹)': a.annualIncome ? Number(String(a.annualIncome).replace(/,/g, '')) : '',
        'Net Income (₹)': a.netIncome ? Number(String(a.netIncome).replace(/,/g, '')) : ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const keys = Object.keys(rows[0]);
      worksheet['!cols'] = keys.map(k => {
        let maxLen = k.length;
        rows.forEach(r => {
          const val = r[k];
          if (val !== undefined && val !== null) {
            const l = String(val).split('\n')[0].length;
            if (l > maxLen) maxLen = l;
          }
        });
        return { wch: Math.min(50, Math.max(14, maxLen + 3)) };
      });

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Applications');

      const stamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `SkyFinserv_All_Applications_${stamp}.xlsx`);
      showToast(`Exported ${apps.length} application(s) to Master Excel.`, 'success');
    }

        const q = state.search.trim().toLowerCase();

    /* =========================== STORAGE LAYER (MySQL via REST API + LocalStorage Fallback) =========================== */
    const API_BASE = window.location.protocol === 'file:'
      ? (window.location.origin && window.location.origin !== 'null' && window.location.origin.startsWith('http') ? window.location.origin + '/api' : 'http://localhost:3000/api')
      : '/api';

    async function apiRequest(path, options) {
      const res = await fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: 'Request failed' }));
        throw new Error(body.error || 'Request failed');
      }
      return res.status === 204 ? null : res.json();
    }

    /* IndexedDB Fallback Helper */
    const sfIdb = {
      dbName: 'SkyFinservIDB',
      dbVersion: 1,
      async getDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('store')) db.createObjectStore('store');
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
      },
      async get(key) {
        try {
          const db = await this.getDb();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch { return null; }
      },
      async set(key, val) {
        try {
          const db = await this.getDb();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put(val, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch { return false; }
      }
    };

    /* Client-Side Excel Application Importer */
    async function importApplicationFromExcel(file) {
      if (!file) return;
      showToast('Reading and importing Excel file...', 'info');
      try {
        const reader = new FileReader();
        reader.onload = async function (e) {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });

            const app = {
              createdAt: Date.now(),
              status: 'Submitted'
            };

            if (wb.Sheets['MIS Flat Record']) {
              const rows = XLSX.utils.sheet_to_json(wb.Sheets['MIS Flat Record']);
              if (rows.length > 0) {
                const r = rows[0];
                app.appNo = r['Application #'] || r['appNo'] || r['App #'];
                app.status = r['Status'] || 'Submitted';
                app.applicantRole = r['Applying As'] || 'Borrower';
                app.loanProducts = r['Loan Product(s) Requested'] ? [r['Loan Product(s) Requested']] : ['Business Loan'];
                app.requestedAmount = r['Requested Amount (₹)'] ? Number(r['Requested Amount (₹)']) : null;
                app.tenureMonths = r['Tenure (Months)'] ? Number(r['Tenure (Months)']) : null;
                app.loanPurpose = r['Purpose'] || '';
                app.firstName = r['First Name'] || '';
                app.middleName = r['Middle Name'] || '';
                app.lastName = r['Last Name'] || '';
                app.gender = r['Gender'] || '';
                app.dob = r['DOB'] || '';
                app.panNumber = r['PAN Number'] || '';
                app.currAddress = r['Current Address'] || '';
                app.currCity = r['Current City'] || '';
                app.currState = r['Current State'] || '';
                app.currPincode = r['Current Pincode'] || '';
                app.currContact = r['Current Contact'] || '';
                app.permEmail = r['Permanent Email'] || '';
                app.employerName = r['Employer / Business Name'] || '';
              }
            }

            if (wb.Sheets['Application Details']) {
              const rows = XLSX.utils.sheet_to_json(wb.Sheets['Application Details'], { header: 1 });
              rows.forEach(row => {
                if (!row || row.length < 2) return;
                const k = String(row[0] || '').trim();
                const v = String(row[1] || '').trim();
                if (v === '—' || !v) return;
                if (k === 'Application Number' && !app.appNo) app.appNo = v;
                if (k === 'Status' && !app.status) app.status = v;
                if (k === 'Branch') app.branch = v;
                if (k === 'Relationship Manager (RM)') app.rmName = v;
                if (k === 'Applicant Category') app.applicantType = v;
                if (k === 'Applicant Role') app.applicantRole = v;
                if (k === 'Loan Product(s) Requested' && (!app.loanProducts || !app.loanProducts.length)) {
                  app.loanProducts = v.split(',').map(s => s.trim());
                }
                if (k === 'Requested Loan Amount (₹)' && !app.requestedAmount) {
                  app.requestedAmount = Number(v.replace(/[^0-9.]/g, ''));
                }
                if (k === 'Requested Tenure (Months)' && !app.tenureMonths) {
                  app.tenureMonths = Number(v);
                }
                if (k === 'Loan Purpose') app.loanPurpose = v;
                if (k === 'Full Name' && !app.firstName) {
                  const parts = v.split(' ');
                  app.firstName = parts[0] || '';
                  if (parts.length === 2) {
                    app.lastName = parts[1];
                  } else if (parts.length > 2) {
                    app.middleName = parts.slice(1, -1).join(' ');
                    app.lastName = parts[parts.length - 1];
                  }
                }
                if (k === 'Current Address') app.currAddress = v;
                if (k === 'Current City / State / PIN') {
                  const parts = v.split(',').map(s => s.trim());
                  if (parts[0]) app.currCity = parts[0];
                  if (parts[1]) app.currState = parts[1];
                  if (parts[2]) app.currPincode = parts[2];
                }
              });
            }

            if (!app.appNo) {
              showToast('Invalid Excel workbook: Application # not detected.', 'error');
              return;
            }

            if (wb.Sheets['Bank Accounts']) {
              try { app.bankAccounts = XLSX.utils.sheet_to_json(wb.Sheets['Bank Accounts']); } catch { }
            }
            if (wb.Sheets['Existing Loans']) {
              try { app.existingLoans = XLSX.utils.sheet_to_json(wb.Sheets['Existing Loans']); } catch { }
            }

            const existingIdx = state.applications.findIndex(a => a.appNo === app.appNo);
            if (existingIdx >= 0) {
              state.applications[existingIdx] = { ...state.applications[existingIdx], ...app };
            } else {
              state.applications.unshift(app);
            }
            setLocalApplications(state.applications);

            // Sync with backend API
            try {
              let binary = '';
              for (let i = 0; i < data.byteLength; i++) binary += String.fromCharCode(data[i]);
              const base64Data = btoa(binary);
              await apiRequest('/import-application-excel', {
                method: 'POST',
                body: JSON.stringify({ fileName: file.name, fileData: base64Data })
              });
            } catch (apiErr) {
              console.warn('API import upload note:', apiErr.message);
            }

            showToast(`Application ${app.appNo} successfully imported and restored!`, 'success');
            render();
          } catch (readErr) {
            console.error('Error parsing excel workbook:', readErr);
            showToast('Failed to parse Excel file: ' + readErr.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        showToast('File read error: ' + err.message, 'error');
      }
    }

    // Create a new application on the server with local storage fallback; returns the saved record
    async function createApplication(record) {
      try {
        return await apiRequest('/applications', { method: 'POST', body: JSON.stringify(record) });
      } catch (e) {
        const appNo = record.appNo ? String(record.appNo).trim() : '';
        const saved = {
          ...record,
          id: Date.now(),
          appNo,
          createdAt: record.createdAt || Date.now()

    function appToDmPayload(app) {
      const createdDate = app.createdAt ? new Date(Number(app.createdAt)) : new Date();
      const monthStr = createdDate.toLocaleString('en-US', { month: 'short' }) + '-' + String(createdDate.getFullYear()).slice(-2);
      const formattedDate = createdDate.toISOString().split('T')[0];

      const fullName = [app.firstName, app.middleName, app.lastName].filter(Boolean).join(' ').trim();
      const employer = app.employerName || app.businessName || '';
      const bank = (app.bankAccounts && app.bankAccounts[0] && app.bankAccounts[0].bankName) ? app.bankAccounts[0].bankName : 'TBD';

      let decision = 'LOGIN';
      if (app.status === 'Approved') decision = 'SANCTION';
      else if (app.status === 'Closed') decision = 'DISBURSED';
      else if (app.status === 'Rejected') decision = 'REJECTED';

      const tr = app.tracking || {};

      return {
        id: Date.now() + Math.floor(Math.random() * 1000),
        month: tr.month || monthStr,
        entity: tr.entity || app.branch || 'SkyFinserv',
        connector: tr.connector || app.connector || '',
        applicant: fullName || 'Applicant',
        employer: tr.businessEmployer || employer,
        category: tr.category || app.applicantType || 'Salaried',
        bank: tr.bankNbfc || bank,
        rmName: tr.smName || app.rmName || '',
        product: tr.product || app.assignedProduct || (app.loanProducts && app.loanProducts[0]) || '',
        program: tr.freshBtTopup || 'FRESH',
        creditProgram: tr.creditProgram || app.loanPurpose || 'INCOME',
        loginDate: tr.loginDate || formattedDate,
        appliedAmount: tr.appliedAmount || app.requestedAmount || '',
        decisionDate: tr.decisionDate || formattedDate,
        decision: tr.decision || decision,
        sanctionAmount: tr.sanctionedAmount || app.requestedAmount || '',
        disbDate: tr.disbDate || '',
        disbAmount: tr.disbAmount || '',
        li: tr.ll || '',
        gi: tr.gx || '',
        pf: tr.pf || '',
        roi: tr.roi || '',
        emi: tr.emi || '',
        tenure: tr.tenure || app.tenureMonths || '',
        pdcAmount: tr.ddRtgsAmount || '',
        pdcDate: tr.ddRtgsDate || '',
        queries: tr.deviation || '',
        appId: app.appNo || '',
        noiDate: tr.noi || '',
        remark: tr.remark || '',
      };
    }

    async function syncDmRecordsApi() {
      try {
        const res = await apiRequest('/dm-records/sync', { method: 'POST' });
        if (res && Array.isArray(res.records)) {
          state.dmData = res.records;
          setLocalDmData(state.dmData);
        }
        return res;
      } catch (e) {
        console.warn('API syncDmRecordsApi failed, using local sync fallback:', e.message);
        let localApps = state.applications || [];
        let localDm = getLocalDmData();
        const existingAppIds = new Set(localDm.map(r => r.appId).filter(Boolean));
        let syncedCount = 0;

        for (const a of localApps) {
          if (a.appNo && existingAppIds.has(a.appNo)) continue;
          const mapped = appToDmPayload(a);
          localDm.unshift(mapped);
          syncedCount++;
        }
        setLocalDmData(localDm);
        state.dmData = localDm;
        return { synced: syncedCount, records: localDm };
      }
    }

    function getDmVisibleColumns() {
      if (Array.isArray(state.dmVisibleColumns) && state.dmVisibleColumns.length > 0) {
        return state.dmVisibleColumns;
      }
      try {
        const saved = localStorage.getItem('skyfinserv_dm_columns');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.dmVisibleColumns = parsed;
            return parsed;
          }
        }
      } catch (e) { }
      const allCols = DM_COLUMNS.map(c => c.key);
      state.dmVisibleColumns = allCols;
      return allCols;

    function dmFilteredData() {
      let list = state.dmData || [];
      const q = (state.dmSearch || '').toLowerCase();
      const month = state.dmMonthFilter || 'All';
      const decision = state.dmDecisionFilter || 'All';
      const bank = state.dmBankFilter || 'All';

      if (month !== 'All') list = list.filter(r => (r.month || '').toLowerCase() === month.toLowerCase());
      if (decision !== 'All') list = list.filter(r => (r.decision || '').toLowerCase() === decision.toLowerCase());
      if (bank !== 'All') list = list.filter(r => (r.bank || '').toLowerCase().includes(bank.toLowerCase()));

      if (q) {
        list = list.filter(r => Object.values(r).some(v => String(v || '').toLowerCase().includes(q)));
      }
      return list;
    }

      try {
        await deleteDmRecord(recordId);
        state.dmData = state.dmData.filter(r => r.id !== recordId);
        addAuditLog('DM_DELETE', `Deleted record ID ${recordId}`);
        showToast('Record deleted.', 'success');

      }

    async function dmSaveRecord() {
      const rec = { ...state.dmForm };
      const isEdit = Boolean(state.dmEditing);
      try {
        const saved = isEdit
          ? await updateDmRecord(state.dmEditing, rec)
          : await createDmRecord(rec);
        if (isEdit) {
          state.dmData = state.dmData.map(r => r.id === saved.id ? saved : r);
          addAuditLog('DM_EDIT', `Edited record ${saved.applicant || saved.id}`);
        } else {
          state.dmData = [saved, ...state.dmData];
          addAuditLog('DM_ADD', `Added record ${saved.applicant || ''}`);
        }
        state.dmModal = false;
        state.dmEditing = null;
        state.dmForm = {};
        showToast(isEdit ? 'Record updated successfully.' : 'Record added successfully.', 'success');
      } catch (e) {
        console.error(e);
        showToast('Could not save record.', 'error');
      }
      render();
    }

    function dmExportExcel() {
      const visibleKeys = getDmVisibleColumns();
      const activeCols = DM_COLUMNS.filter(c => visibleKeys.includes(c.key));
      const colsToExport = activeCols.length > 0 ? activeCols : DM_COLUMNS;

      const rows = dmFilteredData().map(({ id, createdAt, updatedAt, ...rest }) => {
        const row = {};
        colsToExport.forEach(c => row[c.label] = rest[c.key] || '');
        return row;
      });
      if (!rows.length) { showToast('No records to export.', 'error'); return; }
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      ws['!cols'] = colsToExport.map(c => ({ wch: Math.max(c.label.length + 2, 14) }));
      XLSX.writeFile(wb, `SkyFinserv_DataManager_${new Date().toISOString().slice(0, 10)}.xlsx`);
      addAuditLog('DM_EXPORT_EXCEL', `Exported ${rows.length} records (${colsToExport.length} columns)`);
      showToast(`Exported ${rows.length} records (${colsToExport.length} columns) to Excel.`, 'success');
    }

    function dmImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          if (json && json.length > 1) {
            const headerRow = json[0].map(h => String(h || '').trim());
            let count = 0;
            for (let i = 1; i < json.length; i++) {
              const row = json[i];
              if (!row || row.length === 0) continue;
              const rec = { id: Date.now() + i };
              headerRow.forEach((label, cIdx) => {
                const colDef = DM_COLUMNS.find(c => c.label.toLowerCase() === label.toLowerCase() || c.key.toLowerCase() === label.toLowerCase());
                const val = row[cIdx] !== undefined ? row[cIdx] : '';
                if (colDef) {
                  rec[colDef.key] = val;
                } else {
                  rec[label] = val;
                }
              });
              state.dmData.unshift(rec);
              count++;
            }
            setLocalDmData(state.dmData);
            showToast(`Successfully imported ${count} records from Excel into Data Manager!`, 'success');
            render();
          } else {
            showToast('Excel file is empty or missing data rows.', 'error');
          }
        } catch (err) {
          showToast('Could not import Excel file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

      const v = String(val).toUpperCase();
      let cls = 'dm-badge-default';
      if (v.includes('SANCTION') || v.includes('APPROVED')) cls = 'dm-badge-sanction';
      else if (v.includes('DISBURSED')) cls = 'dm-badge-disbursed';
      else if (v.includes('LOGIN')) cls = 'dm-badge-login';
      else if (v.includes('FILE SEND') || v.includes('SEND')) cls = 'dm-badge-filesend';
      return `<span class="dm-badge ${cls}">${val}</span>`;
    }

        const res = await syncDmRecordsApi();
        const count = res ? (res.synced || 0) : 0;
        await loadDmRecords();
        if (count > 0) {
          showToast(`Synced ${count} application(s) into Data Manager and saved to single Excel file!`, 'success');
          addAuditLog('DM_SYNC', `Synced ${count} applications to DM records and updated master Excel file`);
        } else {
          showToast('All applications are synced in Data Manager and up to date in master Excel file.', 'success');

        showToast('Could not sync portal applications.', 'error');
      }
      render();

    function computeFdBankTotals() {
      const banks = (state.fdData && state.fdData.bankingDetails) || [];
      const abbCols = getFdAbbColumns();
      let totIw = 0, totOw = 0;
      const colTotals = {};
      abbCols.forEach(c => { colTotals[c.key] = 0; });

      banks.forEach(b => {
        totIw += Number(b.iwReturn) || 0;
        totOw += Number(b.owReturn) || 0;
        abbCols.forEach(c => {
          let val = b[c.key];
          if ((val === undefined || val === '') && c.key === 'abb') {
            val = b.abb !== undefined && b.abb !== '' ? b.abb : (b.abbAxis !== undefined && b.abbAxis !== '' ? b.abbAxis : 0);
          }
          colTotals[c.key] += Number(val) || 0;
        });
      });

      let grandTotAbb = 0;
      Object.values(colTotals).forEach(v => { grandTotAbb += v; });

      return {
        count: banks.length,
        totIw,
        totOw,
        colTotals,
        grandTotAbb
      };
    }

        state.fdData.btAnalysis[idx][field] = val;

      // Auto-calculate dependent fields only when their triggers change
      const r = state.fdData.btAnalysis[idx];
      const p = Number(r.principal) || 0;
      const eEmi = Number(r.existingEmi) || 0;
      const pt = Number(r.pendingTenure) || 0;
      const oEmi = Number(r.offeredEmi) || 0;

        r.totalPayExisting = eEmi * pt;

        r.interestExisting = (Number(r.totalPayExisting) || 0) - p;
      } else if (field === 'principal') {
        if (r.totalPayExisting) r.interestExisting = Number(r.totalPayExisting) - p;
        if (r.totalPayOffered) r.interestOffered = Number(r.totalPayOffered) - p;
      }

      if (field === 'offeredEmi' || field === 'pendingTenure') {
        r.totalPayOffered = oEmi * pt;
        r.interestOffered = r.totalPayOffered - p;
      } else if (field === 'totalPayOffered') {
        r.interestOffered = (Number(r.totalPayOffered) || 0) - p;
      }

      if (field === 'principal' || field === 'fcPercent') {
        r.fcCharges = Math.round(p * (Number(r.fcPercent) || 0) / 100 * 100) / 100;

      if (field === 'principal' || field === 'pfStampPercent') {
        r.pfStampCharges = Math.round(p * (Number(r.pfStampPercent) || 0) / 100 * 100) / 100;
      }

      if (field !== 'netBenefit') {

        const intOf = Number(r.interestOffered) || 0;

      if (!dojStr) return '';
      const parts = dojStr.split('-');
      if (parts.length < 3) return '';
      let yr = parseInt(parts[2], 10);
      if (yr < 100) yr += (yr > 50 ? 1900 : 2000);
      const currentYr = new Date().getFullYear();
      const diff = currentYr - yr;
      return diff > 0 ? String(diff) : '1';
    }

        const y2 = ent.years[1] ? Number(ent.years[1][key]) || 0 : 0;
        considerSum += y1;
        yr1yr2Sum += (y1 + y2);

      const avg2yr = Math.round(yr1yr2Sum / 2);
      return { considerSum, avg2yr };

    /* ── GST Details Matrix Operations ── */
    function computeGstTotals(firm) {
      let totFy1 = 0;
      let totFy2 = 0;
      if (firm && Array.isArray(firm.months)) {
        firm.months.forEach(m => {
          totFy1 += (Number(m.fy1) || 0);
          totFy2 += (Number(m.fy2) || 0);
        });
      }
      return { totFy1, totFy2 };
    }
    window.computeGstTotals = computeGstTotals;

    function fdUpdateGstField(field, val) {
      if (!state.fdData) state.fdData = defaultBlankDatasheet();
      if (!state.fdData.gstDetailsList) state.fdData.gstDetailsList = [defaultGstFirm()];
      const idx = state.fdData.activeGstIdx || 0;
      if (!state.fdData.gstDetailsList[idx]) state.fdData.gstDetailsList[idx] = defaultGstFirm();
      state.fdData.gstDetailsList[idx][field] = val;
      debouncedRender();
    }
    window.fdUpdateGstField = fdUpdateGstField;

    function fdUpdateGstMonth(mIdx, fyKey, val, liveOnly = false) {
      if (!state.fdData) state.fdData = defaultBlankDatasheet();
      if (!state.fdData.gstDetailsList) state.fdData.gstDetailsList = [defaultGstFirm()];
      const idx = state.fdData.activeGstIdx || 0;
      const firm = state.fdData.gstDetailsList[idx] || (state.fdData.gstDetailsList[idx] = defaultGstFirm());
      if (!firm.months || !firm.months[mIdx]) return;
      const clean = String(val).replace(/,/g, '').trim();
      const num = clean === '' ? 0 : Number(clean);
      firm.months[mIdx][fyKey] = isNaN(num) ? 0 : num;

      // Real-time calculation and DOM update for Total row
      const totals = computeGstTotals(firm);
      const elTot1 = document.getElementById('fd-gst-total-fy1');
      const elTot2 = document.getElementById('fd-gst-total-fy2');
      if (elTot1) {
        elTot1.innerHTML = `<span style="position:absolute;top:0;left:0;width:0;height:0;border-top:5px solid #16a34a;border-right:5px solid transparent;"></span>` + (totals.totFy1 > 0 ? fdFormatNum(totals.totFy1) : '-');
      }
      if (elTot2) {
        elTot2.innerHTML = `<span style="position:absolute;top:0;left:0;width:0;height:0;border-top:5px solid #16a34a;border-right:5px solid transparent;"></span>` + (totals.totFy2 > 0 ? fdFormatNum(totals.totFy2) : '-');
      }

      if (liveOnly) return;
      debouncedRender();
    }
    window.fdUpdateGstMonth = fdUpdateGstMonth;

    function fdAddGstFirm() {
      if (!state.fdData) state.fdData = defaultBlankDatasheet();
      if (!state.fdData.gstDetailsList) state.fdData.gstDetailsList = [defaultGstFirm()];
      const count = state.fdData.gstDetailsList.length + 1;
      state.fdData.gstDetailsList.push(defaultGstFirm(`Firm ${count}`));
      state.fdData.activeGstIdx = state.fdData.gstDetailsList.length - 1;

      state.fdData = defaultBlankDatasheet();

        });

    async function fdSaveDatasheet() {

          applicationId: state.fdData.selectedAppId || '',
          datasheet: state.fdData
        };
        await apiRequest('/financial-datasheets', { method: 'POST', body: JSON.stringify(payload) });

    async function loadFdDatasheet() {
      try {
        const datasheets = await apiRequest('/financial-datasheets');
        if (Array.isArray(datasheets) && datasheets.length > 0) {
          const ds = datasheets[0].datasheet;
          if (ds) {
            state.fdData = ds;
            if (!state.fdData.bankingDetails) {
              state.fdData.bankingDetails = [];
            }
            return;
          }
        }
      } catch (e) { }
      try {
        const local = localStorage.getItem('sf_fd_datasheet_local');
        if (local) {
          state.fdData = JSON.parse(local);
        } else {
          state.fdData = defaultBlankDatasheet();
        }
      } catch (e) { state.fdData = defaultBlankDatasheet(); }
      if (!state.fdData) state.fdData = defaultBlankDatasheet();
      if (!state.fdData.bankingDetails) {
        state.fdData.bankingDetails = [];
      }

      // Auto-heal old saved state where single applicant was split across 2 Applicant columns
      if (state.fdData && Array.isArray(state.fdData.entities) && state.fdData.entities.length === 2) {
        const e1 = state.fdData.entities[0];
        const e2 = state.fdData.entities[1];
        if (e1 && e2 && e1.role === 'Applicant' && e2.role === 'Applicant' && (!e1.dob || !e1.age) && (e2.dob || e2.age)) {
          state.fdData.entities = [{
            id: 'ent-1',
            role: 'Applicant',
            name: e2.name || e1.name,
            doj: e1.doj || e2.doj || '',
            vintage: e1.vintage || e2.vintage || '',
            employer: e1.employer || e2.employer || e1.name || '',
            dob: e2.dob || e1.dob || '',
            age: e2.age || e1.age || (e2.dob ? calcAgeFromDob(e2.dob) : ''),
            businessAddress: e1.businessAddress || e2.businessAddress || '',
            years: (e1.years && e1.years[0] && e1.years[0].turnover) ? e1.years : (e2.years || [
              { date: "31-Oct-25", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "23-Oct-24", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "14-Oct-23", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 }
            ])
          }];
        }
      }
    }

    function fdFetchApplicationData() {
      const appId = state.fdData.selectedAppId;
      if (!appId) return;
      const app = state.applications.find(a => a.id === appId || a.appNo === appId);
      if (!app) return;

      const isBiz = (app.applicantType || '').toLowerCase().includes('business');

      // 1. Name: Person's name (e.g. Amol shyamrao Junghare)
      const fullName = [app.firstName, app.middleName, app.lastName].filter(Boolean).join(' ').trim()
        || (isBiz ? (app.businessName || 'Primary Applicant') : 'Primary Applicant');

      // 2. DOJ / Vintage in Yrs
      const dojVal = app.doj || app.empDoj || '';
      const vintageVal = isBiz
        ? (app.businessVintage || app.currVintage || '')
        : (app.empVintage || app.currVintage || '');

      // 3. Business/Employer Name
      const employerVal = isBiz ? (app.businessName || '') : (app.employerName || '');

      // 4. DOB / Age in yrs
      const dobVal = app.dob || '';
      const ageVal = dobVal ? calcAgeFromDob(dobVal) : (app.age || '');

      // 5. Business Address
      const addressVal = isBiz
        ? (app.businessAddress || app.officeAddress || app.currAddress || '')
        : (app.officeAddress || app.currAddress || '');

      // Financials / ITR
      const y1Turnover = isBiz ? (Number(app.annualIncome) || Number(app.turnover) || 0) : 0;
      const y1NetIncome = Number(app.netIncome) || (isBiz ? (app.annualIncome ? Math.round(Number(app.annualIncome) / 12) : 0) : (Number(app.monthlyIncome) || 0));

      // Primary Applicant Entity
      const entities = [
        {
          id: "ent-1",
          role: "Applicant",
          name: fullName,
          doj: dojVal,
          vintage: vintageVal,
          employer: employerVal,
          dob: dobVal,
          age: ageVal,
          businessAddress: addressVal,
          years: [
            { date: "31-Oct-25", turnover: y1Turnover, netIncome: y1NetIncome, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
            { date: "23-Oct-24", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
            { date: "14-Oct-23", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 }
          ]
        }
      ];

      // Auto-populate Co-Applicants if available
      if (app.hasCoborrower) {
        const cbs = Array.isArray(app.coborrower) ? app.coborrower : (Array.isArray(app.coborrowers) ? app.coborrowers : (app.coborrower ? [app.coborrower] : []));
        cbs.forEach((cb, cbIdx) => {
          if (!cb) return;
          const cbName = [cb.firstName, cb.middleName, cb.lastName].filter(Boolean).join(' ').trim() || `Co-Applicant ${cbIdx + 1}`;
          entities.push({
            id: `ent-${cbIdx + 2}`,
            role: `Co-Applicant ${cbIdx + 1}`,
            name: cbName,
            doj: cb.doj || '',
            vintage: cb.empVintage || cb.currVintage || '',
            employer: cb.employerName || '',
            dob: cb.dob || '',
            age: cb.dob ? calcAgeFromDob(cb.dob) : '',
            businessAddress: cb.currAddress || cb.officeAddress || '',
            years: [
              { date: "31-Oct-25", turnover: 0, netIncome: cb.annualIncome ? Math.round(Number(cb.annualIncome) / 12) : 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "23-Oct-24", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "14-Oct-23", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 }
            ]
          });
        });
      }

      state.fdData.entities = entities;
      state.fdData.title = `Financial CAM Matrix — ${app.appNo} (${fullName})`;

      // Deal summary finance amount & tenure
      if (!state.fdData.dealSummary) state.fdData.dealSummary = {};
      if (app.requestedAmount) state.fdData.dealSummary.financeAmount = Number(app.requestedAmount);
      if (app.tenureMonths) state.fdData.dealSummary.tenureMonths = Number(app.tenureMonths);

      // Existing loans mapping from application
      if (app.existingLoans && Array.isArray(app.existingLoans)) {
        const validLoans = app.existingLoans.filter(l => l && (l.institution || l.bankName || l.provider || l.loanAmount || l.amount || l.emi));
        if (validLoans.length > 0) {
          state.fdData.loans = validLoans.map((l, lIdx) => ({
            id: `loan-${lIdx + 1}`,
            belongsTo: l.belongsTo || fullName || 'Applicant',
            provider: l.provider || l.bankName || l.financer || l.institution || '',
            type: l.type || l.loanType || '',
            amount: Number(l.amount || l.loanAmount || 0),
            tenure: Number(l.tenure || l.tenor || l.tenureMonths || 0) || '',
            startDate: l.startDate || l.emiStartDate || '',
            emi: Number(l.emi || l.emiAmount || 0),
            emiPaid: Number(l.emiPaid || l.noOfEmiPaid || l.monthsPaid || 0) || '',
            pos: Number(l.pos || l.outstandingAmount || 0),
            overdue: Number(l.overdue || l.overdueCharges || 0),
            bounceCount: Number(l.bounceCount || l.bounce || 0),
            obligation: l.obligation !== undefined ? l.obligation : 'Yes',
            emiObligation: Number(l.emiObligation || l.emi || l.emiAmount || 0),
            bt: l.bt || 'No',
            btEmi: Number(l.btEmi || 0),
            btAmount: Number(l.btAmount || 0),
            reflectedIn: l.reflectedIn || l.bankName || l.institution || ''
          }));
        }
      }

      // Section 3: Banking Details mapping from application
      if (app.bankAccounts && Array.isArray(app.bankAccounts)) {
        const validBanks = app.bankAccounts.filter(b => b && (b.bankName || b.accountNumber || b.accountType || b.avgBalance));
        if (validBanks.length > 0) {
          state.fdData.bankingDetails = validBanks.map(b => ({
            accountHolder: fullName,
            bankName: b.bankName || '',
            accountType: b.accountType || 'CA',
            startDate: b.openingYear ? `01-01-${b.openingYear}` : '',
            endDate: '',
            iwReturn: b.iwReturn !== undefined ? b.iwReturn : '',
            owReturn: b.owReturn !== undefined ? b.owReturn : '',
            abb: b.avgBalance ? (Number(String(b.avgBalance).replace(/,/g, '')) || '') : ''
          }));
        }
      }

      // Section 4: Property valuation mapping from application
      if (app.propertyDetails) {
        const pd = app.propertyDetails;
        if (pd.propertyType || pd.ownerName || pd.builtUpArea || pd.carpetArea || pd.marketValue) {
          const mVal = Number(pd.marketValue) || 0;
          state.fdData.propertyValuation = [{
            propertyType: pd.propertyType || 'Residential House',
            owner: pd.ownerName || fullName || '',
            label: pd.propertyType || 'Residential House',
            area: pd.carpetArea || '',
            constructionArea: pd.builtUpArea || '',
            rate: '',
            constructionRate: '',
            totalValue: mVal || '',
            ltv: 70,
            eligible: mVal > 0 ? Math.round(mVal * 0.70) : ''
          }];
        }
      }

      // Section 5: GST Details mapping from application
      const gstNum = app.gstNumber || (app.businessDetails && app.businessDetails.gst) || '';
      const firmName = app.businessName || (app.businessDetails && app.businessDetails.businessName) || '';
      if (gstNum || firmName) {
        if (!state.fdData.gstDetailsList || !state.fdData.gstDetailsList.length) {
          state.fdData.gstDetailsList = [defaultGstFirm()];
        }
        if (gstNum) state.fdData.gstDetailsList[0].gstin = gstNum;
        if (firmName) state.fdData.gstDetailsList[0].firmName = firmName;
      }

      showToast(`Fetched profile, loans, banking & property details for ${fullName} (${app.appNo})!`, 'success');
    }

    async function fdMapToApplication() {
      const appId = state.fdData.selectedAppId;
      if (!appId) {
        showToast('Please select a loan application from the dropdown to map data.', 'error');
        return;
      }

      const netTotals = computeFdTotals('netIncome');
      const deprTotals = computeFdTotals('depreciation');
      const intTotals = computeFdTotals('interest');
      const rentTotals = computeFdTotals('rent');
      const addIncTotals = computeFdTotals('addIncome');
      const taxTotals = computeFdTotals('taxPaid');

      const consideredCashflow = netTotals.considerSum + deprTotals.considerSum + intTotals.considerSum + rentTotals.considerSum + addIncTotals.considerSum - taxTotals.considerSum;
      const avg2yrCashflow = netTotals.avg2yr + deprTotals.avg2yr + intTotals.avg2yr + rentTotals.avg2yr + addIncTotals.avg2yr - taxTotals.avg2yr;

      const app = state.applications.find(a => a.id === appId || a.appNo === appId);

      try {
        if (app) {
          app.grossIncome = Math.round(avg2yrCashflow / 12);
          app.netIncome = Math.round(consideredCashflow / 12);
          if (!app.tracking) app.tracking = {};
          app.tracking.noi = avg2yrCashflow;
          app.tracking.appliedAmount = app.requestedAmount || 5000000;

          await updateApplication(app.id, { grossIncome: app.grossIncome, netIncome: app.netIncome });
          await fetch(`/api/applications/${app.id}/tracking`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ noi: avg2yrCashflow }),
          });
          showToast(`Mapped Financial CAM to Application #${app.appNo} (Net Cashflow: ₹${consideredCashflow.toLocaleString('en-IN')})`, 'success');
          addAuditLog('FD_MAPPED_APP', `Mapped CAM to ${app.appNo}`);
        } else {
          showToast(`Datasheet metrics mapped for ID: ${appId}`, 'success');
        }
      } catch (e) {
        showToast('Could not save mapped values to backend.', 'error');
      }
      render();
    }

          'Over due charges', 'No. Bounce', 'Obligation', 'EMI obligation',

      loans.forEach(l => {

          out, l.overdueCharges !== undefined ? l.overdueCharges : '', l.bounceCount !== undefined ? l.bounceCount : '',
          isObl ? 'yes' : 'No', isObl ? emi : 0, isBt ? 'yes' : 'No', isBt ? emi : 0, isBt ? out : 0,
          l.emiReflectedIn || ''
        ]);

      const lt = computeFdLoanTotals();
      aoaLoans.push([
        'Total', '', '', lt.totAmount, lt.totTenure || '', '', lt.totEmi, lt.totEmiPaid || '',
        lt.totOutstanding, lt.totOverdue || '', lt.totBounce || '', 'No', lt.totEmiObligation,

      ]);

      const wsLoans = XLSX.utils.aoa_to_sheet(aoaLoans);
      XLSX.utils.book_append_sheet(wb, wsLoans, 'Loan Details');

      // 3. Sheet: Banking Details
      const banks = state.fdData.bankingDetails || [];
      const abbCols = getFdAbbColumns();
      const aoaBank = [
        ['Banking Details — Bank Statements & ABB Matrix'],
        ['Account Holder Name', 'Bank Name', 'Type of account', 'Start Date', 'End Date', 'I/w Return', 'O/w Return', ...abbCols.map(c => c.label)]
      ];
      banks.forEach(b => {
        const row = [
          b.accountHolder || '', b.bankName || '', b.accountType || '', b.startDate || '', b.endDate || '',
          b.iwReturn !== undefined ? b.iwReturn : '', b.owReturn !== undefined ? b.owReturn : ''
        ];

            val = b.abb !== undefined && b.abb !== '' ? b.abb : (b.abbAxis !== undefined && b.abbAxis !== '' ? b.abbAxis : '');
          }
          row.push(val !== '' && val !== undefined ? Number(val) : '');

        aoaBank.push(row);
      });
      const bt = computeFdBankTotals();
      const totRow = [
        `Total (${banks.length} Accounts)`, '', '', '', '', bt.totIw, bt.totOw
      ];
      abbCols.forEach(c => {
        totRow.push(bt.colTotals[c.key] || 0);
      });
      aoaBank.push(totRow);
      const wsBank = XLSX.utils.aoa_to_sheet(aoaBank);
      // 4. Sheet: GST Details
      const gstList = (state.fdData.gstDetailsList && state.fdData.gstDetailsList.length > 0)
        ? state.fdData.gstDetailsList
        : [defaultGstFirm()];
      const aoaGst = [
        ['GST Details — Monthly Turnover Matrix'],
        []
      ];
      gstList.forEach((g, gIdx) => {
        aoaGst.push([`Firm ${gIdx + 1}: ${g.firmName || 'Unnamed Firm'}`]);
        aoaGst.push(['Month', g.fy1 || '21-22', g.fy2 || '22-23']);
        const months = ['April', 'May', 'Jun', 'July', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
        let t1 = 0, t2 = 0;
        months.forEach((m, mIdx) => {
          const mData = (g.months && g.months[mIdx]) ? g.months[mIdx] : { fy1: 0, fy2: 0 };
          const val1 = Number(mData.fy1) || 0;
          const val2 = Number(mData.fy2) || 0;
          t1 += val1; t2 += val2;
          aoaGst.push([m, val1, val2]);
        });
        aoaGst.push(['Total', t1, t2]);
        aoaGst.push([]);
      });
      const wsGst = XLSX.utils.aoa_to_sheet(aoaGst);
      XLSX.utils.book_append_sheet(wb, wsGst, 'GST Details');

      XLSX.writeFile(wb, `SkyFinserv_FinancialDatasheet_${new Date().toISOString().slice(0, 10)}.xlsx`);
      showToast('Exported Financial Datasheet (Business, GST, Loan & Banking Details) to Excel.', 'success');
    }

    function fdImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const newEntities = [];
          const newLoans = [];

          // 1. Parse Business Details sheet
          const bizSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('business') || s.toLowerCase().includes('cam') || s.toLowerCase().includes('financial')) || workbook.SheetNames[0];
          const bizSheet = workbook.Sheets[bizSheetName];
          if (bizSheet) {
            const rows = XLSX.utils.sheet_to_json(bizSheet, { header: 1 });
            if (rows && rows.length > 2) {
              let roleRowIdx = -1, nameRowIdx = -1, dojRowIdx = -1, empRowIdx = -1, dobRowIdx = -1, addrRowIdx = -1, dateRowIdx = -1;
              const keyRowIndices = {};

              rows.forEach((r, idx) => {
                if (!r || !r[0]) return;
                const label = String(r[0]).trim().toLowerCase();
                if (label.includes('financial parameter') || label.includes('role') || label.includes('business details')) roleRowIdx = idx;
                if (label === 'name') nameRowIdx = idx;
                if (label.includes('doj') || label.includes('vintage')) dojRowIdx = idx;
                if (label.includes('business') && label.includes('employer')) empRowIdx = idx;
                if (label.includes('dob') || label.includes('age')) dobRowIdx = idx;
                if (label.includes('address')) addrRowIdx = idx;
                if (label.includes('itr') || label.includes('salary date')) dateRowIdx = idx;

                if (label.includes('turnover')) keyRowIndices['turnover'] = idx;
                if (label.includes('net business') || label.includes('net income') || label.includes('salary income')) keyRowIndices['netIncome'] = idx;
                if (label.includes('depreciation')) keyRowIndices['depreciation'] = idx;
                if (label.includes('interest')) keyRowIndices['interest'] = idx;
                if (label.includes('rent')) keyRowIndices['rent'] = idx;
                if (label.includes('additional income') || label.includes('remuneration')) keyRowIndices['addIncome'] = idx;
                if (label.includes('tax paid')) keyRowIndices['taxPaid'] = idx;
              });

              if (nameRowIdx !== -1) {
                const nameRow = rows[nameRowIdx];
                const roleRow = roleRowIdx !== -1 ? rows[roleRowIdx] : [];
                const dojRow = dojRowIdx !== -1 ? rows[dojRowIdx] : [];
                const empRow = empRowIdx !== -1 ? rows[empRowIdx] : [];
                const dobRow = dobRowIdx !== -1 ? rows[dobRowIdx] : [];
                const addrRow = addrRowIdx !== -1 ? rows[addrRowIdx] : [];
                const dateRow = dateRowIdx !== -1 ? rows[dateRowIdx] : [];

                for (let col = 1; col < nameRow.length; col += 3) {
                  const nameVal = nameRow[col];
                  if (!nameVal || String(nameVal).toLowerCase().includes('consider') || String(nameVal).toLowerCase().includes('average')) continue;

                  const roleVal = (roleRow && roleRow[col]) ? String(roleRow[col]) : 'Applicant';
                  const dojVal = (dojRow && dojRow[col]) ? String(dojRow[col]) : '';
                  const vintageVal = (dojRow && dojRow[col + 1]) ? String(dojRow[col + 1]) : '';
                  const empVal = (empRow && empRow[col]) ? String(empRow[col]) : '';
                  const dobVal = (dobRow && dobRow[col]) ? String(dobRow[col]) : '';
                  const ageVal = (dobRow && dobRow[col + 1]) ? String(dobRow[col + 1]) : (dobVal ? calcAgeFromDob(dobVal) : '');
                  const addrVal = (addrRow && addrRow[col]) ? String(addrRow[col]) : '';

                  const y1Date = (dateRow && dateRow[col]) ? String(dateRow[col]) : '31-Oct-25';
                  const y2Date = (dateRow && dateRow[col + 1]) ? String(dateRow[col + 1]) : '23-Oct-24';
                  const y3Date = (dateRow && dateRow[col + 2]) ? String(dateRow[col + 2]) : '14-Oct-23';

                  const getVal = (key, cOffset) => {
                    const rIdx = keyRowIndices[key];
                    if (rIdx !== undefined && rows[rIdx]) {
                      const raw = rows[rIdx][col + cOffset];
                      return Number(raw) || 0;
                    }
                    return 0;
                  };

                  newEntities.push({
                    id: `ent-${newEntities.length + 1}`,
                    role: roleVal,
                    name: String(nameVal),
                    doj: dojVal,
                    vintage: vintageVal,
                    employer: empVal,
                    dob: dobVal,
                    age: ageVal,
                    businessAddress: addrVal,
                    years: [
                      { date: y1Date, turnover: getVal('turnover', 0), netIncome: getVal('netIncome', 0), depreciation: getVal('depreciation', 0), interest: getVal('interest', 0), rent: getVal('rent', 0), addIncome: getVal('addIncome', 0), taxPaid: getVal('taxPaid', 0) },
                      { date: y2Date, turnover: getVal('turnover', 1), netIncome: getVal('netIncome', 1), depreciation: getVal('depreciation', 1), interest: getVal('interest', 1), rent: getVal('rent', 1), addIncome: getVal('addIncome', 1), taxPaid: getVal('taxPaid', 1) },
                      { date: y3Date, turnover: getVal('turnover', 2), netIncome: getVal('netIncome', 2), depreciation: getVal('depreciation', 2), interest: getVal('interest', 2), rent: getVal('rent', 2), addIncome: getVal('addIncome', 2), taxPaid: getVal('taxPaid', 2) }
                    ]
                  });
                }
              }
            }
          }

          // 2. Parse Loan Details sheet
          const loanSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('loan') || s.toLowerCase().includes('obligation') || s.toLowerCase().includes('bt'));
          const loanSheet = loanSheetName ? workbook.Sheets[loanSheetName] : null;
          if (loanSheet) {
            const lRows = XLSX.utils.sheet_to_json(loanSheet, { header: 1 });
            if (lRows && lRows.length > 1) {
              let headerFound = false;
              for (const r of lRows) {
                if (!r || r.length === 0) continue;
                const col0 = String(r[0] || '').trim();
                if (col0.toLowerCase().includes('loan belows') || col0.toLowerCase().includes('loan belongs') || col0.toLowerCase().includes('borrower')) {
                  headerFound = true;
                  continue;
                }
                if (headerFound) {
                  if (!col0 || col0.toLowerCase().includes('total') || col0.toLowerCase().includes('principle') || col0.toLowerCase().includes('plan') || col0.toLowerCase().includes('eligibility')) break;
                  newLoans.push({
                    loanBelongsTo: col0,
                    loanProvider: r[1] || '',
                    type: r[2] || '',
                    amount: Number(r[3]) || '',
                    tenure: r[4] !== undefined && typeof r[4] !== 'string' ? r[4] : (r[4] || ''),
                    startDate: r[5] || '',
                    emi: Number(r[4]) || Number(r[6]) || '',
                    emiPaid: r[7] !== undefined ? r[7] : '',
                    outstanding: Number(r[5]) || Number(r[8]) || '',
                    overdueCharges: r[9] !== undefined ? r[9] : '',
                    bounceCount: r[10] !== undefined ? r[10] : '',
                    obligation: String(r[6] || r[11] || 'yes').toLowerCase() === 'yes' ? 'yes' : 'No',
                    bt: String(r[8] || r[13] || 'no').toLowerCase() === 'yes' ? 'yes' : 'No',
                    emiReflectedIn: r[16] || r[12] || ''
                  });
                }
              }
            }
          }

          if (newEntities.length > 0) state.fdData.entities = newEntities;
          if (newLoans.length > 0) state.fdData.loans = newLoans;

          render();
          fdSaveDatasheet();
          showToast(`Parsed Excel sheet into Financial Matrix! (${newEntities.length} entities, ${newLoans.length} loans)`, 'success');
        } catch (err) {
          showToast('Could not import Excel file: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }
