<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SkyFinserv — Financial Datasheet & Underwriting CAM Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #0D1B2A;
      --navy2: #1A2E45;
      --navy3: #243B55;
      --gold: #F5A623;
      --gold-deep: #D4881A;
      --teal: #00B894;
      --teal-deep: #00897B;
      --blue: #2563EB;
      --paper: #F4F6FA;
      --slate: #4A5568;
      --line: rgba(13, 27, 42, 0.12);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--navy);
    }

    .topbar {
      height: 64px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      color: #fff;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--gold);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }

    .fd-wrapper {
      padding: 24px 32px 60px;
    }

    .fd-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .fd-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .fd-sub {
      color: var(--slate);
      font-size: 13px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color: var(--navy);
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
    }

    .btn-success {
      background: var(--teal);
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--navy);
    }

    .fd-kpi-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 14px;
    }

    .fd-kpi-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .fd-kpi-card:hover {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    .fd-kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: #94a3b8;
    }

    .fd-kpi-card.highlight::before {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    }

    .fd-kpi-card.yellow::before {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
    }

    .fd-kpi-card .fd-kpi-lbl {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .fd-kpi-card .fd-kpi-val {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    .fd-kpi-card.highlight .fd-kpi-val {
      color: #047857;
    }

    .fd-kpi-card.yellow .fd-kpi-val {
      color: #b45309;
    }

    .fd-matrix-container {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      overflow-x: auto;
    }

    .fd-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-family: var(--font-body);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .fd-table th,
    .fd-table td {
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      padding: 6px 10px;
      text-align: left;
      vertical-align: middle;
      transition: background-color 0.15s ease;
    }

    .fd-table tr:last-child td {
      border-bottom: none;
    }

    .fd-header-role {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: #ffffff !important;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      padding: 10px 14px !important;
      border-bottom: 2px solid #0f172a !important;
      letter-spacing: 0.02em;
    }

    .fd-header-role .fd-input {
      color: #ffffff !important;
      font-weight: 700;
      font-size: 13px;
    }

    .fd-remove-btn {
      border: none;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s ease;
      margin-left: 6px;
    }

    .fd-remove-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .fd-header-summary,
    .fd-yellow-hdr {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%) !important;
      color: #78350f !important;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12.5px;
      text-align: center;
      border-bottom: 2px solid #f59e0b !important;
      letter-spacing: 0.03em;
      padding: 10px 14px !important;
    }

    .fd-row-lbl {
      background: #f8fafc !important;
      font-weight: 600;
      color: #334155;
      width: 240px;
      min-width: 240px;
      position: sticky;
      left: 0;
      z-index: 10;
      border-right: 2px solid #cbd5e1 !important;
      box-shadow: 3px 0 6px -2px rgba(0, 0, 0, 0.04);
    }

    tr:hover .fd-row-lbl {
      background: #f1f5f9 !important;
    }

    th.fd-row-lbl {
      background: #0f172a !important;
      color: #f8fafc !important;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      top: 0;
      z-index: 25;
    }

    .fd-entity-cell {
      background: #f1f5f9;
      text-align: center;
    }

    .fd-yellow-col {
      background: #fffbeb !important;
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 700;
      color: #78350f !important;
      border-left: 1px solid #fde68a;
    }

    tr:hover .fd-yellow-col {
      background: #fef3c7 !important;
    }

    .fd-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 12.5px;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #0f172a;
      text-align: inherit;
      transition: all 0.15s ease;
    }

    .fd-input:hover {
      border-color: #cbd5e1;
      background: #ffffff;
    }

    .fd-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .fd-num-input {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .fd-negative {
      color: #dc2626 !important;
      font-weight: 700;
    }

    .fd-bold {
      font-weight: 700;
    }

    .fd-itr-row td {
      background: #e0e7ff !important;
      color: #1e1b4b !important;
      font-weight: 700;
      border-bottom: 2px solid #c7d2fe !important;
    }

    .fd-subtotal-row td {
      background: #ecfdf5 !important;
      color: #065f46 !important;
      font-weight: 700 !important;
      border-top: 2px solid #10b981 !important;
      border-bottom: 2px solid #10b981 !important;
      font-size: 13px;
    }

    .fd-subtotal-row .fd-row-lbl {
      background: #d1fae5 !important;
      color: #065f46 !important;
    }

    .fd-table tbody tr:nth-child(even) td:not(.fd-row-lbl):not(.fd-yellow-col) {
      background-color: #ffffff;
    }

    .fd-table tbody tr:nth-child(odd) td:not(.fd-row-lbl):not(.fd-yellow-col) {
      background-color: #f8fafc;
    }

    .fd-table tbody tr:hover td:not(.fd-row-lbl):not(.fd-yellow-col) {
      background-color: #edf2f7;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-title">SkyFinserv — Financial Underwriting Desk</div>
    </div>
    <div>
      <a href="skyfinserv-app.html"
        style="color:#fff;text-decoration:none;font-weight:600;font-size:13px;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:8px;">←
        Return to Main Portal</a>
    </div>
  </div>

  <div class="fd-wrapper">
    <div class="fd-header">
      <div>
        <h1 class="fd-title">📈 Financial Datasheet (CAM Assessment & Income Matrix)</h1>
        <div class="fd-sub">Multi-applicant 3-year ITR assessment matrix with live 2-Yr Average & Considered Income
          calculations.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="fdResetPreset()">⚡ Reset Matrix</button>
        <button class="btn btn-success" onclick="fdSave()">💾 Save</button>
        <button class="btn btn-amber" onclick="fdExportExcel()">⬇ Export Excel</button>
        <label class="btn btn-ghost" style="cursor:pointer;margin:0;">📁 Import Excel <input type="file"
            accept=".xlsx, .xls" style="display:none;" onchange="fdImportExcel(event)" /></label>
        <button class="btn btn-ghost" onclick="window.print()">📄 Print / PDF</button>
        <button class="btn btn-ghost" id="btn-toggle-underwriting" onclick="toggleUnderwritingSection()"
          style="border:1.5px solid #cbd5e1;font-weight:700;">🔒 Underwriting (Private)</button>
      </div>
    </div>

    <div class="fd-matrix-container" id="matrix-container"></div>
  </div>

  <script>
    function defaultGstFirm(name = '', fy1 = '21-22', fy2 = '22-23') {
      const months = ['April', 'May', 'Jun', 'July', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
      return {
        firmName: name,
        fy1: fy1,
        fy2: fy2,
        months: months.map(m => ({ month: m, fy1: 0, fy2: 0 }))
      };
    }
    window.defaultGstFirm = defaultGstFirm;

    function defaultBlankDatasheet() {
      return {
        title: "Financial & Underwriting CAM Matrix",
        caseRef: "",
        dealSummary: {
          totalSanctioned: 0, totalPos: 0, btPos: 0, collateralMarketValue: 0,
          ltvEligibleLimit: 0, offeredFacility: 0, existingBtEmi: 0, offeredEmi: 0,
          monthlyRelief: 0, liquiditySurplus: 0, netCustomerBenefit: 0
        },
        entities: [
          {
            role: "Applicant", name: "", proprietor: "", doj: "", vintage: "", employer: "", dob: "", age: "", businessAddress: "",
            years: [
              { date: "FY 2024-25", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "FY 2023-24", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 },
              { date: "FY 2022-23", turnover: 0, netIncome: 0, depreciation: 0, interest: 0, rent: 0, addIncome: 0, taxPaid: 0 }
            ]
          }
        ],
        loans: [],
        gstDetailsList: [defaultGstFirm()],
        activeGstIdx: 0,
        propertyValuation: [],
        btAnalysis: [],
        loanPlanComparison: [],
        underwritingModels: [
          { name: "1. Loan Eligibility business or self emp.", foir: 0.60, ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "Cashflow FOIR Method" },
          { name: "2. Loan Eligibility Salaried.", foir: 0.60, ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "Salaried FOIR Method" },
          { name: "3. Loan Eligibility On EMI Base", foir: "-", ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "Clean Track (1.2x Track Method)" },
          { name: "4. Eligibility Based On GTP for Traders & service Provider", foir: 0.60, ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "GTP Traders 5% Margin" },
          { name: "5. Eligibility Based On GTP for Manufacturer", foir: 0.60, ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "GTP Manufacturer 10% Margin" },
          { name: "6. Bank Surrogate", foir: "-", ltv: "-", maxMonthlyEmi: 0, eligibleLoan: 0, logic: "ABB Surrogate Multiplier" },
          { name: "7. LTV Eligibility (Property Collateral Net of POS)", foir: "-", ltv: 0.60, maxMonthlyEmi: "-", eligibleLoan: 0, logic: "LTV Collateral Net of POS" }
        ]
      };
    }

    let fdData = defaultBlankDatasheet();
    try {
      const saved = localStorage.getItem('sf_fd_standalone');
      if (saved) {
        if (saved.toLowerCase().includes('padiya') || saved.toLowerCase().includes('padia') || saved.toLowerCase().includes('govind')) {
          localStorage.removeItem('sf_fd_standalone');
        } else {
          fdData = JSON.parse(saved);
        }
      }
    } catch (e) { }

    if (fdData && Array.isArray(fdData.entities) && fdData.entities.length === 2) {
      const e1 = fdData.entities[0];
      const e2 = fdData.entities[1];
      if (e1 && e2 && e1.role === 'Applicant' && e2.role === 'Applicant' && (!e1.dob || !e1.age) && (e2.dob || e2.age)) {
        fdData.entities = [{
          role: 'Applicant',
          name: e2.name || e1.name,
          proprietor: e1.proprietor || '',
          doj: e1.doj || e2.doj || '',
          vintage: e1.vintage || e2.vintage || '',
          employer: e1.employer || e2.employer || e1.name || '',
          dob: e2.dob || e1.dob || '',
          age: e2.age || e1.age || (e2.dob ? calcAgeFromDob(e2.dob) : (e1.dob ? calcAgeFromDob(e1.dob) : '')) || '',
          businessAddress: e1.businessAddress || e2.businessAddress || '',
          years: (e1.years && e1.years[0] && e1.years[0].turnover) ? e1.years : (e2.years || [])
        }];
      }
    }

    function calculateAge(dobInput) {
      if (!dobInput) return null;
      let d = null;
      if (dobInput instanceof Date) {
        d = dobInput;
      } else if (typeof dobInput === 'string') {
        const s = dobInput.trim();
        if (!s) return null;
        const delimiter = s.includes('-') ? '-' : (s.includes('/') ? '/' : null);
        if (delimiter) {
          const parts = s.split(delimiter);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            } else if (parts[2].length === 4) {
              const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
              const p0 = parseInt(parts[0], 10);
              const mon = isNaN(parts[1]) ? months[parts[1].toLowerCase().slice(0, 3)] : parseInt(parts[1], 10) - 1;
              const yr = parseInt(parts[2], 10);
              d = new Date(yr, mon, p0);
            }
          }
        }
        if (!d || isNaN(d.getTime())) {
          d = new Date(s);
        }
      }
      if (!d || isNaN(d.getTime())) return null;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return (age >= 0 && age < 130) ? age : null;
    }

    function calcAgeFromDob(dobStr) {
      const a = calculateAge(dobStr);
      return a !== null ? String(a) : '';
    }

    function computeTotals(key) {
      let considerSum = 0, yr1yr2Sum = 0;
      fdData.entities.forEach(ent => {
        const y1 = ent.years[0] ? Number(ent.years[0][key]) || 0 : 0;
        const y2 = ent.years[1] ? Number(ent.years[1][key]) || 0 : 0;
        considerSum += y1;
        yr1yr2Sum += (y1 + y2);
      });
      return { considerSum, avg2yr: Math.round(yr1yr2Sum / 2) };
    }

    function computeLoanTotals() {
      const loans = fdData.loans || [];
      let totAmount = 0, totTenure = 0, totEmi = 0, totEmiPaid = 0, totOutstanding = 0, totOverdue = 0, totBounce = 0, totEmiObligation = 0, totBtEmi = 0, totBtAmount = 0;
      loans.forEach(l => {
        const amt = Number(l.amount) || 0;
        const ten = Number(l.tenure) || 0;
        const emi = Number(l.emi) || 0;
        const paid = Number(l.emiPaid) || 0;
        const out = Number(l.outstanding) || 0;
        const ovd = Number(l.overdueCharges) || 0;
        const bnc = Number(l.bounceCount) || 0;

        const isObl = String(l.obligation || '').toLowerCase() === 'yes';
        const isBt = String(l.bt || '').toLowerCase() === 'yes';

        totAmount += amt;
        totTenure += ten;
        totEmi += emi;
        totEmiPaid += paid;
        totOutstanding += out;
        totOverdue += ovd;
        totBounce += bnc;
        totEmiObligation += isObl ? emi : 0;
        totBtEmi += isBt ? emi : 0;
        totBtAmount += isBt ? out : 0;
      });
      return { totAmount, totTenure, totEmi, totEmiPaid, totOutstanding, totOverdue, totBounce, totEmiObligation, totBtEmi, totBtAmount };
    }

    function fdSyncLoanRowDOM(lIdx) {
      if (!fdData.loans || !fdData.loans[lIdx]) return;
      const l = fdData.loans[lIdx];
      const isObl = String(l.obligation || '').toLowerCase() === 'yes';
      const isBt = String(l.bt || '').toLowerCase() === 'yes';
      const emiVal = Number(l.emi) || 0;
      const outVal = Number(l.outstanding) || 0;

      const emiOblVal = isObl ? emiVal : 0;
      const btEmiVal = isBt ? emiVal : 0;
      const btAmtVal = isBt ? outVal : 0;

      const oblCell = document.getElementById(`fd-emi-obl-${lIdx}`);
      if (oblCell) {
        oblCell.innerText = isObl ? (emiOblVal ? formatNum(emiOblVal) : '-') : '-';
        oblCell.style.color = isObl ? '#dc2626' : '#475569';
      }
      const btEmiCell = document.getElementById(`fd-bt-emi-${lIdx}`);
      if (btEmiCell) btEmiCell.innerText = isBt ? (btEmiVal ? formatNum(btEmiVal) : '-') : '-';
      const btAmtCell = document.getElementById(`fd-bt-amt-${lIdx}`);
      if (btAmtCell) btAmtCell.innerText = isBt ? (btAmtVal ? formatNum(btAmtVal) : '-') : '-';

      // Update footer totals
      const totals = computeLoanTotals();
      const elTotAmt = document.getElementById('fd-tot-loan-amt');
      if (elTotAmt) elTotAmt.innerText = formatNum(totals.totAmount);
      const elTotTen = document.getElementById('fd-tot-loan-tenure');
      if (elTotTen) elTotTen.innerText = totals.totTenure || '-';
      const elTotEmi = document.getElementById('fd-tot-loan-emi');
      if (elTotEmi) elTotEmi.innerText = formatNum(totals.totEmi);
      const elTotPaid = document.getElementById('fd-tot-loan-paid');
      if (elTotPaid) elTotPaid.innerText = totals.totEmiPaid || '-';
      const elTotOut = document.getElementById('fd-tot-loan-out');
      if (elTotOut) elTotOut.innerText = formatNum(totals.totOutstanding);
      const elTotOvd = document.getElementById('fd-tot-loan-overdue');
      if (elTotOvd) elTotOvd.innerText = formatNum(totals.totOverdue);
      const elTotBnc = document.getElementById('fd-tot-loan-bounce');
      if (elTotBnc) elTotBnc.innerText = totals.totBounce || '-';
      const elTotObl = document.getElementById('fd-tot-loan-obligation');
      if (elTotObl) elTotObl.innerText = formatNum(totals.totEmiObligation);
      const elTotBtEmi = document.getElementById('fd-tot-loan-bt-emi');
      if (elTotBtEmi) elTotBtEmi.innerText = formatNum(totals.totBtEmi);
      const elTotBtAmt = document.getElementById('fd-tot-loan-bt-amt');
      if (elTotBtAmt) elTotBtAmt.innerText = formatNum(totals.totBtAmount);
    }
    window.fdSyncLoanRowDOM = fdSyncLoanRowDOM;

    function fdUpdateLoanField(lIdx, field, val, liveOnly = false) {
      if (!fdData.loans || !fdData.loans[lIdx]) return;
      const l = fdData.loans[lIdx];
      const numFields = ['amount', 'tenure', 'emi', 'emiPaid', 'outstanding', 'overdueCharges', 'bounceCount'];
      if (numFields.includes(field)) {
        const cleanStr = String(val).replace(/,/g, '').trim();
        const num = cleanStr === '' ? '' : Number(cleanStr);
        l[field] = isNaN(num) ? val : num;
      } else {
        l[field] = val;
      }

      if (liveOnly) {
        fdSyncLoanRowDOM(lIdx);
        return;
      }
      render();
    }
    window.fdUpdateLoanField = fdUpdateLoanField;

    // Format any number/string into Indian comma formatted string: 00,00,000
    function toIndianCommas(val) {
      if (val === null || val === undefined || val === '') return '';
      const str = String(val).replace(/[^0-9.]/g, '');
      if (!str) return '';
      const parts = str.split('.');
      const intPart = parts[0];
      const decPart = parts.length > 1 ? '.' + parts[1].slice(0, 2) : '';
      if (!intPart) return decPart ? '0' + decPart : '';
      const lastThree = intPart.slice(-3);
      const otherNumbers = intPart.slice(0, -3);
      const formatted = (otherNumbers !== '' ? otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + lastThree;
      return formatted + decPart;
    }
    window.toIndianCommas = toIndianCommas;

    function formatNum(val) {
      if (val === undefined || val === null || val === '' || val === 0) return '-';
      const num = Number(val);
      if (isNaN(num)) return val;
      if (num < 0) return `(${Math.abs(num).toLocaleString('en-IN')})`;
      return num.toLocaleString('en-IN');
    }

    /* Debounced render – updates DOM only after user stops typing for 600ms */
    let _debouncedRenderTimer = null;
    function debouncedRender() {
      clearTimeout(_debouncedRenderTimer);
      _debouncedRenderTimer = setTimeout(() => render(), 600);
    }

    function fdUpdateEmiCalc(field, val) {
      if (!fdData.emiCalculator) fdData.emiCalculator = {};
      const num = val === '' ? '' : Number(val);
      fdData.emiCalculator[field] = isNaN(num) ? val : num;
      if (field === 'loanAmount' || field === 'roi' || field === 'tenureMonths') {
        const ec = fdData.emiCalculator;
        const P = Number(ec.loanAmount) || 0;
        const annRoi = Number(ec.roi) || 0;
        const n = Number(ec.tenureMonths) || 0;
        if (P > 0 && annRoi > 0 && n > 0) {
          const r = annRoi / 12 / 100;
          ec.calculatedEmi = Math.round(P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1));
        } else if (P === 0 || annRoi === 0 || n === 0) {
          ec.calculatedEmi = 0;
        }
        document.querySelectorAll('.cam-emi-calculated-val').forEach(el => {
          el.value = ec.calculatedEmi || 0;
        });
      }
      debouncedRender();

          totFy2 += (Number(m.fy2) || 0);

      return { totFy1, totFy2 };

    function fdImportExcel(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const newEntities = [];
          const newLoans = [];

          // 1. Parse Business Details sheet
          const bizSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('business') || s.toLowerCase().includes('cam') || s.toLowerCase().includes('financial')) || workbook.SheetNames[0];
          const bizSheet = workbook.Sheets[bizSheetName];
          if (bizSheet) {
            const rows = XLSX.utils.sheet_to_json(bizSheet, { header: 1 });
            if (rows && rows.length > 2) {
              let roleRowIdx = -1, nameRowIdx = -1, dojRowIdx = -1, empRowIdx = -1, dobRowIdx = -1, addrRowIdx = -1, dateRowIdx = -1;
              const keyRowIndices = {};

              rows.forEach((r, idx) => {
                if (!r || !r[0]) return;
                const label = String(r[0]).trim().toLowerCase();
                if (label.includes('financial parameter') || label.includes('role') || label.includes('business details')) roleRowIdx = idx;
                if (label === 'name') nameRowIdx = idx;
                if (label.includes('doj') || label.includes('vintage')) dojRowIdx = idx;
                if (label.includes('business') && label.includes('employer')) empRowIdx = idx;
                if (label.includes('dob') || label.includes('age')) dobRowIdx = idx;
                if (label.includes('address')) addrRowIdx = idx;
                if (label.includes('itr') || label.includes('salary date')) dateRowIdx = idx;

                if (label.includes('turnover')) keyRowIndices['turnover'] = idx;
                if (label.includes('net business') || label.includes('net income') || label.includes('salary income')) keyRowIndices['netIncome'] = idx;
                if (label.includes('depreciation')) keyRowIndices['depreciation'] = idx;
                if (label.includes('interest')) keyRowIndices['interest'] = idx;
                if (label.includes('rent')) keyRowIndices['rent'] = idx;
                if (label.includes('additional income') || label.includes('remuneration')) keyRowIndices['addIncome'] = idx;
                if (label.includes('tax paid')) keyRowIndices['taxPaid'] = idx;
              });

              if (nameRowIdx !== -1) {
                const nameRow = rows[nameRowIdx];
                const roleRow = roleRowIdx !== -1 ? rows[roleRowIdx] : [];
                const dojRow = dojRowIdx !== -1 ? rows[dojRowIdx] : [];
                const empRow = empRowIdx !== -1 ? rows[empRowIdx] : [];
                const dobRow = dobRowIdx !== -1 ? rows[dobRowIdx] : [];
                const addrRow = addrRowIdx !== -1 ? rows[addrRowIdx] : [];
                const dateRow = dateRowIdx !== -1 ? rows[dateRowIdx] : [];

                for (let col = 1; col < nameRow.length; col += 3) {
                  const nameVal = nameRow[col];
                  if (!nameVal || String(nameVal).toLowerCase().includes('consider') || String(nameVal).toLowerCase().includes('average')) continue;

                  const roleVal = (roleRow && roleRow[col]) ? String(roleRow[col]) : 'Applicant';
                  const dojVal = (dojRow && dojRow[col]) ? String(dojRow[col]) : '';
                  const vintageVal = (dojRow && dojRow[col + 1]) ? String(dojRow[col + 1]) : '';
                  const empVal = (empRow && empRow[col]) ? String(empRow[col]) : '';
                  const dobVal = (dobRow && dobRow[col]) ? String(dobRow[col]) : '';
                  const ageVal = (dobRow && dobRow[col + 1]) ? String(dobRow[col + 1]) : (dobVal ? calcAgeFromDob(dobVal) : '');
                  const addrVal = (addrRow && addrRow[col]) ? String(addrRow[col]) : '';

                  const y1Date = (dateRow && dateRow[col]) ? String(dateRow[col]) : '31-Oct-25';
                  const y2Date = (dateRow && dateRow[col + 1]) ? String(dateRow[col + 1]) : '23-Oct-24';
                  const y3Date = (dateRow && dateRow[col + 2]) ? String(dateRow[col + 2]) : '14-Oct-23';

                  const getVal = (key, cOffset) => {
                    const rIdx = keyRowIndices[key];
                    if (rIdx !== undefined && rows[rIdx]) {
                      const raw = rows[rIdx][col + cOffset];
                      return Number(raw) || 0;
                    }
                    return 0;
                  };

                  newEntities.push({
                    role: roleVal,
                    name: String(nameVal),
                    doj: dojVal,
                    vintage: vintageVal,
                    employer: empVal,
                    dob: dobVal,
                    age: ageVal,
                    businessAddress: addrVal,
                    years: [
                      { date: y1Date, turnover: getVal('turnover', 0), netIncome: getVal('netIncome', 0), depreciation: getVal('depreciation', 0), interest: getVal('interest', 0), rent: getVal('rent', 0), addIncome: getVal('addIncome', 0), taxPaid: getVal('taxPaid', 0) },
                      { date: y2Date, turnover: getVal('turnover', 1), netIncome: getVal('netIncome', 1), depreciation: getVal('depreciation', 1), interest: getVal('interest', 1), rent: getVal('rent', 1), addIncome: getVal('addIncome', 1), taxPaid: getVal('taxPaid', 1) },
                      { date: y3Date, turnover: getVal('turnover', 2), netIncome: getVal('netIncome', 2), depreciation: getVal('depreciation', 2), interest: getVal('interest', 2), rent: getVal('rent', 2), addIncome: getVal('addIncome', 2), taxPaid: getVal('taxPaid', 2) }
                    ]
                  });
                }
              }
            }
          }

          // 2. Parse Loan Details sheet
          const loanSheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('loan') || s.toLowerCase().includes('obligation') || s.toLowerCase().includes('bt'));
          const loanSheet = loanSheetName ? workbook.Sheets[loanSheetName] : null;
          if (loanSheet) {
            const lRows = XLSX.utils.sheet_to_json(loanSheet, { header: 1 });
            if (lRows && lRows.length > 1) {
              let headerFound = false;
              for (const r of lRows) {
                if (!r || r.length === 0) continue;
                const col0 = String(r[0] || '').trim();
                if (col0.toLowerCase().includes('loan belows') || col0.toLowerCase().includes('loan belongs') || col0.toLowerCase().includes('borrower')) {
                  headerFound = true;
                  continue;
                }
                if (headerFound) {
                  if (!col0 || col0.toLowerCase().includes('total') || col0.toLowerCase().includes('principle') || col0.toLowerCase().includes('plan') || col0.toLowerCase().includes('eligibility')) break;
                  newLoans.push({
                    loanBelongsTo: col0,
                    loanProvider: r[1] || '',
                    type: r[2] || '',
                    amount: Number(r[3]) || '',
                    tenure: r[4] !== undefined && typeof r[4] !== 'string' ? r[4] : (r[4] || ''),
                    startDate: r[5] || '',
                    emi: Number(r[4]) || Number(r[6]) || '',
                    emiPaid: r[7] !== undefined ? r[7] : '',
                    outstanding: Number(r[5]) || Number(r[8]) || '',
                    overdueCharges: r[9] !== undefined ? r[9] : '',
                    bounceCount: r[10] !== undefined ? r[10] : '',
                    obligation: String(r[6] || r[11] || 'yes').toLowerCase() === 'yes' ? 'yes' : 'No',
                    bt: String(r[8] || r[13] || 'no').toLowerCase() === 'yes' ? 'yes' : 'No',
                    emiReflectedIn: r[16] || r[12] || ''
                  });
                }
              }
            }
          }

          if (newEntities.length > 0) fdData.entities = newEntities;
          if (newLoans.length > 0) fdData.loans = newLoans;

          render();
          alert(`Successfully imported Excel sheet into Financial Datasheet! (${newEntities.length} entities, ${newLoans.length} loans parsed)`);
        } catch (err) {
          alert('Could not import Excel file: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    render();

    /* ── Property Valuation CRUD ── */
    function fdAddPropertyRow() {
      if (!fdData.propertyValuation) fdData.propertyValuation = [];
      fdData.propertyValuation.push({
        propertyType: '',
        owner: '',
        label: '',
        area: '',
        constructionArea: '',
        rate: '',
        constructionRate: '',
        totalValue: '',
        ltv: 70,
        eligible: ''
      });
      render();
    }
    function fdRemovePropertyRow(idx) {
      if (!fdData.propertyValuation) return;
      fdData.propertyValuation.splice(idx, 1);
      render();
    }
    function fdUpdatePropertyField(idx, field, val) {
      if (!fdData.propertyValuation || !fdData.propertyValuation[idx]) return;
      const num = val === '' ? '' : Number(val);
      if (field === 'ltv') {
        fdData.propertyValuation[idx][field] = val === '' ? '' : (isNaN(num) ? val : Math.round(num));
      } else if (field === 'propertyType' || field === 'owner' || field === 'label') {
        fdData.propertyValuation[idx][field] = val;
        if (field === 'propertyType') fdData.propertyValuation[idx].label = val;
      } else {
        fdData.propertyValuation[idx][field] = (isNaN(num) ? val : num);
      }
      const p = fdData.propertyValuation[idx];
      const lVal = (Number(p.area) || 0) * (Number(p.rate) || 0);
      const bVal = (Number(p.constructionArea) || 0) * (Number(p.constructionRate) || 0);
      p.totalValue = lVal + bVal;
      const rawLtv = Number(p.ltv);
      const ltvFactor = rawLtv > 1 ? rawLtv / 100 : (rawLtv > 0 ? rawLtv : 0.70);
      if (field === 'eligible') {
        const elig = Number(p.eligible) || 0;
        if (p.totalValue > 0 && elig > 0) {
          p.ltv = Math.round((elig / p.totalValue) * 100);
        }
      } else if (field === 'area' || field === 'rate' || field === 'constructionArea' || field === 'constructionRate') {
        if (Number(p.eligible) > 0 && p.totalValue > 0) {
          p.ltv = Math.round((Number(p.eligible) / p.totalValue) * 100);
        } else if (p.totalValue > 0) {
          p.eligible = Math.round(p.totalValue * ltvFactor);
        }
      } else if (field === 'totalValue') {
        if (Number(p.eligible) > 0 && Number(p.totalValue) > 0) {
          p.ltv = Math.round((Number(p.eligible) / Number(p.totalValue)) * 100);
        } else if (Number(p.totalValue) > 0) {
          p.eligible = Math.round(Number(p.totalValue) * ltvFactor);
        }
      } else if (field === 'ltv') {
        p.eligible = Math.round(p.totalValue * ltvFactor);
      }
      render();
    }

    /* ── BT Benefit CRUD ── */
    function fdAddBtRow() {
      if (!fdData.btAnalysis) fdData.btAnalysis = [];
      fdData.btAnalysis.push({ bank: '', principal: '', existingRoi: '', existingEmi: '', pendingTenure: '', totalPayExisting: '', interestExisting: '', fcPercent: '', fcCharges: '', offeredRoi: '', offeredEmi: '', totalPayOffered: '', interestOffered: '', pfStampPercent: '', pfStampCharges: '', netBenefit: '' });
      render();
    }
    function fdRemoveBtRow(idx) {
      if (!fdData.btAnalysis) return;
      fdData.btAnalysis.splice(idx, 1);
      render();
    }
    function fdUpdateBtField(idx, field, val) {
      if (!fdData.btAnalysis || !fdData.btAnalysis[idx]) return;
      const num = val === '' ? '' : Number(val);
      fdData.btAnalysis[idx][field] = isNaN(num) ? val : num;
      const r = fdData.btAnalysis[idx];
      const p = Number(r.principal) || 0;
      const eEmi = Number(r.existingEmi) || 0;
      const pt = Number(r.pendingTenure) || 0;
      const oEmi = Number(r.offeredEmi) || 0;

      r.totalPayExisting = eEmi * pt;
      r.interestExisting = r.totalPayExisting - p;
      r.totalPayOffered = oEmi * pt;
      r.interestOffered = r.totalPayOffered - p;
      r.fcCharges = Math.round(p * (Number(r.fcPercent) || 0) / 100 * 100) / 100;
      r.pfStampCharges = Math.round(p * (Number(r.pfStampPercent) || 0) / 100 * 100) / 100;
      r.netBenefit = Math.round(((r.interestExisting - r.interestOffered) - r.fcCharges - r.pfStampCharges) * 100) / 100;
      render();
    }


    /* ── Import BT Worksheet (.xlsx) ── */
    function fdImportBtWorksheet(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });

          // Existing Loan Portfolio Sheet
          const loanSheetName = wb.SheetNames.find(s => s.includes('2') || s.toLowerCase().includes('loan'));
          if (loanSheetName) {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[loanSheetName], { header: 1 });
            const parsedLoans = [];
            for (let i = 3; i < rows.length; i++) {
              const r = rows[i];
              if (!r || !r[0] || String(r[0]).toUpperCase().includes('TOTAL')) break;
              parsedLoans.push({
                loanBelongsTo: r[0] || '', loanProvider: r[1] || '', type: r[2] || '',
                amount: Number(r[3]) || '', tenure: r[4] || '', startDate: r[5] || '',
                emi: Number(r[6]) || '', emiPaid: r[7] || '', outstanding: Number(r[8]) || '',
                overdueCharges: 0, bounceCount: 0, obligation: String(r[9] || 'No'), bt: String(r[10] || 'No'),
                emiReflectedIn: r[11] || ''
              });
            }
            if (parsedLoans.length) fdData.loans = parsedLoans;
          }

          // Collateral & LTV Sheet
          const propSheetName = wb.SheetNames.find(s => s.includes('3') || s.toLowerCase().includes('collateral'));
          if (propSheetName) {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[propSheetName], { header: 1 });
            const parsedProps = [];
            for (let i = 3; i < rows.length; i++) {
              const r = rows[i];
              if (!r || !r[0] || String(r[0]).toUpperCase().includes('TOTAL')) break;
              parsedProps.push({
                label: r[0] || '', area: Number(r[1]) || '', rate: Number(r[2]) || '',
                constructionArea: Number(r[4]) || 0, constructionRate: Number(r[5]) || 0,
                totalValue: Number(r[7]) || 0, ltv: Number(r[8]) || 0.70, eligible: Number(r[9]) || 0
              });
            }
            if (parsedProps.length) fdData.propertyValuation = parsedProps;
          }

          // BT Benefit Analysis Sheet
          const btSheetName = wb.SheetNames.find(s => s.includes('4') || s.toLowerCase().includes('benefit'));
          if (btSheetName) {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[btSheetName], { header: 1 });
            const parsedBt = [];
            for (let i = 3; i < rows.length; i++) {
              const r = rows[i];
              if (!r || !r[0] || String(r[0]).toUpperCase().includes('TOTAL')) break;
              parsedBt.push({
                bank: r[0] || '', principal: Number(r[1]) || 0,
                existingRoi: Number(r[2]) ? (Number(r[2]) > 1 ? Number(r[2]) : Number(r[2]) * 100) : '',
                existingEmi: Number(r[3]) || 0, pendingTenure: Number(r[4]) || 0,
                totalPayExisting: Number(r[5]) || 0, interestExisting: Number(r[6]) || 0,
                fcPercent: Number(r[7]) ? (Number(r[7]) > 1 ? Number(r[7]) : Number(r[7]) * 100) : 0,
                fcCharges: Number(r[8]) || 0,
                offeredRoi: Number(r[9]) ? (Number(r[9]) > 1 ? Number(r[9]) : Number(r[9]) * 100) : '',
                offeredEmi: Number(r[10]) || 0, totalPayOffered: Number(r[11]) || 0,
                interestOffered: Number(r[12]) || 0,
                pfStampPercent: Number(r[13]) ? (Number(r[13]) > 1 ? Number(r[13]) : Number(r[13]) * 100) : 0,
                pfStampCharges: Number(r[14]) || 0, netBenefit: Number(r[15]) || 0
              });
            }
            if (parsedBt.length) fdData.btAnalysis = parsedBt;
          }

          // Underwriting Sheet
          const uwSheetName = wb.SheetNames.find(s => s.includes('6') || s.toLowerCase().includes('underwriting'));
          if (uwSheetName) {
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[uwSheetName], { header: 1 });
            const parsedUw = [];
            for (let i = 5; i < rows.length; i++) {
              const r = rows[i];
              if (!r || !r[0] || String(r[0]).toUpperCase().includes('RECOMMENDED')) continue;
              parsedUw.push({
                name: r[0] || '', foir: r[1] !== undefined ? r[1] : '-', ltv: r[2] !== undefined ? r[2] : '-',
                maxMonthlyEmi: r[3] !== undefined ? r[3] : '-', eligibleLoan: Number(r[4]) || 0, logic: r[5] || ''
              });
            }
            if (parsedUw.length) fdData.underwritingModels = parsedUw;
          }

          alert('Successfully imported SkyFinserv BT Worksheet!');
          render();
        } catch (err) {
          alert('Import error: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    /* ── Export Full Workbook ── */
    function fdExportFullWorkbook() {
      try {
        window.open('/SkyFinserv_Optimized_BT_Worksheet.xlsx', '_blank');
      } catch (e) {
        fdExportExcel();
      }
    }
  </script>
